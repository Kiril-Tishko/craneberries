<title>Ride or Drive?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
  /* One idea per screen. drive = blue (you sit IN it), ride = amber (you sit ON it),
     words that are already verbs (ski, skate, surf) = teal. The background glow follows the part of the lesson. */
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --ink: #161b26;
    --muted: #697186;
    --line: #dde1e9;
    --drive: #2251c4;
    --drive-soft: #d6e1ff;
    --ride: #a85400;
    --ride-soft: #ffdcae;
    --verb: #0e7c74;
    --verb-soft: #c2ece6;
    --ok: #1d8549;
    --ok-soft: #d3f2df;
    --bad: #c3372b;
    --f-disp: "Unbounded", "Arial Black", system-ui, sans-serif;
    --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a;
      --surface: #1a1f2a;
      --ink: #eef1f7;
      --muted: #8c94a8;
      --line: #2b313e;
      --drive: #8eb0ff;
      --drive-soft: #1e3263;
      --ride: #ffb757;
      --ride-soft: #4d3313;
      --verb: #5fd3c8;
      --verb-soft: #17423f;
      --ok: #5fd394;
      --ok-soft: #173d29;
      --bad: #ff7d70;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a;
    --surface: #1a1f2a;
    --ink: #eef1f7;
    --muted: #8c94a8;
    --line: #2b313e;
    --drive: #8eb0ff;
    --drive-soft: #1e3263;
    --ride: #ffb757;
    --ride-soft: #4d3313;
    --verb: #5fd3c8;
    --verb-soft: #17423f;
    --ok: #5fd394;
    --ok-soft: #173d29;
    --bad: #ff7d70;
    color-scheme: dark;
  }

  html { box-sizing: border-box; height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    --c: var(--ink);
    --glow: var(--line);
  }
  body[data-mode="drive"] { --c: var(--drive); --glow: var(--drive-soft); }
  body[data-mode="ride"]  { --c: var(--ride);  --glow: var(--ride-soft); }
  body[data-mode="verb"]  { --c: var(--verb);  --glow: var(--verb-soft); }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(55% 45% at 50% 46%, color-mix(in srgb, var(--glow) 70%, transparent), transparent 75%);
    transition: background .4s;
  }

  #stage {
    height: 100%;
    display: grid;
    place-items: center;
    padding-block: 56px 104px;
    overflow-y: auto;
    text-align: center;
  }
  .slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2.5vh, 28px);
    width: 100%;
    max-width: 1100px;
    min-width: 0;
    animation: rise .3s cubic-bezier(.2, .7, .3, 1);
  }
  .slide.wide { max-width: 680px; }
  .slide > * { max-width: 100%; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  p { margin: 0; }

  .xl, .l { font-family: var(--f-disp); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .xl { font-size: clamp(2.5rem, 11vw, 7.5rem); }
  .l  { font-size: clamp(1.8rem, 6.2vw, 4.4rem); }
  .m  { font-size: clamp(1.75rem, 5.6vw, 4.2rem); font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
  .formula {
    font-size: clamp(1rem, 2.6vw, 1.5rem);
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .sub { font-size: clamp(1.2rem, 3.4vw, 2.1rem); font-weight: 800; }
  .pic { font-family: var(--f-emoji); font-size: clamp(3.2rem, 12vw, 6.4rem); line-height: 1.1; }

  .hl { color: var(--k); background: linear-gradient(transparent 56%, var(--ks) 56%); padding: 0 .05em; border-radius: .12em; }
  .hl.d { --k: var(--drive); --ks: var(--drive-soft); }
  .hl.r { --k: var(--ride);  --ks: var(--ride-soft); }
  .hl.g { --k: var(--verb);  --ks: var(--verb-soft); }
  .x { color: var(--muted); text-decoration: line-through; text-decoration-thickness: .07em; }
  .ok-mark { color: var(--ok); }

  .uk {
    display: block;
    text-wrap: balance;
    font-size: clamp(1.1rem, 3vw, 1.9rem);
    font-weight: 600;
    color: var(--ink);
    visibility: hidden;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .uk.on { visibility: visible; opacity: 1; transform: none; }
  .tag {
    display: inline-block;
    margin-right: .6em;
    vertical-align: .15em;
    font-size: .55em;
    font-weight: 800;
    letter-spacing: .12em;
    padding: .35em .6em;
    border-radius: 999px;
    color: var(--c);
    background: color-mix(in srgb, var(--glow) 80%, transparent);
  }
  .hint { font-size: clamp(1rem, 2.6vw, 1.6rem); font-weight: 600; color: var(--muted); }

  input {
    font: inherit;
    color: var(--c);
    background: transparent;
    border: none;
    border-bottom: .07em solid var(--line);
    border-radius: 0;
    outline: none;
    text-align: center;
    padding: 0 .1em;
    min-width: 2.5ch;
    max-width: 100%;
  }
  input:focus { border-bottom-color: var(--c); }
  input.ok { color: var(--ok); border-bottom-color: var(--ok); }
  input.bad { color: var(--bad); border-bottom-color: var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .answer { font-size: clamp(1rem, 2.8vw, 1.7rem); font-weight: 700; color: var(--ok); min-height: 1.4em; }

  .blank { display: inline-block; min-width: 3.5ch; line-height: 1.1; border-bottom: .07em solid var(--line); }
  .blank.ok { color: var(--ok); border-bottom-color: var(--ok); padding: 0 .1em; }

  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px clamp(14px, 4vw, 40px); width: 100%; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
  .tile {
    font: 700 clamp(1rem, 2.6vw, 1.35rem)/1.2 var(--f-body);
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: .7em .6em;
    cursor: pointer;
    overflow-wrap: anywhere;
    transition: border-color .15s, background .15s, opacity .3s;
  }
  .opts .tile { min-width: min(8em, 42%); padding: .75em 1.1em; font-size: clamp(1.1rem, 3vw, 1.6rem); }
  .tile:hover { border-color: var(--muted); }
  .tile.sel { border-color: var(--c); background: color-mix(in srgb, var(--glow) 50%, var(--surface)); }
  .tile.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); opacity: .6; cursor: default; }
  .opts .tile.done { opacity: 1; }
  .tile.bad { color: var(--bad); border-color: var(--bad); animation: shake .3s; }
  .tile:disabled:not(.done) { opacity: .45; cursor: default; }

  .sheet {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 18px 22px;
    align-items: center;
    width: 100%;
    text-align: left;
  }
  .sheet .lab { font-family: var(--f-disp); font-weight: 700; font-size: clamp(1.1rem, 3vw, 1.7rem); white-space: nowrap; text-align: right; }
  .sheet .items { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  .it {
    font-weight: 700;
    font-size: clamp(.95rem, 2.4vw, 1.2rem);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: .35em .8em;
    white-space: nowrap;
  }
  .it .e { font-family: var(--f-emoji); margin-right: .3em; }
  .sheet + .uk { font-size: clamp(1rem, 2.6vw, 1.5rem); }
  @media (max-width: 560px) {
    .sheet { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .sheet .lab { text-align: left; margin-top: 10px; }
  }

  #bar {
    position: fixed;
    left: 0;
    top: env(safe-area-inset-top, 0px);
    height: 4px;
    width: 0;
    background: var(--c);
    border-radius: 0 4px 4px 0;
    transition: width .3s, background .3s;
  }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .nav {
    width: 48px;
    height: 48px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .nav:hover { border-color: var(--muted); }
  .nav:disabled { opacity: .35; cursor: default; }
  #act {
    font: 700 1rem/1 var(--f-body);
    letter-spacing: .02em;
    color: var(--surface);
    background: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 15px 26px;
    cursor: pointer;
  }
  #act[aria-pressed="true"] { color: var(--ink); background: var(--glow); }
  #act[hidden] { display: block !important; visibility: hidden; }
  button:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<main id="stage" aria-live="polite"></main>
<div id="bar"></div>
<div class="dock">
  <button class="nav" id="prev" aria-label="Back">&#8592;</button>
  <button id="act" type="button" hidden>Translate</button>
  <button class="nav" id="next" aria-label="Next">&#8594;</button>
</div>

<script>
// Slide kinds: text (rule or sentence, optional picture), noun (thing → verb), pick (tap the right word),
// fill (type the blank ___), match (connect to Ukrainian), sheet (summary).
// [d:…] = drive colour, [r:…] = ride colour, [g:…] = verb colour.
const T = (h, uk, size = 'l', pic) => ({ t: 'text', h, uk, size, pic });
const V = (pic, verb, obj, uk) => ({ t: 'text', pic, h: `[${verb[0]}:${verb}] ${obj}`, uk, size: 'l' });
const N = (pic, noun, verb, ing, uk) => ({ t: 'noun', pic, noun, verb, ing, uk });
const P = (q, o, a) => ({ t: 'pick', q, o, a });
const F = (q, a, hint) => ({ t: 'fill', q, a: [].concat(a), hint });
const RD = ['ride', 'drive'];
const OK = ' <span class="ok-mark">✓</span>';

const parts = [
  ['intro', [
    T('[r:ride] or [d:drive]?', 'Обидва слова — «їздити». Але це різні слова!', 'xl'),
  ]],
  ['drive', [
    T('[d:drive]', 'drive = керувати, бути за кермом', 'xl'),
    T('You sit <b>IN</b> it.<br>You hold the wheel.', 'Ти сидиш всередині й тримаєш кермо.', 'l', '🚗'),
    V('🚗', 'drive', 'a car', 'керувати машиною'),
    V('🚌', 'drive', 'a bus', 'водити автобус'),
    V('🚕', 'drive', 'a taxi', 'водити таксі'),
    V('🚚', 'drive', 'a truck', 'водити вантажівку'),
    V('🚜', 'drive', 'a tractor', 'водити трактор'),
    T('My dad [d:drives] a bus.<br>He is a bus [d:driver].', 'Мій тато водить автобус. Він водій автобуса.', 'm'),
  ]],
  ['ride', [
    T('[r:ride]', 'ride = їздити верхи, сидячи зверху', 'xl'),
    T('You sit <b>ON</b> it.<br>One leg on each side.', 'Ти сидиш зверху, ноги з обох боків.', 'l', '🚲'),
    V('🚲', 'ride', 'a bike', 'їздити на велосипеді'),
    V('🛴', 'ride', 'a scooter', 'їздити на самокаті'),
    V('🐎', 'ride', 'a horse', 'їздити верхи на коні'),
    V('🐪', 'ride', 'a camel', 'їздити на верблюді'),
    V('🏍️', 'ride', 'a motorbike', 'їздити на мотоциклі'),
    T('A motorbike has an engine,<br>but you sit <b>ON</b> it → [r:ride]', 'У мотоцикла є мотор, але ти сидиш зверху → ride', 'm', '🏍️'),
    T('I [r:ride] my bike<br>to school.', 'Я їжджу до школи на велосипеді.', 'm'),
  ]],
  ['mix', [
    T('<b>IN</b> → [d:drive]<br><b>ON</b> → [r:ride]', 'всередині → drive · зверху → ride', 'l', '🚗 🚲'),
    P('I ___ a bike.', RD, 'ride'),
    P('Can you ___ a car?', RD, 'drive'),
    P('She wants to ___ a horse.', RD, 'ride'),
    P('Bus drivers ___ buses.', RD, 'drive'),
    P("Let's ___ our scooters to the park.", RD, 'ride'),
    P('My brother can ___ a motorbike.', RD, 'ride'),
    P('Farmers ___ tractors.', RD, 'drive'),
    P('In the desert, people ___ camels.', RD, 'ride'),
    P('I want to ___ a truck one day.', RD, 'drive'),
    T('Not the driver?', 'Ти не за кермом? Ти пасажир.', 'l', '🚌'),
    T('I go to school<br><b>by</b> bus.', 'Я їжджу до школи автобусом.', 'm'),
    T('<b>by</b> car · <b>by</b> bus<br><b>by</b> train · <b>by</b> taxi', 'машиною · автобусом · потягом · на таксі', 'm'),
  ]],
  ['verb', [
    T('skis → [g:ski]', 'лижі → кататися на лижах. Одне слово!', 'xl'),
    T(`<span class="x">I ride skis.</span><br>I [g:ski].${OK}`, 'Не «ride skis». Просто: I ski — я катаюся на лижах.', 'l'),
    N('⛷️', 'skis', 'ski', 'skiing', 'кататися на лижах'),
    N('⛸️', 'ice skates', 'ice skate', 'ice skating', 'кататися на ковзанах'),
    N('🏂', 'a snowboard', 'snowboard', 'snowboarding', 'кататися на сноуборді'),
    N('🛹', 'a skateboard', 'skateboard', 'skateboarding', 'кататися на скейті'),
    N('🏄', 'a surfboard', 'surf', 'surfing', 'займатися серфінгом'),
    N('🛷', 'a sledge', 'sledge', 'sledging', 'кататися на санчатах'),
    N('🚲', 'a bike', 'bike', 'biking', 'їздити на велосипеді'),
    T('I [r:ride] a bike<br>= I [g:bike]<br>= I [g:cycle]', 'Усі три варіанти правильні!', 'm', '🚲'),
    T('I [r:ride] a skateboard<br>= I [g:skateboard]', 'Обидва варіанти правильні!', 'm', '🛹'),
    T('go + [g:-ing]', 'go skiing = поїхати кататися на лижах', 'xl'),
    T("Let's go [g:skiing]!", 'Ходімо кататися на лижах!', 'm'),
    T('We go [g:skating]<br>every Sunday.', 'Ми катаємося на ковзанах щонеділі.', 'm'),
    T('ski → ski[g:ing]<br>skate → skat[g:ing]', 'skiing — дві i · skating — літера e зникає', 'l'),
    P('In winter we ___.', ['ride skis', 'ski'], 'ski'),
    P('We ___ on the lake in winter.', ['skate', 'ride skates'], 'skate'),
    P("Let's go ___!", ['snowboarding', 'riding a snowboard'], 'snowboarding'),
  ]],
  ['mix', [
    T('[r:ride] → [r:rode]<br>[d:drive] → [d:drove]', 'Минулий час (вчора, минулого літа…)', 'l'),
    T('Yesterday Tom [r:rode]<br>his bike.', 'Учора Том їздив на велосипеді.', 'm'),
    T('Yesterday my mum [d:drove]<br>to work.', 'Учора мама поїхала на роботу машиною (за кермом).', 'm'),
    { t: 'sheet', uk: 'drive — всередині · ride — зверху · I ski — без ride · go by — пасажир', rows: [
      ['[d:drive] a', [['🚗', 'car'], ['🚌', 'bus'], ['🚕', 'taxi'], ['🚚', 'truck'], ['🚜', 'tractor']]],
      ['[r:ride] a', [['🚲', 'bike'], ['🛴', 'scooter'], ['🐎', 'horse'], ['🐪', 'camel'], ['🏍️', 'motorbike']]],
      ['go by', [['🚌', 'bus'], ['🚗', 'car'], ['🚆', 'train'], ['🚕', 'taxi']]],
      ['I [g:…]', [['⛷️', 'ski'], ['⛸️', 'ice skate'], ['🏂', 'snowboard'], ['🛹', 'skateboard'], ['🏄', 'surf'], ['🛷', 'sledge']]],
    ] },
    F('I ___ my bike to school.', 'ride', 'ride / drive'),
    F('My mum ___ a car.', 'drives', 'ride / drive'),
    F('He ___ a motorbike.', 'rides', 'ride / drive'),
    F("Let's go ___!", 'skiing', '⛷️'),
    F('Can you ___?', ['ice skate', 'skate'], '⛸️'),
    F('In summer I go ___.', 'surfing', '🏄'),
    F('I go to school ___ bus.', 'by'),
    F('Yesterday I ___ a horse.', 'rode', 'ride'),
    F('My dad ___ to work yesterday.', 'drove', 'drive'),
    F('___', 'My sister rides a horse.', 'my sister / ride / a horse'),
    F('___', 'My dad drives a bus.', 'my dad / drive / a bus'),
    F('___', ['We go skiing in winter.', 'In winter we go skiing.'], 'we / go / ski / in winter'),
    { t: 'match', pairs: [
      ['drive a car', 'керувати машиною'],
      ['ride a bike', 'їздити на велосипеді'],
      ['ride a horse', 'їздити верхи'],
      ['ski', 'кататися на лижах'],
      ['ice skate', 'кататися на ковзанах'],
      ['go by bus', 'їхати автобусом'],
    ] },
    T("Say it:<br>I can ___.<br>I can't ___.", 'Скажи: Я вмію … Я не вмію …', 'm'),
    T('Great job!', 'Молодець!', 'xl'),
  ]],
];
const slides = parts.flatMap(([mode, list]) => list.map(s => ({ ...s, mode })));

const $ = s => document.querySelector(s);
const stage = $('#stage'), bar = $('#bar'), act = $('#act'), prev = $('#prev'), next = $('#next');
const hl = (k, w) => `<span class="hl ${k}">${w}</span>`;
const fmt = h => h.replace(/\[([a-z]):([^\]]+)\]/g, (_, k, w) => hl(k, w));
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/-/g, ' ').replace(/[.?!,]+$/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const ukLine = s => s.uk ? `<p class="uk" lang="uk"><span class="tag">UA</span>${s.uk}</p>` : '';
const picEl = s => s.pic ? `<p class="pic" aria-hidden="true">${s.pic}</p>` : '';

let i = 0;
let onAct = null;

function setAct(label, fn, pressed) {
  act.hidden = !fn;
  act.textContent = label || '';
  act.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  onAct = fn;
}

function toggleUk() {
  const els = stage.querySelectorAll('.uk');
  if (!els.length) return;
  const on = !els[0].classList.contains('on');
  els.forEach(el => el.classList.toggle('on', on));
  setAct(on ? 'Hide' : 'Translate', toggleUk, on);
}

// Shrink a line only when one long word is wider than the screen.
function fit() {
  stage.querySelectorAll('.xl, .l, .m').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth > el.clientWidth + 1) {
      const fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(14, fs * el.clientWidth / el.scrollWidth * 0.97) + 'px';
    }
  });
}

function render() {
  const s = slides[i];
  document.body.dataset.mode = s.mode;
  bar.style.width = ((i + 1) / slides.length * 100) + '%';
  prev.disabled = i === 0;
  next.disabled = i === slides.length - 1;
  setAct(null, null);
  stage.scrollTop = 0;

  if (s.t === 'text') {
    stage.innerHTML = `<div class="slide">${picEl(s)}<p class="${s.size}">${fmt(s.h)}</p>${ukLine(s)}</div>`;
  } else if (s.t === 'noun') {
    stage.innerHTML = `<div class="slide">${picEl(s)}<p class="formula">${s.noun} → ${s.verb}</p><p class="l">I ${hl('g', s.verb)}.</p><p class="sub">go ${hl('g', s.ing)}</p>${ukLine(s)}</div>`;
  } else if (s.t === 'sheet') {
    const rows = s.rows.map(([lab, items]) =>
      `<p class="lab">${fmt(lab)}</p><div class="items">${items.map(([e, w]) => `<span class="it"><span class="e" aria-hidden="true">${e}</span>${w}</span>`).join('')}</div>`).join('');
    stage.innerHTML = `<div class="slide wide"><div class="sheet">${rows}</div>${ukLine(s)}</div>`;
  } else if (s.t === 'fill') {
    renderFill(s);
  } else if (s.t === 'pick') {
    renderPick(s);
  } else if (s.t === 'match') {
    renderMatch(s);
  }
  if (s.uk) setAct('Translate', toggleUk, false);
  fit();
}

function renderPick(s) {
  const q = fmt(s.q).replace('___', '<span class="blank" id="blank"></span>');
  stage.innerHTML = `<div class="slide wide"><p class="m">${q}</p><div class="opts">${s.o.map(o => `<button type="button" class="tile opt">${o}</button>`).join('')}</div></div>`;
  const blank = $('#blank'), btns = [...stage.querySelectorAll('.opt')];
  btns.forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    if (b.textContent === s.a) {
      blank.textContent = s.a;
      blank.classList.add('ok');
      b.classList.add('done');
      btns.forEach(x => { x.disabled = true; });
      setAct('Next →', () => go(1));
      setTimeout(() => { if (b.isConnected) go(1); }, 1100);
    } else {
      b.classList.add('bad');
      b.disabled = true;
    }
  }));
}

function renderFill(s) {
  const whole = s.q === '___';
  const len = Math.max(...s.a.map(x => x.length)) + 1;
  const width = whole ? 'min(22ch, 100%)' : len + 'ch';
  const input = `<input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer" style="width:${width}">`;
  const hint = s.hint ? `<p class="hint">(${s.hint})</p>` : '';
  stage.innerHTML = `<div class="slide${whole ? ' wide' : ''}"><p class="m">${s.q.replace('___', input)}</p>${hint}<p class="answer" id="ans"></p></div>`;

  const el = $('#in');
  let tries = 0, done = false;
  const check = () => {
    if (done) return go(1);
    if (!el.value.trim()) return el.focus();
    if (s.a.some(a => norm(a) === norm(el.value))) {
      done = true;
      el.className = 'ok';
      el.readOnly = true;
      setAct('Next →', check);
      setTimeout(() => { if (el.isConnected) go(1); }, 1000);
    } else {
      tries++;
      el.className = '';
      void el.offsetWidth;
      el.className = 'bad';
      if (tries >= 2) $('#ans').textContent = s.a[0];
      el.focus();
    }
  };
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  el.addEventListener('input', () => { if (!done) el.className = ''; });
  setAct('Check', check);
  setTimeout(() => el.focus({ preventScroll: true }), 60);
}

function renderMatch(s) {
  const tiles = (side, k) => shuffle(s.pairs.map((p, n) => ({ n, w: p[k] })))
    .map(o => `<button type="button" class="tile" data-side="${side}" data-n="${o.n}">${o.w}</button>`).join('');
  stage.innerHTML = `<div class="slide wide"><div class="match"><div class="col">${tiles('en', 0)}</div><div class="col" lang="uk">${tiles('ua', 1)}</div></div></div>`;

  let sel = null, matched = 0;
  stage.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    if (t.classList.contains('done')) return;
    t.classList.remove('bad');
    if (!sel || sel.dataset.side === t.dataset.side) {
      if (sel) sel.classList.remove('sel');
      sel = sel === t ? null : t;
      if (sel) sel.classList.add('sel');
      return;
    }
    const a = sel, b = t;
    sel = null;
    a.classList.remove('sel');
    if (a.dataset.n === b.dataset.n) {
      [a, b].forEach(x => { x.classList.remove('bad'); x.classList.add('done'); x.disabled = true; });
      if (++matched === s.pairs.length) setTimeout(() => { if (a.isConnected) go(1); }, 900);
    } else {
      [a, b].forEach(x => { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); });
    }
  }));
}

function go(d) {
  const n = i + d;
  if (n < 0 || n >= slides.length) return;
  i = n;
  render();
}

prev.onclick = () => go(-1);
next.onclick = () => go(1);
act.onclick = () => onAct && onAct();

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if (slides[i].t === 'pick' && /^[1-9]$/.test(e.key)) {
    const b = stage.querySelectorAll('.opt')[+e.key - 1];
    if (b) b.click();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  else if (e.key === 't' || e.key === 'T') toggleUk();
});

stage.addEventListener('click', e => {
  if (e.target.closest('button, input')) return;
  if (slides[i].t === 'match' || slides[i].t === 'pick') return;
  const inp = $('#in');
  if (inp && !inp.readOnly) return inp.focus();
  go(e.clientX < innerWidth / 3 ? -1 : 1);
});

let x0 = null, y0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  x0 = null;
});

addEventListener('resize', fit);
document.fonts?.ready.then(fit);

function start(data) {
  i = Math.min(Math.max(0, data.i | 0), slides.length - 1);
  render();
}
window.claude?.hot?.snapshot?.(() => ({ i }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
