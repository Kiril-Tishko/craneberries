<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption Index</title>
<!-- The private caption index on his PC (served by site.pl at http://localhost:8770). Nothing here is published.
     Layout (his wish, Nov 21): one video that stays in one place, the results in a list on the side that scrolls on
     its own, each with a small picture of its video and the captions under it, like Caption Search. -->
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --soft: #5f6368; --faint: #8a8f96; --line: #e4e2dc;
  --accent: #2f5bd3; --accent-ink: #ffffff; --hit: #fff3b0; --hit-ink: #1d1d1f; --ok: #2e7d4f; --warn: #a15c00; --bad: #b3261e;
  --chip: #eceae4; --now: #e8eefc; --like: #e0245e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141517; --card: #1d1f22; --ink: #ececec; --soft: #a9adb3; --faint: #7c8187; --line: #2d3034;
    --accent: #7aa2ff; --accent-ink: #0f1115; --hit: #5c4d00; --hit-ink: #fff6cc; --ok: #6cc796; --warn: #e0a85a; --bad: #ff8a80;
    --chip: #272a2e; --now: #222a3d; --like: #ff4f86;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
button { font: inherit; color: inherit; }

/* ---- top: title, how far the collector is, the search ---- */
header { flex: none; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: var(--card); }
.top { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; }
.stat { font-size: 13px; color: var(--soft); }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--faint); vertical-align: 1px; }
.dot.on { background: var(--ok); } .dot.rest { background: var(--warn); } .dot.off { background: var(--bad); }
details.more { font-size: 13px; color: var(--soft); }
details.more summary { cursor: pointer; }
details.more[open] { flex-basis: 100%; }
.shows { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.chip { border: 0; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.chip small { color: var(--soft); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip.on small { color: var(--accent-ink); opacity: .8; }
.phone code { background: var(--chip); padding: 1px 6px; border-radius: 6px; color: var(--ink); }
table { border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
td, th { text-align: left; padding: 2px 14px 2px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { color: var(--faint); font-weight: 500; }
form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
input[type=search] { flex: 1 1 240px; min-width: 0; font: inherit; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
select { font: inherit; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
label.check { font-size: 13px; color: var(--soft); display: flex; gap: 5px; align-items: center; }
button.go { padding: 8px 15px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.help { color: var(--faint); font-size: 12px; margin-top: 4px; }
.help code { background: var(--chip); padding: 0 4px; border-radius: 4px; color: var(--soft); }

/* ---- the video (left, never moves) and the list (right, scrolls on its own) ---- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); }
.stage { min-height: 0; display: flex; flex-direction: column; padding: 10px 14px 10px 16px; }
#player { flex: 1; min-height: 0; width: 100%; border: 0; border-radius: 10px; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--soft); padding: 20px; }
.empty .ex { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.under { flex: none; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding-top: 8px; font-size: 13px; color: var(--soft); min-height: 38px; }
.under .what { min-width: 0; flex: 1 1 260px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.under .what b { color: var(--ink); }
.under .what a { color: var(--soft); }
.timing { display: flex; gap: 4px 12px; align-items: center; flex-wrap: wrap; }
.timing .grp { display: flex; gap: 3px; align-items: center; }
.timing b { font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; color: var(--ink); font-weight: 600; }
.small { font-size: 12.5px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); cursor: pointer; line-height: 1.2; }
.timing .saved { color: var(--ok); width: 54px; display: inline-block; }

.side { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--card); overscroll-behavior: contain; }
.tabs { position: sticky; top: 0; z-index: 1; display: flex; gap: 4px; padding: 8px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--soft); font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
.summary { font-size: 12.5px; color: var(--soft); padding: 8px 12px 2px; }
.error { color: var(--bad); }
ol.list { list-style: none; margin: 0; padding: 4px 6px 10px; }
.item { position: relative; padding: 8px 8px 8px; border-radius: 10px; cursor: pointer; }
.item + .item { margin-top: 2px; }
.item:hover { background: var(--bg); }
.item.now { background: var(--now); }
.item .row { display: flex; gap: 10px; align-items: flex-start; }
.thumb { flex: none; width: 112px; aspect-ratio: 16 / 9; border-radius: 7px; background: var(--chip) center / cover no-repeat; position: relative; }
.thumb .tm { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.75); color: #fff; font-size: 11px; padding: 0 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.item .meta { min-width: 0; flex: 1; padding-right: 50px; }
.item .chan { font-weight: 600; font-size: 13px; }
.item .title { font-size: 12.5px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .info { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.item .info .liked { color: var(--like); }
.item .info .super { color: var(--warn); font-weight: 600; }
.item .info .bad { color: var(--bad); }
.item .cp, .item .hd { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--faint); cursor: pointer; padding: 3px 5px; border-radius: 6px; font-size: 13px; line-height: 1.2; }
.item .hd { right: 30px; opacity: .55; }
.item .cp:hover, .item .hd:hover { background: var(--chip); color: var(--ink); opacity: 1; }
.item.gone { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 6px 10px; font-size: 12.5px; color: var(--faint); cursor: default; }
.item.gone span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item.gone .undo { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.caps { margin: 6px 0 0; font-size: 13px; color: var(--soft); }
.caps p { margin: 0; padding: 1px 0; }
.caps p.hit { color: var(--ink); font-weight: 500; }
.caps p:hover { color: var(--accent); }
mark { background: var(--hit); color: var(--hit-ink); border-radius: 3px; padding: 0 2px; }
button.more { display: block; margin: 6px auto 16px; padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.copied { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.copied.on { opacity: .92; }

#gear { display: none; }
/* A phone or a narrow window: one search line at the top (⚙ shows the rest), the video under it (it stays there),
   and the list under the video, scrolling on its own. */
@media (max-width: 900px) {
  header { padding: 6px 8px; }
  .top, .help, header select, header label.check { display: none; }
  header.open .top { display: flex; } header.open select, header.open label.check { display: block; } header.open label.check { display: flex; }
  form { margin-top: 0; gap: 6px; }
  input[type=search] { flex: 1 1 120px; }
  #gear { display: block; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 7px 10px; cursor: pointer; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .stage { padding: 6px 8px 2px; }
  #player { flex: none; height: min(calc(56.25vw + 235px), 64dvh); }
  .empty { flex: none; height: 28dvh; }
  .under { padding-top: 4px; min-height: 0; gap: 4px; }
  .under .what { display: none; }
  .under .timing { width: 100%; justify-content: center; gap: 4px 8px; }
  .timing b { min-width: 48px; font-size: 13px; }
  .small { padding: 3px 7px; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { padding: 5px 8px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Caption index</h1>
    <span class="stat" id="stat">Loading…</span>
    <details class="more" id="moreinfo"><summary>Shows, channels, phone</summary><div id="info"></div></details>
  </div>
  <form id="f" autocomplete="off">
    <input type="search" id="q" name="q" placeholder="Search a phrase, e.g. it depends" aria-label="Phrase to find">
    <select id="show" aria-label="Show"><option value="">All shows and channels</option></select>
    <label class="check"><input type="checkbox" id="human"> Exact captions only</label>
    <button class="go" type="submit">Search</button>
    <button type="button" id="gear" aria-label="Show, exact captions, how far it has got" title="More">⚙</button>
  </form>
  <div class="help"><code>a | b</code> either one · <code>call ~3 back</code> words near each other · <code>tire*</code> word start (tired, tiring)</div>
</header>
<div class="app">
  <section class="stage" aria-label="Video">
    <div class="empty" id="empty"><div>Search a phrase, then pick a clip in the list.<div class="ex" id="examples"></div></div></div>
    <iframe id="player" hidden title="Clip player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    <div class="under" id="under" hidden>
      <span class="what" id="what"></span>
      <span class="timing" aria-label="The clip's start and end">
        <span class="grp">Start <button type="button" class="small" data-c="s-" title="0.1 s earlier">−</button><b id="ts">…</b><button type="button" class="small" data-c="s+" title="0.1 s later">+</button><button type="button" class="small" data-c="s=" title="Start where the video is now">⏱</button></span>
        <span class="grp">End <button type="button" class="small" data-c="e-" title="0.1 s earlier">−</button><b id="te">…</b><button type="button" class="small" data-c="e+" title="0.1 s later">+</button><button type="button" class="small" data-c="e=" title="End where the video is now">⏱</button></span>
        <button type="button" class="small" data-c="reset" id="rs" style="visibility:hidden" title="Back to the captions' own times">↺</button>
        <button type="button" class="small" data-c="copy" title="Copy this clip's entry for the clip library">⧉ Copy entry</button>
        <span class="saved" id="tsaved"></span>
      </span>
    </div>
  </section>
  <aside class="side" id="side" aria-label="Clips">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="results" aria-selected="true">Results <span id="nres"></span></button>
      <button type="button" role="tab" data-tab="liked" aria-selected="false">♥ Liked <span id="nlik"></span></button>
      <button type="button" role="tab" data-tab="caps" aria-selected="false" title="Fix this clip's caption lines">✎ Captions</button>
    </div>
    <div class="summary" id="summary"></div>
    <ol class="list" id="list"></ol>
    <div id="capsbox" hidden><div class="summary" id="capswhat"></div><div id="caps"></div><div class="summary" id="capssaved"></div></div>
    <button type="button" class="more" id="more" hidden>More results</button>
  </aside>
</div>
<div class="copied" id="copied">Copied ✓</div>
<script src="/caps.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const clock = sec => { sec = Math.floor(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const tenth = sec => { const m = Math.floor(sec / 60), x = sec - m * 60; return m + ':' + x.toFixed(1).padStart(4, '0'); };
const when = t => { const d = new Date(t * 1000), now = new Date();
  const hm = d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString([], {weekday: 'short'}) + ' ' + hm; };
const entry = c => ({v: c.v, s: c.s, e: c.e, line: c.line, note: c.note || '', around: c.around || []});
// A signed-out phone gets 401: reload, and the server shows the PIN page.
async function api(path) {
  const r = await fetch(path, {headers: {'X-CI': '1'}});
  if (r.status === 401) { location.reload(); throw new Error('PIN'); }
  return r.json();
}
let page = 1, current = null, items = [], picks = [], tab = 'results';

// ---- the top line: how far the collector has got; shows, channels and the phone address under "Shows…" ----
async function loadStatus() {
  try {
    const s = await api('/api/status');
    let dot = 'off', state = 'not running';
    if (s.stopped) state = 'stopped';
    else if (s.paused_until) { dot = 'rest'; state = (/planned rest/.test(s.pause_reason || '') ? 'resting until ' : 'paused by YouTube until ') + when(s.paused_until); }
    else if (s.running) { dot = 'on'; state = 'collecting'; }
    $('#stat').innerHTML = `<b>${fmt(s.videos)}</b> videos · <b>${fmt(s.lines)}</b> lines · <span class="dot ${dot}"></span>${esc(state)} · ${fmt(s.todo)} to fetch`;
    $('#info').innerHTML = `<div class="shows">${s.shows.map(x => `<button type="button" class="chip${$('#show').value === x.show ? ' on' : ''}" data-show="${esc(x.show)}">${esc(x.show)}<small>${fmt(x.videos)}${x.todo ? ' / ' + fmt(x.videos + x.todo) : ''}</small></button>`).join('')}</div>
      ${s.phone ? `<div class="phone">📱 On your phone (same Wi-Fi): <code>${esc(s.phone)}</code>${s.anywhere ? ` · anywhere (Tailscale): <code>${esc(s.anywhere)}</code>` : ''} · PIN <code>${esc(s.pin)}</code> · your picks online: <a href="https://kiril-tishko.github.io/craneberries/real-video/picks/" target="_blank" rel="noopener">picks page</a></div>` : ''}
      <table><tr><th>Channel</th><th>Searchable</th><th>To fetch</th></tr>${s.channel_list.map(c => `<tr><td>${esc(c.name)}</td><td>${fmt(c.videos)}</td><td>${fmt(c.todo)}</td></tr>`).join('')}</table>`;
    const sel = $('#show'), keep = sel.value;
    sel.innerHTML = '<option value="">All shows and channels</option>' + s.shows.map(x => `<option value="${esc(x.show)}">${esc(x.show)}</option>`).join('');
    sel.value = keep;
  } catch (e) { if (e.message !== 'PIN') $('#stat').textContent = 'Can’t reach the index. Is site.pl running?'; }
}
$('#info').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('#show').value = $('#show').value === b.dataset.show ? '' : b.dataset.show;
  $('#moreinfo').open = false; loadStatus();
  if ($('#q').value.trim()) go(); else $('#q').focus();
});

// ---- highlighting the searched words ----
function patterns(q) {
  return q.split(/\s*\|\s*|\s+OR\s+/).flatMap(alt => {
    const parts = alt.split(/\s*~\d*\s*/);
    const words = p => (p.toLowerCase().normalize('NFD').replace(/\p{Mn}/gu, '').match(/[\p{L}\p{N}]+\*?/gu) || []);
    const toRe = ws => ws.map(w => w.endsWith('*') ? w.slice(0, -1) + '[\\p{L}\\p{N}]*' : w).join('[^\\p{L}\\p{N}]+');
    if (parts.length > 1) return parts.flatMap(words).map(w => toRe([w]));
    const ws = words(alt); return ws.length ? [toRe(ws)] : [];
  }).map(src => new RegExp('(?<![\\p{L}\\p{N}])' + src + '(?![\\p{L}\\p{N}])', 'giu'));
}
function highlight(text, res) {
  const plain = text.normalize('NFD').replace(/\p{Mn}/gu, '');
  if (plain.length !== text.length) return esc(text);
  const marks = [];
  for (const re of res) { re.lastIndex = 0; let m; while ((m = re.exec(plain))) { if (!m[0]) { re.lastIndex++; continue; } marks.push([m.index, m.index + m[0].length]); } }
  marks.sort((a, b) => a[0] - b[0]);
  let out = '', at = 0;
  for (const [a, b] of marks) { if (a < at) continue; out += esc(text.slice(at, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; at = b; }
  return out + esc(text.slice(at));
}

// ---- copy (also on the phone, where the clipboard API is off) ----
async function copyText(t) {
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
    const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); try { ok = document.execCommand('copy'); } catch (e2) {} a.remove();
  }
  const c = $('#copied'); c.textContent = ok ? 'Copied ✓' : 'Can’t copy here'; c.classList.add('on'); setTimeout(() => c.classList.remove('on'), 1300);
}

// ---- search ----
function params() {
  const p = new URLSearchParams();
  p.set('q', $('#q').value.trim());
  if ($('#show').value) p.set('show', $('#show').value);
  if ($('#human').checked) p.set('human', '1');
  return p;
}
let loadingMore = false;
// more: the next page of the same search. quiet: no clip is made ready (the page is coming back to his clip).
async function go(more, quiet) {
  const p = params(); if (!p.get('q')) return;
  if (!more) { page = 1; items = []; history.replaceState(null, '', '?' + p.toString()); setTab('results'); }
  p.set('page', page); p.set('n', 15);
  // "More results" stays where it is while the next ones load (it only says so), so nothing in the list moves
  // (his bug, Nov 24: the list jumped).
  const btn = $('#more');
  if (more) { loadingMore = true; btn.disabled = true; btn.textContent = 'Loading…'; }
  else { $('#summary').textContent = 'Searching…'; btn.hidden = true; }
  let d;
  try { d = await api('/api/search?' + p.toString()); }
  catch (e) { d = {error: 'Can’t reach the index. Is site.pl running?'}; }
  if (more) { loadingMore = false; btn.disabled = false; btn.textContent = 'More results'; }
  if (d.error) { if (more) page--; $('#summary').innerHTML = '<span class="error">' + esc(d.error) + '</span>'; return; }
  // A next page that came back empty (its videos were gone from YouTube): nothing more, so no button.
  if (more && !d.results.length) d.more = false;
  current = d;
  items.push(...d.results);
  const scenes = d.scenes < d.videos ? `, ${fmt(d.scenes)} scenes` : '';
  $('#summary').textContent = d.count
    ? `${fmt(d.total)} matches in ${fmt(d.videos)} videos${scenes} · ${fmt(d.channels)} channel${d.channels === 1 ? '' : 's'}`
    : 'No matches' + (p.get('human') ? ' with exact captions' : '') + (d.indexed ? ` in ${fmt(d.indexed)} videos yet.` : '.');
  $('#nres').textContent = items.length ? `(${items.length}${d.more ? '+' : ''})` : '';
  drawList();
  $('#more').hidden = !d.more;
  if (more) { await addToPlayer(d.results); if (P.list === 'results') drawNow(); }
  // The first clip is ready in the video (not playing) as soon as the results come.
  if (!more && !quiet && items.length) play('results', 0, undefined, true);
}
// More results: the new clips join the player that is open, so the clip he watches goes on and the next one opens
// without loading the player again (his wish, Nov 24: no jump away from the video he was watching).
async function addToPlayer(rows) {
  const A = playerApp();
  if (!A || !A.word || P.list !== 'results' || !rows.length || A.word.clips.length !== items.length - rows.length) return;
  let w;
  try { w = await fetch('/player/words/' + rows.map(r => `c-${r.lid}-${r.last}`).join('-') + '.json').then(r => r.json()); } catch (e) { return; }
  // Only when every new clip came (else the next one loads the player with the whole list, as before).
  if (!w || !Array.isArray(w.clips) || w.clips.length !== rows.length || A.word.clips.length !== items.length - rows.length) return;
  A.word.clips.push(...w.clips);
  P.slug = slugOf('results');
}
$('#more').addEventListener('click', () => { if (loadingMore) return; page++; go(true); });
$('#f').addEventListener('submit', e => { e.preventDefault(); go(); });
$('#show').addEventListener('change', () => { loadStatus(); if ($('#q').value.trim()) go(); });
$('#human').addEventListener('change', () => { if ($('#q').value.trim()) go(); });

// ---- the list on the side: a small picture of the video, the channel and title, the captions under them ----
const rowsOf = list => list === 'liked' ? picks : items;
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#summary').hidden = t !== 'results';
  $('#more').hidden = t !== 'results' || !(current && current.more);
  $('#list').hidden = t === 'caps'; $('#capsbox').hidden = t !== 'caps';
  if (t === 'caps') return showCaps();
  drawList();
}
$('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
function item(r, i, res) {
  // 🙈 hidden: a thin row with Undo (gone from every search from now on).
  if (r.hidden) return `<li class="item gone" data-i="${i}"><span>🙈 Hidden: ${esc((r.lines || []).find(l => l.hit)?.text || r.title || '')}</span><button type="button" class="undo">Undo</button></li>`;
  const info = [clock(r.s), r.kind === 'human' ? 'exact captions' : r.kind === 'lyrics' ? '♪ lyrics' : 'auto captions'];
  if (r.alive === 404) info.push('<span class="bad">video gone</span>');
  if (r.timed) info.push('your times');
  if (r.edited) info.push('your captions');
  if (r.super) info.push('<span class="super">★ super liked</span>');
  else if (r.kept || tab === 'liked') info.push('<span class="liked">♥ liked</span>');
  let caps;
  if (r.lines) {
    const h = r.lines.findIndex(l => l.hit);
    const lines = r.lines.filter((l, k) => k >= h - 1 && (l.hit || k <= h + 1 || r.lines[k - 1]?.hit && k <= h + 2));
    caps = lines.map(l => `<p class="${l.hit ? 'hit' : ''}" data-at="${l.s}">${l.hit ? highlight(l.text, res) : esc(l.text)}</p>`).join('');
  } else caps = `<p class="hit">${esc(r.line)}</p>`;
  return `<li class="item" data-i="${i}">
    <div class="row"><div class="thumb" style="background-image:url('https://i.ytimg.com/vi/${encodeURIComponent(r.id)}/mqdefault.jpg')"><span class="tm">${clock(r.s)}</span></div>
      <div class="meta"><div class="chan">${esc(r.channel)}</div><div class="title">${esc(r.title || r.id)}</div><div class="info">${info.join(' · ')}</div></div></div>
    <div class="caps">${caps}</div>
    <button type="button" class="cp" title="Copy clip entry">⧉</button>${tab === 'results' ? '<button type="button" class="hd" title="Hide: never show this clip (or the same scene) in a search again">🙈</button>' : ''}</li>`;
}
function drawList() {
  const rows = rowsOf(tab);
  const res = tab === 'results' && current ? patterns(current.query || $('#q').value) : [];
  $('#list').innerHTML = rows.map((r, i) => item(r, i, res)).join('');
  if (tab === 'liked' && !rows.length) $('#list').innerHTML = '<li class="summary">No liked clips yet: ♡ Like under the video.</li>';
  markNow(false);
}
// The clip that plays is marked in the list; only a new clip (scroll = true) brings it into view: a redrawn list
// (More results, 🙈, ♥) stays where he scrolled it.
function markNow(scroll = true) {
  if (tab === 'caps') return;
  document.querySelectorAll('.item.now').forEach(x => x.classList.remove('now'));
  if (P.list !== tab) return;
  const el = document.querySelector(`.item[data-i="${P.i}"]`);
  if (el) { el.classList.add('now'); if (scroll) el.scrollIntoView({block: 'nearest'}); }
}
$('#list').addEventListener('click', e => {
  const li = e.target.closest('.item'); if (!li) return;
  const i = Number(li.dataset.i), r = rowsOf(tab)[i];
  if (e.target.closest('.cp')) return copyText(JSON.stringify(entry(r.clip)));
  if (e.target.closest('.hd, .undo')) return hide(r, li, !r.hidden);
  if (r.hidden) return;
  const p = e.target.closest('p[data-at]');
  play(tab, i, p ? Number(p.dataset.at) : undefined);
});

// ---- the video: the clip library's own player (site.pl /player) holding the whole list ----
const P = {list: null, slug: null, i: -1};
function wordsOf(q) {
  return (q || '').split(/\s*\|\s*|\s*~\d*\s*/).map(a => (a.toLowerCase().normalize('NFD').replace(/\p{Mn}/gu, '').match(/[a-z0-9]+/g) || []).join('-')).filter(Boolean);
}
function slugOf(list) {
  const alts = list === 'liked' ? [] : wordsOf((current && current.query) || $('#q').value);
  return rowsOf(list).map(r => `c-${r.lid}-${r.last}`).join('-') + (alts.length ? '-q-' + alts.join('-qq-') : '');
}
function playerApp() { try { return $('#player').contentWindow.CI_App || null; } catch (e) { return null; } }
function play(list, i, at, ready) {
  const rows = rowsOf(list); if (!rows[i]) return;
  $('#empty').hidden = true; $('#player').hidden = false; $('#under').hidden = false;
  P.i = i;
  remember(list, rows[i]);
  const start = () => {
    const A = playerApp();
    if (!A || !A.word || A.word.clips.length !== rows.length) return false;
    A.onClip = () => { showTimes(); if (tab === 'caps') showCaps(); };
    A.clipN = i;
    if (ready) A.showClip(false);
    else if (at !== undefined) { A.showClip(false); A.playClip(at); }
    else A.showClip(true);
    drawNow();
    return true;
  };
  const slug = slugOf(list), same = P.slug === slug && P.list === list;
  P.list = list;   // before marking it in the list (a first clip, or one a reload came back to, is marked too)
  markNow(); drawNow();
  if (same && start()) return;
  P.slug = slug;
  const f = $('#player'); let tries = 0;
  const wait = () => { if (!start() && ++tries < 100) setTimeout(wait, 100); };
  f.onload = wait;
  f.src = '/player/?words=' + encodeURIComponent(slug) + '&embed';
}
// The address keeps the clip he is on (clip = its line, list = liked, pages = how many result pages were open), so a
// reload comes back to it instead of the first result.
function remember(list, r) {
  if (!r) return;
  const u = new URLSearchParams(location.search);
  u.set('clip', r.lid);
  if (list === 'liked') u.set('list', 'liked'); else u.delete('list');
  if (list === 'results' && page > 1) u.set('pages', page); else u.delete('pages');
  history.replaceState(null, '', '?' + u.toString());
}
// What plays (under the video) and the buttons in the player's row: Previous, Like, Next.
function drawNow() {
  const rows = rowsOf(P.list), r = rows[P.i]; if (!r) return;
  $('#what').innerHTML = `<b>${esc(r.channel)}</b> · <a href="https://youtu.be/${esc(r.id)}?t=${Math.floor(r.s)}" target="_blank" rel="noopener">${esc(r.title || r.id)}</a> · ${P.i + 1} of ${rows.length}`;
  const B = (() => { try { return $('#player').contentWindow.CI_Buttons; } catch (e) { return null; } })();
  if (B) B.set({prev: P.i > 0, next: P.i < rows.length - 1 || (P.list === 'results' && current && current.more), liked: P.list === 'liked' || !!r.kept, super: !!r.super});
  showTimes();
  if (tab === 'caps') showCaps();
}
// The player's row calls these (parent.CI).
window.CI = {
  prev() { if (P.i > 0) play(P.list, P.i - 1); },
  async next() {
    const rows = rowsOf(P.list);
    if (P.i < rows.length - 1) return play(P.list, P.i + 1);
    if (P.list === 'results' && current && current.more) { const n = P.i + 1; page++; await go(true); play('results', n); }
  },
  // ♥ Like / Liked: a tap on a liked (or super-liked) clip takes the like away.
  async like() {
    const r = rowsOf(P.list)[P.i]; if (!r) return;
    const on = P.list === 'liked' ? false : !r.kept;
    await setMark(r, on ? 'keep' : 'none');
    await afterMark(r);
  },
  // ★ Super like (his wish, Nov 24): a like that comes before the others in its searches; a second tap makes it a
  // plain like again.
  async superLike() {
    const r = rowsOf(P.list)[P.i]; if (!r) return;
    await setMark(r, r.super ? 'keep' : 'super');
    await afterMark(r);
  },
};
async function setMark(r, kind) {
  await mark(r, kind);
  const kept = kind !== 'none', sup = kind === 'super';
  for (const x of [...items, ...picks]) if (x.lid === r.lid) { x.kept = kept; x.super = sup; }
  r.kept = kept; r.super = sup;
}
async function afterMark(r) {
    const on = r.kept;
    await loadPicked();
    if (P.list === 'liked' && !on) {   // took one off the Liked list: the next one plays in its place
      P.slug = null;
      if (picks.length) play('liked', Math.min(P.i, picks.length - 1)); else { drawList(); }
      return;
    }
    if (P.list === 'liked') { const n = picks.findIndex(x => x.lid === r.lid); if (n >= 0 && n !== P.i) { P.slug = null; return play('liked', n); } }
    drawNow(); if (tab === 'results') drawList();
}
// 🙈 Hide (or Undo): this line and the same scene in the other videos; the row turns thin in place, nothing moves.
async function hide(r, li, on) {
  await api('/api/mark?' + new URLSearchParams({lid: r.lid, last: r.last, kind: on ? 'hide' : 'none',
    q: (current && current.query) || '', scene: (r.scene || []).join(',')}).toString());
  r.hidden = on;
  const res = current ? patterns(current.query || $('#q').value) : [];
  li.outerHTML = item(r, Number(li.dataset.i), res);
  markNow(false);
}
function mark(r, kind) {
  const p = new URLSearchParams({lid: r.lid, last: r.last, kind, q: (current && current.query) || r.query || ''});
  return api('/api/mark?' + p.toString());
}

// ---- the clip's start and end ----
const curClip = () => { const A = playerApp(); return A && A.word ? A.word.clips[A.clipN] : null; };
function showTimes() {
  const c = curClip(); if (!c) return;
  $('#ts').textContent = tenth(c.s); $('#te').textContent = tenth(c.e);
  $('#rs').style.visibility = Math.abs(c.s - c.start0) < 0.01 && Math.abs(c.e - c.end0) < 0.01 ? 'hidden' : 'visible';   // keeps its room
}
// Moving the start plays from there; moving the end plays its last 1.5 s. Saved a moment later.
function setTime(which, v) {
  const A = playerApp(), c = curClip(); if (!A || !c) return;
  v = Math.max(0, Math.round(v * 10) / 10);
  if (which === 's') c.s = Math.min(v, Math.round((c.e - 0.2) * 10) / 10); else c.e = Math.max(v, Math.round((c.s + 0.2) * 10) / 10);
  A.refresh();
  if (which === 's') A.playClip(); else A.playClip(Math.max(c.s, c.e - 1.5));
  showTimes(); saveTimes(c);
}
let saveT = 0;
function saveTimes(c, reset) {
  clearTimeout(saveT); $('#tsaved').textContent = '…';
  saveT = setTimeout(async () => {
    await api(`/api/times?lid=${c.lid}&last=${c.last || c.lid}` + (reset ? '&reset=1' : `&s=${c.s}&e=${c.e}`));
    for (const r of [...items, ...picks]) if (r.lid === c.lid) { r.clip.s = c.s; r.clip.e = c.e; r.timed = !reset; }
    $('#tsaved').textContent = 'Saved ✓'; setTimeout(() => $('#tsaved').textContent = '', 1500);
  }, reset ? 0 : 700);
}
$('#under').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const A = playerApp(), c = curClip();
  switch (b.dataset.c) {
    case 's-': return c && setTime('s', c.s - 0.1);
    case 's+': return c && setTime('s', c.s + 0.1);
    case 's=': return A && setTime('s', A.now());
    case 'e-': return c && setTime('e', c.e - 0.1);
    case 'e+': return c && setTime('e', c.e + 0.1);
    case 'e=': return A && setTime('e', A.now());
    case 'reset': if (c) { c.s = c.start0; c.e = c.end0; A.refresh(); A.playClip(); showTimes(); saveTimes(c, true); } return;
    case 'copy': if (c) copyText(JSON.stringify(entry(c))); return;
  }
});

// ---- ✎ Captions: the clip's lines, fixed here (caps.js); the video shows each change at once ----
let capsFor = null, capsSaveT = 0, capsPending = null;
const editor = CapsEdit.create($('#caps'), {
  onChange(r) {
    const A = playerApp(), c = curClip(); if (!A || !c) return;
    Object.assign(c, {line: r.line, around: r.around, s: r.s, e: r.e, start0: r.s, end0: r.e, screens: r.screens, star: r.clip, edited: true, timed: false});
    A.refresh(); showTimes();
    saveCaps(c, {clip: r.clip, lines: r.screens.map(x => [x.s, x.e, x.t, x.w])});
  },
  onPlay(at) { const A = playerApp(); if (!A) return; if (A.playAt) A.playAt(at); else A.playClip(at); },
  onReset() { const c = curClip(); if (c) saveCaps(c, null); },
  edited: () => { const c = curClip(); return !!(c && c.edited); },
});
function showCaps() {
  const c = curClip(), rows = rowsOf(P.list), r = rows[P.i];
  if (!c || !r) { capsFor = null; $('#capswhat').textContent = 'Pick a clip first: its lines show here.'; $('#caps').innerHTML = ''; return; }
  $('#capswhat').innerHTML = `<b>${esc(r.channel)}</b> · ${esc(r.title || r.id)}`;
  const key = c.lid + ':' + c.v;
  if (capsFor === key) return;
  capsFor = key;
  // The editor starts from what plays now (his own start / end on the clip's line).
  const screens = (c.screens || [{s: c.s, e: c.e, t: c.line}]).map((x, k) => k === c.star ? {...x, s: c.s, e: c.e} : x);
  editor.set(screens, c.star || 0, P.list === 'results' && current ? patterns(current.query || '') : []);
}
// Saved a moment after the last change (at once when another clip's lines are waiting); null = back to the original.
function saveCaps(c, data) {
  const job = {lid: c.lid, last: c.last || c.lid, data};
  if (capsPending && capsPending.lid !== job.lid) { clearTimeout(capsSaveT); sendCaps(capsPending); }
  capsPending = job; clearTimeout(capsSaveT); $('#capssaved').textContent = 'Saving…';
  capsSaveT = setTimeout(() => sendCaps(job), data ? 600 : 0);
}
async function sendCaps(job) {
  if (capsPending === job) capsPending = null;
  const p = new URLSearchParams({lid: job.lid, last: job.last});
  if (job.data) p.set('data', JSON.stringify(job.data)); else p.set('reset', '1');
  let d;
  try { d = await api('/api/caps?' + p.toString()); } catch (e) { d = {error: 'Can’t reach the index.'}; }
  if (d.error || !d.clip) { $('#capssaved').innerHTML = '<span class="error">Not saved: ' + esc(d.error || '?') + '</span>'; return; }
  const v = d.clip, lines = v.screens.map((x, k) => ({s: x.s, e: x.e, text: x.t, hit: k === v.star}));
  for (const r of [...items, ...picks]) if (r.lid === job.lid) {
    r.clip = {v: v.v, s: v.s, e: v.e, line: v.line, note: '', around: v.around}; r.lines = lines; r.line = v.line;
    r.edited = !!v.edited; r.timed = !!v.timed; r.s = v.s;
  }
  // Back to the original: the player and the editor take the index's lines again.
  const A = playerApp(), c = curClip();
  if (!job.data && A && c && c.lid === job.lid) {
    Object.assign(c, {line: v.line, around: v.around, s: v.s, e: v.e, start0: v.start0, end0: v.end0, screens: v.screens, star: v.star, edited: !!v.edited, timed: !!v.timed});
    A.refresh(); showTimes(); capsFor = null; if (tab === 'caps') showCaps();
  }
  $('#capssaved').textContent = job.data ? 'Saved ✓ (your captions)' : 'Back to the original ✓';
  setTimeout(() => { if (/✓/.test($('#capssaved').textContent)) $('#capssaved').textContent = ''; }, 2000);
}

// ---- ♥ Liked ----
async function loadPicked() {
  try { picks = (await api('/api/kept')).kept || []; } catch (e) { return; }
  $('#nlik').textContent = picks.length ? `(${picks.length})` : '';
  if (tab === 'liked') drawList();
}

// ---- start: the address can carry a search (?q=it+depends&show=Breaking+Bad) ----
(async () => {
  const u = new URLSearchParams(location.search);
  $('#q').value = u.get('q') || ''; $('#human').checked = u.get('human') === '1';
  $('#examples').innerHTML = ['what do you mean', 'it depends', 'are you kidding me', 'I’m tired', 'can I call you back'].map(x => `<button type="button" class="chip">${esc(x)}</button>`).join('');
  await loadStatus();
  const liked = loadPicked();
  if (u.get('show')) { $('#show').value = u.get('show'); }
  // After a reload: back to the clip he was on (ready, not playing), with as many result pages as were open.
  const back = Number(u.get('clip')) || 0, fromLiked = u.get('list') === 'liked';
  let found = false;
  if ($('#q').value) {
    await go(false, !!back);
    if (back && !fromLiked) {
      const n = Math.min(Number(u.get('pages')) || 1, 10);
      while (page < n && current && current.more && !items.some(r => r.lid === back)) { page++; await go(true); }
      const i = items.findIndex(r => r.lid === back);
      if (i >= 0) { play('results', i, undefined, true); found = true; }
    }
  } else $('#q').focus();
  if (back && fromLiked) {
    await liked;
    const i = picks.findIndex(r => r.lid === back);
    if (i >= 0) { setTab('liked'); play('liked', i, undefined, true); found = true; }
  }
  // That clip isn't there any more (unliked, hidden): the first result, as usual.
  if (back && !found && items.length) play('results', 0, undefined, true);
  setInterval(loadStatus, 60000);
})();
$('#gear').addEventListener('click', () => $('header').classList.toggle('open'));
$('#examples').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { $('#q').value = b.textContent; go(); } });
</script>
</body>
</html>
