<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap">
<style>
/* One thing per screen. Big phrase in the middle, buttons at the bottom, no page scrolling. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#10241F; --muted:#4F635D; --line:#D2DDD9;
  --accent:#1E6B58; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8; --home:#B45309; --home-ink:#FFFFFF;
  --swap:#C42A6B; --swap-bg:#FBE1EC; --hear:#2F5FB3; --hear-bg:#E2EBFB; --ua:#6B5A12; --ua-bg:#FFF4C9;
  --font:"Lexend","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1916; --surface:#16241F; --ink:#E6F1ED; --muted:#9DB3AB; --line:#2A3B35;
    --accent:#6FD1B4; --accent-ink:#0E1916; --accent-soft:#163A31; --home:#F5B454; --home-ink:#1F1405;
    --swap:#FF8DBB; --swap-bg:#3B1B2A; --hear:#9DBBFF; --hear-bg:#1B2A47; --ua:#F3DC85; --ua-bg:#3A3212;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#16241F; --ink:#E6F1ED; --muted:#9DB3AB; --line:#2A3B35;
  --accent:#6FD1B4; --accent-ink:#0E1916; --accent-soft:#163A31; --home:#F5B454; --home-ink:#1F1405;
  --swap:#FF8DBB; --swap-bg:#3B1B2A; --hear:#9DBBFF; --hear-bg:#1B2A47; --ua:#F3DC85; --ua-bg:#3A3212;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* No jumping: a part that appears on a tap keeps its place from the start (invisible, not removed),
   and parts that replace each other (gap line → full sentence) share one cell. */
#card [data-part][hidden],#card [data-cue][hidden],#card [data-hide-on-ans][hidden]{display:block!important;visibility:hidden}
#card .row[data-part][hidden]{display:flex!important}
.stack{display:grid;width:100%;justify-items:center;align-items:center}
.stack>*{grid-area:1/1}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  padding:max(10px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:none;padding-bottom:6px;position:relative;cursor:grab;user-select:none;-webkit-user-select:none}
/* More tabs than fit: the bar scrolls (drag it, or the mouse wheel); a soft fade shows there is more on that side. */
.tabs.drag{cursor:grabbing}
.tabs.more-r{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.tabs.more-l{-webkit-mask-image:linear-gradient(to left,#000 82%,transparent);mask-image:linear-gradient(to left,#000 82%,transparent)}
.tabs.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.card::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 11px;border-radius:99px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
/* A part kept in reserve ({extra: true}): only a dashed ➕ tab until it is opened during the lesson. */
.tab.more{border:2px dashed var(--line);color:var(--accent);padding:5px 11px}
.tab.more:hover{border-color:var(--accent)}
/* Homework on the same page ({home: true} parts, his wish Nov 23): after a "🏠 At home" divider, in a warm color;
   their screens say "🏠 At home" beside the dots. */
.tabsep{flex:none;align-self:center;font-size:13px;font-weight:700;color:var(--home);white-space:nowrap;margin-left:6px;padding:3px 4px 3px 12px;border-left:2px solid var(--line)}
.tab.home{color:var(--home)}
.tab.home[aria-selected="true"]{background:var(--home);color:var(--home-ink)}
.dots .hometag{font-size:12px;font-weight:700;color:var(--home);line-height:8px;margin-right:4px;white-space:nowrap}
.dots.home i.on{background:var(--home)}
.tab .shut{display:inline-block;margin:-4px -6px -4px 4px;padding:4px 6px;border-radius:99px;opacity:.75;font-size:12px}
.tab .shut:hover{opacity:1;background:rgba(127,127,127,.25)}
.dots{display:flex;gap:5px;justify-content:center;flex:none;padding:4px 0 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:99px}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 0}
.card{width:100%;max-height:100%;overflow:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:26px;
  padding:clamp(18px,4vh,34px) clamp(16px,4vw,32px);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,18px);text-align:center}
.card.in{animation:in .25s ease-out}
.card.full{height:100%;padding:10px}
.clipbox{position:relative;width:100%;flex:1;min-height:0}
/* Clip pages (student site) lie over the page, not in the card: the one on show exactly over its .clipbox, the ones
   loading ahead unseen under the card (Clips, below). */
.clipframe{position:fixed;border:0;border-radius:18px;background:transparent;opacity:0;pointer-events:none;z-index:-1;transition:opacity .3s}
.clipframe.on{opacity:1;pointer-events:auto;z-index:2}
.clipskel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .3s}
.clipbox.ready .clipskel{opacity:0;pointer-events:none}
.sk{display:block;flex:none;background:var(--line);border-radius:12px;animation:skp 1.1s ease-in-out infinite alternate}
.sk.v{flex:0 1 auto;min-height:0;height:calc(100% - 170px);aspect-ratio:16/9;max-width:100%;border-radius:18px}
.sk.b{width:min(100%,640px);height:30px}
.sk.c{width:min(80%,460px);height:36px}
.sk.n{width:min(96%,560px);height:44px;border-radius:14px}
@keyframes skp{from{opacity:.45}to{opacity:.8}}
@keyframes in{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}

.who{font-size:14px;font-weight:600;letter-spacing:.04em;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.who.hear{background:var(--hear-bg);color:var(--hear)}
.who.swapw{background:var(--swap-bg);color:var(--swap)}
.big{font-size:clamp(30px,7.4vw,54px);font-weight:800;line-height:1.12;text-wrap:balance}
.pic svg{height:clamp(110px,22vh,190px);width:auto;display:block;margin:0 auto}
.pic{font-size:clamp(52px,10vh,92px);line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.when{font-size:clamp(16px,2.6vh,20px);color:var(--muted);max-width:30ch;line-height:1.35}
.ua{font-size:clamp(18px,3vh,24px);font-weight:600;color:var(--ua);background:var(--ua-bg);border-radius:14px;padding:6px 14px}
.sw{color:var(--swap);background:var(--swap-bg);border-radius:12px;padding:0 .18em;display:inline-block}
.sw.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 18px;font-size:17px;font-weight:600}
.btn:hover{border-color:var(--accent)}
a.btn{display:inline-block;text-decoration:none;color:inherit}
a.btn.main{color:#fff}
.ylink{font-size:14px;color:var(--muted)}
.ex{font-size:clamp(17px,2.8vh,22px);font-style:italic;max-width:32ch;line-height:1.35}
.btn.main{background:var(--swap);border-color:var(--swap);color:#fff;font-size:20px;padding:12px 26px}
.sp{border:0;background:var(--accent-soft);color:var(--accent);border-radius:99px;width:46px;height:46px;font-size:21px;display:grid;place-items:center;flex:none}

.scene{font-size:15px;font-weight:600;color:var(--muted)}
.them{width:100%;max-width:520px;background:var(--hear-bg);border-radius:20px 20px 20px 6px;padding:12px 16px;text-align:left;display:flex;gap:12px;align-items:center}
.them .t{flex:1;font-size:clamp(20px,3.6vh,28px);font-weight:600;color:var(--ink)}
.lbl{display:block;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hear);margin-bottom:2px}
.you{width:100%;max-width:520px;border:2px dashed var(--line);border-radius:20px 20px 6px 20px;padding:12px 16px;text-align:left}
.you .lbl{color:var(--accent)}
.cue{font-size:clamp(18px,3vh,23px);font-weight:600;line-height:1.3}
.hint{margin-top:8px;font-size:clamp(20px,3.4vh,26px);font-weight:600;color:var(--muted)}
.ans{margin-top:8px;font-size:clamp(24px,4.4vh,34px);font-weight:800;color:var(--accent)}
.after{font-size:17px;color:var(--muted)}

.all{list-style:none;margin:0;padding:0;width:100%;max-width:560px;text-align:left}
.all li{display:flex;gap:10px;align-items:center;padding:clamp(4px,1vh,10px) 0;border-top:1px solid var(--line)}
.all li:first-child{border-top:0}
.all .tx{flex:1;min-width:0}
.all .en{display:block;font-size:clamp(16px,2.8vh,23px);font-weight:700;line-height:1.25}
.all .u{display:block;font-size:clamp(13px,2vh,15px);color:var(--muted)}
.all .s{font-size:12.5px;font-weight:600;color:var(--hear)}
.all .sp{width:34px;height:34px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:clamp(2px,.6vh,7px);width:100%;max-width:560px}
.bub{max-width:94%;padding:clamp(3px,.6vh,7px) 11px;border-radius:16px 16px 16px 4px;background:var(--hear-bg);text-align:left;
  font-size:clamp(13px,1.9vh,19px);font-weight:500;line-height:1.2;align-self:flex-start}
.playall{padding:6px 14px;font-size:15px}
.mail{width:100%;max-width:560px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:clamp(16px,2.5vh,21px);line-height:1.3}
.mail .mh{font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.mail p{margin:0 0 clamp(2px,.6vh,6px);cursor:pointer}
.mail .gap{height:clamp(4px,1vh,10px)}
.ans .sp,.after .sp,.inplace .sp{width:34px;height:34px;font-size:15px}
.big.inplace{color:var(--accent)}
@media (min-width:760px){.chat{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(7,auto);column-gap:18px;max-width:none}.bub{justify-self:start}.bub.me{justify-self:end}}
.bub.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--accent-soft);color:var(--accent);font-weight:700}

.mine{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.mine input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.mine input:focus{outline:none;border-color:var(--accent)}
.saved{font-size:14px;font-weight:600;color:var(--muted);min-height:1.3em}
/* Her typed answer on an exercise (Nov 25, his wish): kept for later review; green when it matches the answer. */
input.typed{width:100%;max-width:560px;font:inherit;font-size:clamp(17px,2.6vh,20px);font-weight:600;padding:10px 14px;border-radius:14px;
  border:2px dashed var(--line);background:var(--bg);color:var(--ink);text-align:center}
input.typed:focus{outline:none;border-style:solid;border-color:var(--accent)}
input.typed.ok{border:2px solid #1E8E4E;background:#EEF8F1;color:#0F5A30}
input.typed.no{border:2px solid #E0A500}
/* A "notice" screen (Nov 26, his idea): sentences first, she looks for what they share, then 👀 Show marks the key
   words; a tap (or the mouse) on a marked word says what it is. */
.ntc{list-style:none;margin:0;padding:0;display:grid;gap:clamp(6px,1.5vh,14px);width:100%;max-width:680px;text-align:left}
.ntc li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:clamp(18px,3vh,26px);font-weight:700;line-height:1.35}
.ntc.txt{gap:clamp(4px,1vh,8px)}
.ntc.txt li{font-weight:500;font-size:clamp(17px,2.7vh,23px)}
.nz{position:relative;border-radius:6px;transition:background .25s,color .25s}
.ntc.shown .nz{color:var(--swap);background:var(--swap-bg);box-shadow:0 0 0 2px var(--swap-bg);cursor:help;outline:none}
.ntc.shown .nz:hover::after,.ntc.shown .nz.tip::after{content:attr(data-note);position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;line-height:1.3;padding:6px 10px;border-radius:9px;white-space:nowrap;z-index:6;pointer-events:none}

.nav{flex:none;display:flex;gap:12px;justify-content:space-between;align-items:center}
.nav button{border:0;border-radius:18px;font-weight:600;font-size:18px;padding:14px 22px}
.back{background:var(--surface);border:2px solid var(--line)!important}
.next{background:var(--accent);color:var(--accent-ink);flex:1;max-width:260px}
.nav button:disabled{opacity:.35;cursor:default}

.cueline{font-size:clamp(22px,4vh,32px);font-weight:700;color:var(--muted);line-height:1.3}
.gapw{color:var(--swap);letter-spacing:.14em;font-family:ui-monospace,monospace}
/* a recall sentence: one line through all the steps (data-step 0 hidden, 1 blanks, 2 first letters, 3 the answer) */
.gapline{color:var(--muted)}
.gapline[data-step="0"]{visibility:hidden}
.gapline[data-step="3"]{color:var(--accent)}
.gapline .gw{background:transparent;color:inherit}
.gapline[data-step="3"] .gw{background:var(--swap-bg);color:var(--swap)}
.gapline:not([data-step="3"]) .gc:not(.p){color:transparent;
  background:linear-gradient(var(--swap),var(--swap)) left bottom/calc(100% - .1em) .09em no-repeat}
.gapline[data-step="2"] .gc.f{color:var(--swap)}
.gapline:not([data-step="3"]) .sp{visibility:hidden}
.recall-ua{font-size:clamp(26px,6vw,44px);font-weight:700;line-height:1.2}
.ans.big2{font-size:clamp(26px,5.4vw,42px)}
.mouth{width:min(320px,70vw);height:auto;max-height:34vh}
.word{border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:10px 22px;font-size:clamp(24px,4.6vh,36px);font-weight:800;display:inline-flex;align-items:center;gap:10px}
.word.on{border-color:var(--swap);background:var(--swap-bg)}
.word.right{border-color:#1E8E4E;background:#DDF4E6;color:#0F5A30}
.word.wrong{border-color:#C0392B;background:#FBE3E0;color:#8E2219}
.score{font-size:18px;font-weight:600;color:var(--muted)}
.chipsay{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:clamp(17px,2.8vh,21px);font-weight:600}
.chipsay:hover{border-color:var(--accent)}
s.no{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--swap);opacity:.75}
.hlw{color:var(--swap);background:var(--swap-bg);border-radius:8px;padding:0 .04em}
.rules{display:grid;gap:12px;width:100%;max-width:560px;text-align:left}
.rulebox{background:var(--accent-soft);border-radius:18px;padding:12px 16px}
.rh{font-weight:800;font-size:clamp(18px,3vh,22px)}
.rt{font-size:clamp(15px,2.3vh,18px);color:var(--muted);margin-top:2px}
.rx{font-size:clamp(17px,2.8vh,22px);font-weight:700;margin-top:6px;color:var(--accent)}
@media (max-height:700px){
  .card{padding:14px 14px;gap:9px}
  .big{font-size:clamp(26px,6.6vw,44px)}
  .them{padding:8px 12px} .you{padding:8px 12px}
  .hint,.ans{margin-top:4px}
  .nav button{padding:11px 18px}
  .sp{width:40px;height:40px;font-size:18px}
  .btn{padding:8px 14px}
}
/* Moving pictures for kids' pages: pic + anim on a screen */
.pic.anim{display:inline-block}
.anim-hop{animation:hop 1s ease-in-out infinite}
.anim-swim{animation:swim 2.6s ease-in-out infinite alternate}
.anim-fly{animation:fly 2.2s ease-in-out infinite alternate}
.anim-run{animation:run 1.1s ease-in-out infinite alternate}
.anim-climb{animation:climb 2.4s ease-in-out infinite alternate}

.anim-crawl{animation:crawl 5s ease-in-out infinite alternate}
.anim-ring{animation:ring 1.6s ease-in-out infinite}
.anim-sleep{animation:sleep 3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-30%) scale(.95,1.05)}55%{transform:translateY(-30%)}90%{transform:translateY(0) scale(1.08,.92)}}
@keyframes swim{from{transform:translateX(-30%) rotate(-6deg)}to{transform:translateX(30%) rotate(6deg)}}
@keyframes fly{0%{transform:translate(-30%,12%)}50%{transform:translate(0,-18%)}100%{transform:translate(30%,10%)}}
@keyframes run{from{transform:translateX(-35%)}to{transform:translateX(35%)}}
@keyframes climb{from{transform:translateY(18%) rotate(-4deg)}to{transform:translateY(-18%) rotate(4deg)}}

/* Games: a star burst on a right answer, a shake on a wrong one */
.burst{position:fixed;pointer-events:none;font-size:28px;z-index:9;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),-110px) scale(1.25);opacity:0}}
.quiz .word{font-size:clamp(20px,3.4vh,28px);padding:8px 16px}
.sit{font-style:italic;font-weight:500;font-size:.78em;opacity:.7}
.gq{font-size:clamp(24px,5.4vw,36px);font-weight:800;line-height:1.2;color:var(--hear)}
.gcol{display:grid;gap:10px;width:100%;max-width:480px}
.gcol .word{width:100%;justify-content:flex-start;text-align:left;font-size:clamp(19px,2.9vh,25px);padding:8px 14px}
.gcol .ge{min-width:1.9em;text-align:center;white-space:nowrap}
.recall-ua .sit,.when .sit{display:block}
.word.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

<div class="app">
  <div class="tabs" id="tabs" role="tablist" aria-label="Parts of the lesson"></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <main class="stage"><article class="card" id="card" aria-live="polite"></article></main>
  <nav class="nav"><button class="back" id="back">← Back</button><button class="next" id="next">Next →</button></nav>
</div>

<script>
/* ---------- content ---------- */
/*CONTENT*/
// On the student site a clips screen plays its clips right there, one word to a screen (no heading: the video as big as
// the screen allows, its controls under it): a screen with several words becomes one screen per word.
if (window.LESSON_KEY) SECTIONS.forEach((x) => {
  x.slides = x.slides.flatMap((s) => (s.t === 'clips' && s.words.length > 1 ? s.words.map((w) => ({...s, words: [w]})) : [s]));
});
const MOUTH = '';
let jawDeg = 0;
function setJaw(to){
  const from = jawDeg, t0 = performance.now(), dur = 450;
  const step = (now) => {
    const g = document.getElementById('jaw'); if (!g) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    jawDeg = from + (to - from) * e;
    g.setAttribute('transform', `rotate(${jawDeg.toFixed(2)} 78 118)`);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* ---------- listening game ---------- */
let G = { cur: null, right: 0, total: 0 };
// The student's language for the few interface words (content may set `const LANG = 'ru'`; default Ukrainian).
const RU = typeof LANG !== 'undefined' && LANG === 'ru';
const T_ = (uk, ru) => RU ? ru : uk;
/* ---------- her answers (Nov 25, his wish: "when they answer remember the answer for later to review, especially the
   homework") ----------
   Every exercise where she gives an answer (recall, flip, turn) has a box: she types her answer, then Answer shows the
   right one and the box turns green when they match (amber when not: no red, nothing harsh). A quiz keeps her first tap,
   a listening game her score. All of it is kept like "My sentences" (this browser and, on the student site, her
   account: `a` in her answers row, {key: {t, ok, r, q, p, h, at, seen}}), so the teacher sees it later (📝 Answers in
   his bar) and the wrong ones can open her next lesson (lessons repo: tools/missed-answers.py). */
const ANS_T = {recall: 1, flip: 1, turn: 1};
// {words|note} in a notice line: the words are marked on 👀 Show, the note shows on a tap or under the mouse.
const noticePlain = (l) => String(l).replace(/\{([^|}]+)\|[^}]*\}/g, '$1');
const noticeMarks = (l) => String(l).split(/(\{[^|}]+\|[^}]*\})/).map((x) => {
  const m = x.match(/^\{([^|}]+)\|([^}]*)\}$/);
  return m ? `<span class="nz" tabindex="0" data-note="${esc(m[2])}">${esc(m[1])}</span>` : esc(x);
}).join('');
const ansKey = (s) => s.t === 'quiz' ? 'quiz:' + s.q : s.t === 'game' ? 'game:' + s.words.map((w) => w[0]).join('|') : s.t + ':' + (s.en || s.ans || '');
const ansRight = (s) => String(s.t === 'recall' ? s.en : s.ans || '').replace(/[\[\]]/g, '').replace(/~~/g, '');
const ansNorm = (x) => ' ' + String(x || '').toLowerCase().replace(/[’‘`]/g, "'")
  .replace(/\bcan't\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/n't\b/g, ' not').replace(/'re\b/g, ' are')
  .replace(/'m\b/g, ' am').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have').replace(/'d\b/g, ' would')
  .replace(/\b(it|he|she|that|what|where|there|who|how)'s\b/g, '$1 is').replace(/\bcannot\b/g, 'can not')
  .replace(/\b(do|does|did|is|are|was|were|has|have|had|could|would|should)nt\b/g, '$1 not').replace(/\bcant\b/g, 'can not').replace(/\bim\b/g, 'i am')
  .replace(/[^\p{L}\p{N}' ]+/gu, ' ').replace(/\s+/g, ' ').trim() + ' ';
const ansSame = (a, b) => ansNorm(a) === ansNorm(b);
const typedBox = (s) => `<input class="typed" type="text" data-typed="${esc(ansKey(s))}" placeholder="${T_('✍️ Напишіть відповідь', '✍️ Напишите ответ')}"
  autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" aria-label="Your answer">`;
/* ---------- state ---------- */
let sec = 0, idx = 0;
const pick = {};            // which option each change-one-thing screen shows
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card = document.getElementById('card');
const xs = (t) => esc(t).replace(/~~(.+?)~~/g, '<s class="no">$1</s>')   // ~~wrong form~~ is shown crossed out
  .replace(/\(([^)]+)\)/g, '<i class="sit">($1)</i>');                    // (a situation) in italics: a setting, not part of the line

/* ---------- voice: recorded clips (Kokoro neural voice), browser voice only as a fallback ---------- */
const AUDIO = /*AUDIO*/{};
let clip = null, queue = [];
let voice = null;
function pickVoice(){ try { const v = speechSynthesis.getVoices().filter((x) => /^en[-_]US$/i.test(x.lang)); voice = v.find((x) => /Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(x.name)) || v[0] || null; } catch (e) {} }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }
function stopAll(){ queue = []; try { if (clip){ clip.pause(); clip = null; } } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }
function play(text, done){
  if (AUDIO[text]){
    try { clip = new Audio(AUDIO[text]); clip.onended = () => { clip = null; if (done) done(); }; clip.play().catch(() => {}); return; } catch (e) {}
  }
  fallback(text);
  if (done) setTimeout(done, 1800);
}
function say(text){ stopAll(); play(text); }
function burst(el){   // a few stars fly up from a right answer (fixed position: nothing on the card moves)
  const r = el.getBoundingClientRect();
  ['⭐', '🎉', '✨', '⭐', '✨'].forEach((t, n) => {
    const b = document.createElement('span'); b.className = 'burst'; b.textContent = t;
    b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = (r.top - 10) + 'px';
    b.style.setProperty('--dx', ((n - 2) * 34) + 'px'); b.style.animationDelay = (n * 60) + 'ms';
    document.body.appendChild(b); setTimeout(() => b.remove(), 1300);
  });
}
function playAll(lines){
  stopAll(); queue = lines.slice();
  const next = () => { const t = queue.shift(); if (t) setTimeout(() => play(t, next), 350); };
  next();
}
function fallback(text){
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\(your name\)/, ''));
    u.lang = 'en-US'; u.rate = .85; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const spk = (text) => (AUDIO[text] || (!/\(/.test(text) && 'speechSynthesis' in window)) ? `<button class="sp" data-say="${esc(text)}" aria-label="Listen">🔊</button>` : '';

/* ---------- screens ---------- */
// A clips screen's clip page: on the student site its compact form right in the screen (/clips/…&embed=1), on a

function clipQuery(s){
  const slug = (t) => String(t).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const q = new URLSearchParams({words: s.words.map(slug).join(','), title: document.title, from: 'lesson'});
  if (s.notes === 'ua' || s.notes === 'ru') q.set('notes', s.notes);   // ru: Victoria only (Nov 24)
  if (s.listen) q.set('listen', '1');   // listen first: no caption until it is tapped
  if (s.only) q.set('only', [].concat(s.only).join(','));   // just these clips (YouTube ids): about 3 a word (Nov 24)
  return q;
}
function clipSrc(s){
  const q = clipQuery(s); q.delete('from'); q.delete('title'); q.set('embed', '1');
  return `/clips/?${q}`;
}
function view(s){

    const url = window.LESSON_KEY ? `/song/?s=${encodeURIComponent(s.song)}&from=lesson`

    const blanks = (w) => w.split(' ').map((x) => [...x].map((c, i) => (/[\p{L}\p{N}]/u.test(c)
      ? `<span class="gc${i === 0 ? ' f' : ''}">${esc(c)}</span>` : `<span class="gc p">${esc(c)}</span>`)).join('')).join(' ');
    const sentence = s.en.split(/(\[[^\]]+\])/).map((x) => (/^\[/.test(x) ? `<span class="hlw gw">${blanks(x.slice(1, -1))}</span>` : esc(x))).join('');

      ${text ? `<div class="rt">${xs(text)}</div>` : ''}<div class="rx">${ex.split(' · ').map((x) => `<div>${xs(x).replace(/\[([^\]]+)\]/g, '<span class="hlw">$1</span>')}</div>`).join('')}</div></div>`).join('')}</div>`;

    <div class="big">${xs(s.subj)}</div>
    <div class="ans big2" data-part="ans" hidden><span class="row" style="align-items:center"><span>${hl}</span> ${spk(full)}</span></div>

  }
  if (s.t === 'notice'){
    const lines = s.lines.map((l) => `<li><span class="nl">${noticeMarks(l)}</span>${spk(noticePlain(l))}</li>`).join('');

/* ---------- parts kept in reserve ----------
   A part with extra: true (e.g. more tense drills, his wish Nov 21) stays out of the way: no tab, Next goes past it,
   only a dashed "➕ <label>" tab where it would be. A tap on it opens the part (this tab remembers it after a reload),
   and so does a jump there (the teacher's Lead); the ✕ on its tab puts it away again, as often as he likes. On the
   student site the teacher's open / closed parts reach the student's page while he leads (live.js:
   Lesson.extras(), Lesson.setExtras(list), Lesson.onExtras). */
const EXTRA_KEY = `lesson-extra:${location.pathname}`;
const opened = new Set((() => { try { return JSON.parse(sessionStorage.getItem(EXTRA_KEY) || '[]'); } catch (e) { return []; } })());
const isOpen = (n) => !!SECTIONS[n] && (!SECTIONS[n].extra || opened.has(n));
const keepOpened = () => { try { sessionStorage.setItem(EXTRA_KEY, JSON.stringify([...opened])); } catch (e) {} };
function openPart(n){
  if (!SECTIONS[n] || isOpen(n)) return;
  opened.add(n); keepOpened();
}
const nextOpen = (n, d) => { for (let k = n + d; k >= 0 && k < SECTIONS.length; k += d) if (isOpen(k)) return k; return -1; };
// Put a part away again. Standing on it, the lesson goes on where it would have without it (the next part).
function closePart(n){
  if (!SECTIONS[n] || !SECTIONS[n].extra || !opened.has(n)) return;
  opened.delete(n); keepOpened();
  if (sec === n){
    const f = nextOpen(n, 1), b = nextOpen(n, -1);
    if (f >= 0){ sec = f; idx = 0; } else if (b >= 0){ sec = b; idx = SECTIONS[b].slides.length - 1; }
    else { opened.add(n); keepOpened(); return; }   // nothing else to show: keep it
    render();
  } else drawBar();
  if (window.Lesson && window.Lesson.onExtras) window.Lesson.onExtras();
}
function render(){
  if (!isOpen(sec)) openPart(sec);
  const slides = SECTIONS[sec].slides;
  drawBar();
  const dotsEl = document.getElementById('dots'), home = !!SECTIONS[sec].home;
  dotsEl.classList.toggle('home', home);
  dotsEl.innerHTML = (home ? '<span class="hometag">🏠 At home</span>' : '')
    + (slides.length > 1 ? slides.map((_, n) => `<i class="${n === idx ? 'on' : ''}"></i>`).join('') : '');
  jawDeg = 0; G = { cur: null, right: 0, total: 0 };
  card.innerHTML = view(slides[idx]);

  card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
  Clips.render();

// The part tabs and Back / Next (which parts are open decides where Next goes).
function drawBar(){
  const slides = SECTIONS[sec].slides;
  const tabsEl = document.getElementById('tabs'), keepX = tabsEl.scrollLeft;   // the bar keeps where it was scrolled
  const firstHome = SECTIONS.findIndex((s) => s.home);
  tabsEl.innerHTML = SECTIONS.map((s, n) => (n === firstHome ? '<span class="tabsep">🏠 At home</span>' : '') + (!isOpen(n)
    ? `<button class="tab more" data-more="${n}" title="Open this part">➕ ${esc(s.label)}</button>`
    : `<button class="tab${s.home ? ' home' : ''}" role="tab" data-sec="${n}" aria-selected="${n === sec}">${esc(s.label)}${s.extra ? `<span class="shut" data-shut="${n}" title="Put this part away">✕</span>` : ''}</button>`)).join('');
  tabsEl.scrollLeft = keepX;
  const onTab = tabsEl.querySelector('[aria-selected="true"]');   // and always shows the part that is open
  if (onTab && (onTab.offsetLeft < tabsEl.scrollLeft + 28 || onTab.offsetLeft + onTab.offsetWidth > tabsEl.scrollLeft + tabsEl.clientWidth - 28))
    tabsEl.scrollLeft = onTab.offsetLeft - (tabsEl.clientWidth - onTab.offsetWidth) / 2;

  const after = nextOpen(sec, 1), last = after < 0 && idx === slides.length - 1;
  document.getElementById('back').disabled = nextOpen(sec, -1) < 0 && idx === 0;
  document.getElementById('next').disabled = last;
  document.getElementById('next').textContent = idx === slides.length - 1 && !last
    ? `${SECTIONS[after].home && !SECTIONS[sec].home ? '🏠 ' : ''}${SECTIONS[after].label} →` : 'Next →';
}
/* ---------- clips screens load ahead (student site) ----------
   A clips screen's page (/clips/…&embed=1, with YouTube players) takes a few seconds to load, so it loads before the
   screen comes: the next clips screen ahead always loads in the background (its first clip ready on its first frame,
   the second one loading too), and pages already loaded stay (the last three), so going back is instant as well.
   The pages lie over the lesson, never inside the card (moving a frame reloads it): the one on show exactly over its
   box in the card, the others unseen under the card at the same size, paused. */
const Clips = (() => {
  if (!window.LESSON_KEY) return {render(){}};
  // A page with clips opens its connections to the clip library and YouTube at once, before the first clips screen.
  if (SECTIONS.some((x) => x.slides.some((s) => s.t === 'clips'))) {
    for (const h of ['https://kiril-tishko.github.io', 'https://www.youtube.com', 'https://i.ytimg.com']) {
      const l = document.createElement('link'); l.rel = 'preconnect'; l.href = h; if (h.includes('github')) l.crossOrigin = 'anonymous';
      document.head.appendChild(l);
    }
  }
  const frames = new Map(), KEEP = 3;   // src → its frame
  let box = null, shown = null, aheadT = 0, showT = 0;
  // Where a clips screen's box is, or would be (the card's inside: the stage less its padding, the card's border and padding).
  function spot(){
    if (box && box.isConnected) return box.getBoundingClientRect();
    const r = document.querySelector('.stage').getBoundingClientRect();
    return {left: r.left + 11, top: r.top + 21, width: r.width - 22, height: r.height - 42};
  }
  function place(f){
    const r = f === shown ? box.getBoundingClientRect() : spot();
    Object.assign(f.style, {left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`});
  }
  const layout = () => frames.forEach(place);
  function frame(src){
    let f = frames.get(src);
    if (!f){
      f = document.createElement('iframe');
      f.className = 'clipframe'; f.title = 'Real video clips'; f.tabIndex = -1;
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      frames.set(src, f); place(f); f.src = src; document.body.appendChild(f);
    }
    f.used = performance.now();
    return f;
  }
  function reveal(){
    if (!shown || !box) return;
    place(shown);
    if (shown.ready){ box.classList.add('ready'); shown.classList.add('on'); }
  }
  function render(){
    clearTimeout(aheadT); clearTimeout(showT); pending = null;
    box = card.querySelector('.clipbox');
    const now = box ? frame(box.dataset.src) : null;
    frames.forEach((f) => {
      if (f === now) return;
      f.classList.remove('on');
      if (document.activeElement === f) f.blur();
      try { f.contentWindow.postMessage({clipsPause: true}, '*'); } catch (e) {}   // a clip left playing stops
    });
    shown = now; layout();
    if (shown){
      const f = shown, b = box;
      showT = setTimeout(reveal, 260);   // once the card has slid in
      setTimeout(() => { if (shown === f && box === b){ f.ready = true; reveal(); } }, 8000);   // at the latest
    }
    // The next clips screen ahead starts loading once this screen has settled; the oldest pages go.
    let next = null;
    SECTIONS.forEach((x, n) => x.slides.forEach((s, i) => {
      if (!next && s.t === 'clips' && (n > sec || (n === sec && i > idx))) next = clipSrc(s);
    }));
    aheadT = setTimeout(() => {
      if (next) frame(next);
      const old = [...frames].filter(([, f]) => f !== shown && f !== frames.get(next)).sort((a, b) => a[1].used - b[1].used);
      while (frames.size > KEEP && old.length){ const [src, f] = old.shift(); f.remove(); frames.delete(src); }
    }, shown ? 2500 : 1200);
  }
  addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(document.querySelector('.stage'));
  // A clip page says when it is laid out: the grey shapes give way to it.
  addEventListener('message', (e) => {
    if (!e.data || !e.data.clipsReady) return;
    frames.forEach((f) => { if (f.contentWindow === e.source){ f.ready = true; if (f === shown) reveal(); } });
    if (shown && shown.contentWindow === e.source && pending){ const c = pending; pending = null; tell(c); }
  });
  // The live helper hears what she does in the clips on show (a clip changed, ▶ / ❚❚) as a 'lesson-clip' event, and can
  // move the clips on show the same way (his 👀 Follow): clipCmd({k, playing, flash}). A command for a page still
  // loading waits until it is ready (Nov 24, his wish: he saw her slides, not her clips).
  let pending = null;
  const tell = (c) => { try { shown.contentWindow.postMessage({clipsCmd: c}, '*'); } catch (e) {} };
  addEventListener('message', (e) => {
    if (!e.data || !e.data.clipsEv || !shown || shown.contentWindow !== e.source) return;
    document.dispatchEvent(new CustomEvent('lesson-clip', {detail: {kind: e.data.clipsEv, k: e.data.k, n: e.data.n, playing: !!e.data.playing}}));
  });
  function clipCmd(c){
    if (!shown) return false;
    if (shown.ready) tell(c); else pending = c;
    return true;
  }
  return {render, clipCmd};
})();
function go(d){
  const slides = SECTIONS[sec].slides;
  if (d > 0){ if (idx < slides.length - 1) idx++; else { const n = nextOpen(sec, 1); if (n >= 0){ sec = n; idx = 0; } } }
  else { if (idx > 0) idx--; else { const n = nextOpen(sec, -1); if (n >= 0){ sec = n; idx = SECTIONS[sec].slides.length - 1; } } }
  render();
}
/* ---------- for the student site's live helper (kiril-tishko/lessons site/assets/live.js) ----------
   Lesson.at() = [part, screen]; Lesson.jump(part, screen) shows that screen; Lesson.onMove(part, screen), set by the
   helper, hears every change of screen. Nothing uses these on a Claude page. */
window.Lesson = Object.assign(window.Lesson || {}, {
  at: () => [sec, idx],
  // the clips on show (a clips screen on the student site): go to clip k, play or pause, light up a button
  clipCmd: (c) => (Clips.clipCmd ? Clips.clipCmd(c) : false),
  jump(s, i){ if ((s === sec && i === idx) || !SECTIONS[s] || !SECTIONS[s].slides[i]) return; sec = s; idx = i; render(); },
  // parts kept in reserve that are open now; setExtras makes these the open ones (the part on show stays open)
  extras: () => [...opened].filter((n) => SECTIONS[n] && SECTIONS[n].extra).sort((a, b) => a - b),
  // Her answers, for the teacher: typed(k, e) takes one as she types it (live); answers() lists them in page order.
  typed(k, e){
    if (!k || !e) return;
    ansMem[k] = e;
    const box = [...card.querySelectorAll('[data-typed]')].find((x) => x.dataset.typed === k);
    if (box && document.activeElement !== box){ box.value = e.t || ''; if (!e.free && ansShown() && e.t) ansMark(box, !!e.ok); }
    document.dispatchEvent(new CustomEvent('lesson-answers'));
  },
  answers(){
    const out = [];
    SECTIONS.forEach((x, n) => x.slides.forEach((s, i) => {
      if (s.t === 'write'){
        s.prompts.forEach((p) => { const e = ansMem['write:' + p]; if (e && e.t) out.push({s: n, i, part: x.label, home: !!x.home, q: p, r: '', t: e.t, ok: false, free: true, at: e.at || 0}); });
        return;
      }
      if (!ANS_T[s.t] && s.t !== 'quiz' && s.t !== 'game') return;
      const e = ansMem[ansKey(s)]; if (!e || !e.t) return;
      out.push({s: n, i, part: x.label, home: !!x.home, q: e.q || '', r: e.r || ansRight(s), t: e.t, ok: !!e.ok, seen: !!e.seen, at: e.at || 0});
    }));
    return out;
  },
  setExtras(list){
    const want = new Set((list || []).filter((n) => SECTIONS[n] && SECTIONS[n].extra));
    if (SECTIONS[sec].extra) want.add(sec);
    if (want.size === opened.size && [...want].every((n) => opened.has(n))) return;
    opened.clear(); want.forEach((n) => opened.add(n)); keepOpened(); drawBar();
  },
});

/* ---------- "My sentences": kept as they are typed, so a reload or a closed tab loses nothing ----------

   person's private rows in the page database (publish with capabilities db + user). Either one is enough.
   A Claude page has its own address, so one key is enough there. On the student site (kiril-tishko/lessons) every
   lesson shares one address: its page sets window.LESSON_KEY so each lesson keeps its own sentences, and the site's
   helper sets window.LessonStore ({get, set} like a database document) to keep them in the student's account too. */

let mineMem = null, mineDoc = null, mineTimer = 0;

const ansRO = () => !!(window.LessonStore && window.LessonStore.readOnly);

function docSave(){

// Where on the page an answer is: its part's name, at home or not (for his list and the next lesson's opening).
function ansWhere(s){

  return {p: '', h: 0};
}
function ansPut(s, e, key){

  try { localStorage.setItem(ANS_LKEY, JSON.stringify(ansMem)); } catch (e2) {}

    const snap = await mineDoc.get(), data = snap.exists ? snap.data() : {}, remote = data.s || [];
    // Her answers: the newer copy of each wins (this browser or her account); the teacher's browser shows hers only.
    const ra = data.a && typeof data.a === 'object' ? data.a : {};
    if (ansRO()) ansMem = {...ra};
    else {
      let push = false;
      for (const [k, e] of Object.entries(ra)) if (!ansMem[k] || (e && e.at || 0) > (ansMem[k].at || 0)) ansMem[k] = e;
      for (const [k, e] of Object.entries(ansMem)) if (!ra[k] || (e.at || 0) > (ra[k].at || 0)) push = true;
      try { localStorage.setItem(ANS_LKEY, JSON.stringify(ansMem)); } catch (e) {}
      if (push) docSave();
    }
    ansFill();
    const local = mineLoad();
    if (local.some(Boolean)){ if (JSON.stringify(local) !== JSON.stringify(remote)) mineSave(local); return; }
    if (!remote.some(Boolean)) return;
    mineMem = remote; try { localStorage.setItem(MINE_KEY, JSON.stringify(remote)); } catch (e) {}
    const inputs = [...card.querySelectorAll('[data-mine]')];
    if (inputs.length && !inputs.some((x) => x.value)){ inputs.forEach((x, n) => { x.value = remote[n] || ''; }); mineMark('✓ Saved'); }
  } catch (e) {}
})();
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input')) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

/* A screen that doesn't fit gets smaller instead of scrolling (no scrollbars, his choice, Nov 18): its parts are
   zoomed down step by step until the whole card fits, so no button is ever out of reach. A new screen starts at full
   size; a tap that opens more (a translation) only shrinks it further if it must. */
(() => {
  if (window.__cardFit) return; window.__cardFit = true;
  const over = (c) => c.scrollHeight > c.clientHeight + 1;
  const fit = (fresh) => {
    const c = document.getElementById('card'); if (!c) return;
    const kids = [...c.children];
    let z = fresh ? 1 : Number(c.dataset.fit || 1);
    if (fresh) kids.forEach((k) => { k.style.zoom = ''; });
    while (over(c) && z > 0.5) { z = Math.round((z - 0.05) * 100) / 100; kids.forEach((k) => { k.style.zoom = z; }); }
    c.dataset.fit = z;
  };
  const start = () => {
    const c = document.getElementById('card'); if (!c) return;
    new MutationObserver((ms) => {
      const fresh = ms.some((m) => m.type === 'childList' && m.target === c);
      requestAnimationFrame(() => fit(fresh));
    }).observe(c, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class']});
    const again = () => requestAnimationFrame(() => fit(true));
    addEventListener('resize', again);
    if (window.ResizeObserver && c.parentElement) new ResizeObserver(again).observe(c.parentElement);
    if (document.fonts) document.fonts.ready.then(again);
    fit(true);
  };
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
})();
