<title>Some, Any, No</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
  /* Endings → rule → "n't + any = no" → word map (some | any | no side by side) → one family per screen
     → -one = -body → real dialogues → offers → mistakes → practice with drawn scenes → learn by heart.
     some = amber, any = indigo, no = rose on every screen. Scenes are line drawings in the same tokens. */
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --ink: #161b26;
    --muted: #697186;
    --line: #dde1e9;
    --some: #a85400;
    --some-soft: #ffdcae;
    --any: #3443c4;
    --any-soft: #d9defe;
    --no: #b0275f;
    --no-soft: #fdd3e4;
    --ok: #1d8549;
    --ok-soft: #d3f2df;
    --bad: #c3372b;
    --skin: #f3c6a0;
    --hair: #6b4430;
    --f-disp: "Unbounded", "Arial Black", system-ui, sans-serif;
    --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a;
      --surface: #1a1f2a;
      --ink: #eef1f7;
      --muted: #8c94a8;
      --line: #2b313e;
      --some: #ffb757;
      --some-soft: #4d3313;
      --any: #9ca7ff;
      --any-soft: #262d5e;
      --no: #ff8dbb;
      --no-soft: #4e1c34;
      --ok: #5fd394;
      --ok-soft: #173d29;
      --bad: #ff7d70;
      --skin: #e2b089;
      --hair: #a77452;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a;
    --surface: #1a1f2a;
    --ink: #eef1f7;
    --muted: #8c94a8;
    --line: #2b313e;
    --some: #ffb757;
    --some-soft: #4d3313;
    --any: #9ca7ff;
    --any-soft: #262d5e;
    --no: #ff8dbb;
    --no-soft: #4e1c34;
    --ok: #5fd394;
    --ok-soft: #173d29;
    --bad: #ff7d70;
    --skin: #e2b089;
    --hair: #a77452;
    color-scheme: dark;
  }

  html { box-sizing: border-box; height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    --c: var(--ink);
    --glow: var(--line);
  }
  body[data-mode="some"] { --c: var(--some); --glow: var(--some-soft); }
  body[data-mode="any"]  { --c: var(--any);  --glow: var(--any-soft); }
  body[data-mode="no"]   { --c: var(--no);   --glow: var(--no-soft); }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(55% 45% at 50% 46%, color-mix(in srgb, var(--glow) 70%, transparent), transparent 75%);
    transition: background .4s;
  }

  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-block: 56px 104px;
    overflow-y: auto;
    text-align: center;
  }
  .slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2.4vh, 26px);
    width: 100%;
    max-width: 1100px;
    min-width: 0;
    margin: auto;
    animation: rise .3s cubic-bezier(.2, .7, .3, 1);
  }
  .slide.wide { max-width: 720px; }
  .slide > * { max-width: 100%; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  p { margin: 0; }

  .xl, .l, .head { font-family: var(--f-disp); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .xl { font-size: clamp(2.5rem, 11vw, 7.5rem); }
  .l  { font-size: clamp(1.8rem, 6.2vw, 4.4rem); }
  .head { font-size: clamp(1.5rem, 4.6vw, 2.7rem); }
  .m  { font-size: clamp(1.5rem, 5vw, 3.6rem); font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
  .formula {
    font-size: clamp(1rem, 2.6vw, 1.45rem);
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .03em;
  }
  .note { font-size: clamp(1rem, 2.6vw, 1.4rem); font-weight: 700; color: var(--muted); }
  .pic { font-family: var(--f-emoji); font-size: clamp(2.8rem, 10vw, 5rem); line-height: 1.1; }

  .k-s { --k: var(--some); --ks: var(--some-soft); }
  .k-a { --k: var(--any);  --ks: var(--any-soft); }
  .k-n { --k: var(--no);   --ks: var(--no-soft); }
  .hl { color: var(--k); background: linear-gradient(transparent 56%, var(--ks) 56%); padding: 0 .05em; border-radius: .12em; }
  .ok-mark { color: var(--ok); }
  .x { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: .08em; }
  .bad-mark { color: var(--bad); }

  .uk {
    display: block;
    text-wrap: balance;
    font-size: clamp(1.05rem, 2.8vw, 1.7rem);
    font-weight: 600;
    color: var(--ink);
    visibility: hidden;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .uk.on { visibility: visible; opacity: 1; transform: none; }
  .uk.sm { display: none; font-size: .78em; font-weight: 600; color: var(--muted); transform: none; }
  .uk.sm.on { display: block; }
  .tag {
    display: inline-block;
    margin-right: .6em;
    vertical-align: .15em;
    font-size: .55em;
    font-weight: 800;
    letter-spacing: .12em;
    padding: .35em .6em;
    border-radius: 999px;
    color: var(--c);
    background: color-mix(in srgb, var(--glow) 80%, transparent);
  }
  .hint { font-size: clamp(1rem, 2.6vw, 1.6rem); font-weight: 600; color: var(--muted); }

  /* Drawn scenes: ink outlines, soft fills from the lesson colours. */
  .scene { display: block; width: min(250px, 64vw); height: auto; overflow: visible; }
  .scene .o { fill: var(--surface); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .scene .l { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .scene .d { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 5 6; stroke-linecap: round; }
  .scene .ink { fill: var(--ink); }
  .scene .a { fill: var(--any-soft); }
  .scene .s { fill: var(--some-soft); }
  .scene .n { fill: var(--no-soft); }
  .scene .g { fill: var(--line); }
  .scene .sk { fill: var(--skin); }
  .scene .hr { fill: var(--hair); }
  .scene .nn { fill: var(--no); }
  .scene .tx { font: 800 13px var(--f-body); letter-spacing: .06em; fill: var(--ink); }
  .scene .tx.lg { font-size: 24px; letter-spacing: 0; }
  .scene .tx.q { font-size: 30px; fill: var(--muted); letter-spacing: 0; }
  .scene .tx.wt { fill: var(--surface); }

  /* Rows: picture or sign | word | sentence, one line per word so they compare at a glance. */
  .rows {
    display: grid;
    width: 100%;
    column-gap: clamp(10px, 2.4vw, 22px);
    text-align: left;
    font-size: clamp(1.05rem, 2.7vw, 1.5rem);
  }
  .rows.c3 { grid-template-columns: auto auto minmax(0, 1fr); }
  .rows.c2 { grid-template-columns: auto minmax(0, 1fr); }
  .row { display: contents; }
  .cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .2em;
    min-width: 0;
    padding-block: .7rem;
    border-top: 1px solid var(--line);
  }
  .row:first-child > .cell { border-top: none; }
  .lead { align-items: center; }
  .ic { font-family: var(--f-emoji); font-size: 1.6em; line-height: 1; }
  .sign {
    display: grid;
    place-items: center;
    width: 1.9em;
    height: 1.9em;
    border-radius: 50%;
    font-weight: 800;
    color: var(--k);
    background: var(--ks);
  }
  .w { font-family: var(--f-disp); font-weight: 700; white-space: nowrap; }
  .sen { font-weight: 700; line-height: 1.3; }
  .slide.xwide { max-width: 1000px; }
  @media (min-width: 761px) {
    .rows.c2.two { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); }
    .rows.two .row:nth-child(2) > .cell { border-top: none; }
    .rows.two .row:nth-child(even) > .lead { padding-left: clamp(14px, 3vw, 32px); }
  }
  @media (max-width: 560px) {
    .rows.c2 .cell { padding-block: .5rem; }
    .rows.c3 { grid-template-columns: auto minmax(0, 1fr); }
    .rows.c3 .lead { grid-row: span 2; }
    .rows.c3 .w { padding-bottom: 0; }
    .rows.c3 .sen { border-top: none; padding-top: .25rem; }
  }

  /* Word map: some | any | no in three tinted columns. */
  .map {
    display: grid;
    grid-template-columns: auto repeat(3, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
    font-size: clamp(.85rem, 2.4vw, 1.3rem);
  }
  .map > div {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: .2em;
    min-width: 0;
    padding: .65em .3em;
    border-radius: 12px;
    font-weight: 700;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .map .cell-m { background: color-mix(in srgb, var(--ks) 45%, var(--surface)); }
  .map .ch { font-family: var(--f-disp); font-size: 1.2em; color: var(--k); padding-block: .2em; }
  .map .ch small { display: block; font-family: var(--f-body); color: var(--muted); font-size: .6em; }
  .map .rh { padding-inline: 0 .2em; color: var(--muted); font-size: .8em; }
  .map .rh .ic { font-size: 1.8em; }

  /* Dialogue: question bubble left, answer bubble right. */
  .chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(560px, 100%);
    text-align: left;
    font-size: clamp(1.15rem, 3.3vw, 1.7rem);
    font-weight: 700;
    line-height: 1.3;
  }
  .bub { display: flex; flex-direction: column; gap: .2em; max-width: 88%; padding: .6em .9em; border-radius: 20px; }
  .bub.q { align-self: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-bottom-left-radius: 6px; }
  .bub.r { align-self: flex-end; background: color-mix(in srgb, var(--line) 60%, var(--surface)); border-bottom-right-radius: 6px; }

  /* "n't + any = no": the two parts light up, then the short form appears, then the mistake. */
  .neg { color: var(--no); }
  .neg, .mark { border-radius: .15em; box-shadow: 0 0 0 .08em var(--no); animation: flag .45s .7s backwards; }
  .eq { font-family: var(--f-disp); font-weight: 700; font-size: clamp(1.6rem, 5vw, 3rem); color: var(--muted); line-height: 1; animation: pop .4s 1.4s backwards; }
  .step2 { animation: up .45s 1.8s backwards; }
  .step3 { animation: up .45s 2.6s backwards; }
  .step4 { animation: up .45s 3.4s backwards; }
  @keyframes flag { from { box-shadow: 0 0 0 0 transparent; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5); } }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } }

  /* Mistakes: wrong | right side by side. */
  .fix {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: clamp(14px, 3vw, 32px);
    width: 100%;
    text-align: left;
    font-size: clamp(1rem, 2.6vw, 1.45rem);
  }
  .fix > div { min-width: 0; padding-block: .75rem; border-top: 1px solid var(--line); font-weight: 700; line-height: 1.3; }
  .fix > .fh { border-top: none; padding-block: 0 .3rem; font-size: .75em; font-weight: 800; letter-spacing: .1em; }
  .fh.bad-h { color: var(--bad); }
  .fh.ok-h { color: var(--ok); }

  input {
    font: inherit;
    color: var(--c);
    background: transparent;
    border: none;
    border-bottom: .07em solid var(--line);
    border-radius: 0;
    outline: none;
    text-align: center;
    padding: 0 .1em;
    min-width: 2.5ch;
    max-width: 100%;
  }
  input:focus { border-bottom-color: var(--c); }
  input.ok { color: var(--ok); border-bottom-color: var(--ok); }
  input.bad { color: var(--bad); border-bottom-color: var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .answer { font-size: clamp(1rem, 2.8vw, 1.7rem); font-weight: 700; color: var(--ok); min-height: 1.4em; }

  .blank { display: inline-block; min-width: 3.5ch; line-height: 1.1; border-bottom: .07em solid var(--line); }
  .blank.ok { color: var(--ok); border-bottom-color: var(--ok); padding: 0 .1em; }

  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px clamp(14px, 4vw, 40px); width: 100%; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .opts { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; width: 100%; }
  @media (max-width: 560px) { .opts.n3 { grid-template-columns: minmax(0, 1fr); width: min(300px, 100%); gap: 10px; } }
  .tile {
    font: 700 clamp(1rem, 2.6vw, 1.35rem)/1.2 var(--f-body);
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: .7em .6em;
    cursor: pointer;
    overflow-wrap: anywhere;
    transition: border-color .15s, background .15s, opacity .3s;
  }
  .opts .tile { padding: .7em .6em; font-size: clamp(1.1rem, 3vw, 1.5rem); }
  .tile:hover { border-color: var(--muted); }
  .tile.sel { border-color: var(--c); background: color-mix(in srgb, var(--glow) 50%, var(--surface)); }
  .tile.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); opacity: .6; cursor: default; }
  .opts .tile.done { opacity: 1; }
  .tile.bad { color: var(--bad); border-color: var(--bad); animation: shake .3s; }
  .tile:disabled:not(.done) { opacity: .45; cursor: default; }

  #bar {
    position: fixed;
    left: 0;
    top: env(safe-area-inset-top, 0px);
    height: 4px;
    width: 0;
    background: var(--c);
    border-radius: 0 4px 4px 0;
    transition: width .3s, background .3s;
  }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .nav {
    width: 48px;
    height: 48px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .nav:hover { border-color: var(--muted); }
  .nav:disabled { opacity: .35; cursor: default; }
  #act {
    font: 700 1rem/1 var(--f-body);
    letter-spacing: .02em;
    color: var(--surface);
    background: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 15px 26px;
    cursor: pointer;
  }
  #act[aria-pressed="true"] { color: var(--ink); background: var(--glow); }
  #act[hidden] { display: block !important; visibility: hidden; }
  button:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<main id="stage" aria-live="polite"></main>
<div id="bar"></div>
<div class="dock">
  <button class="nav" id="prev" aria-label="Back">&#8592;</button>
  <button id="act" type="button" hidden>Translate</button>
  <button class="nav" id="next" aria-label="Next">&#8594;</button>
</div>

<script>
// ---------- Drawn scenes (viewBox 200 × 140) ----------
const svg = body => `<svg class="scene" viewBox="0 0 200 140" aria-hidden="true">${body}</svg>`;
const wallet = `<rect class="o s" x="40" y="62" width="120" height="66" rx="10"/><path class="l" d="M40 84h120"/>
  <rect class="o" x="128" y="92" width="32" height="20" rx="6"/><circle class="ink" cx="140" cy="102" r="3"/>`;
const fridge = inside => svg(`<path class="l" d="M28 132H178"/>
  <rect class="o" x="54" y="8" width="70" height="124" rx="6"/><rect class="o g" x="61" y="15" width="56" height="110" rx="3"/>
  ${inside}<path class="l" d="M61 48h56M61 80h56M61 106h56"/>
  <path class="o a" d="M124 8L162 18V122L124 132Z"/><path class="l" d="M133 58v24"/>`);
const SCN = {
  door: svg(`<text class="tx" x="100" y="15" text-anchor="middle">KNOCK! KNOCK!</text>
    <path class="l" d="M16 128H184"/>
    <rect class="o s" x="72" y="26" width="56" height="102" rx="3"/>
    <rect class="l" x="81" y="36" width="38" height="28" rx="2"/><rect class="l" x="81" y="80" width="38" height="38" rx="2"/>
    <circle class="ink" cx="119" cy="72" r="3.5"/>
    <path class="l" d="M140 62q8 10 0 20M151 55q14 17 0 34M60 62q-8 10 0 20M49 55q-14 17 0 34"/>`),
  classroom: svg(`<path class="l" d="M10 128H190"/>
    <rect class="o a" x="50" y="10" width="100" height="44" rx="4"/><path class="l" d="M64 26h28M64 38h46"/>
    ${[20, 82, 144].map(x => `<rect class="o g" x="${x + 9}" y="66" width="18" height="26" rx="4"/>
      <rect class="o s" x="${x}" y="88" width="36" height="8" rx="2"/><path class="l" d="M${x + 5} 96v32M${x + 31} 96v32"/>`).join('')}`),
  shh: svg(`<circle class="o sk" cx="94" cy="72" r="40"/>
    <path class="o hr" d="M54 68Q56 28 94 28Q132 28 134 68Q118 50 94 50Q70 50 54 68Z"/>
    <circle class="ink" cx="80" cy="72" r="4"/><circle class="ink" cx="108" cy="72" r="4"/>
    <rect class="o sk" x="78" y="110" width="32" height="26" rx="10"/><rect class="o sk" x="88" y="80" width="12" height="44" rx="6"/>
    <text class="tx lg" x="164" y="44" text-anchor="middle">Shh!</text>`),
  fridgeEmpty: fridge(''),
  fridgePizza: fridge(`<path class="o s" d="M72 79L108 79L90 57Z"/><circle class="nn" cx="89" cy="69" r="3"/><circle class="nn" cx="97" cy="74" r="2.5"/><circle class="nn" cx="82" cy="74" r="2.5"/>`),
  bag: svg(`<text class="tx" x="100" y="16" text-anchor="middle">RING! RING!</text>
    <path class="l" d="M74 62Q74 32 100 32Q126 32 126 62"/>
    <path class="o s" d="M44 60H156L146 128H54Z"/>
    <path class="l" d="M36 80l-10-4M34 94h-12M36 108l-10 4M164 80l10-4M166 94h12M164 108l10 4"/>`),
  seats: svg(`<path class="l" d="M6 128H194"/>
    ${[[8, 's'], [50, 'n'], [92, 'g']].map(([x, c]) => `<rect class="o a" x="${x}" y="58" width="38" height="46" rx="8"/>
      <path class="l" d="M${x + 8} 112v16M${x + 30} 112v16"/>
      <rect class="o ${c}" x="${x + 7}" y="60" width="24" height="40" rx="10"/><circle class="o sk" cx="${x + 19}" cy="47" r="11"/>
      <rect class="o a" x="${x}" y="98" width="38" height="14" rx="5"/>`).join('')}
    <path class="l" d="M156 98v30M168 98v30"/><rect class="o s" x="150" y="50" width="24" height="50" rx="10"/>
    <circle class="o sk" cx="162" cy="37" r="11"/><text class="tx q" x="186" y="34" text-anchor="middle">?</text>`),
  keys: svg(`<circle class="d" cx="62" cy="72" r="20"/><path class="d" d="M82 72h62M126 72v14M140 72v10"/>
    <text class="tx q" x="34" y="38">?</text><text class="tx q" x="152" y="44">?</text><text class="tx q" x="100" y="126">?</text>`),
  walletEmpty: svg(`${wallet}<path class="d" d="M98 58q-14-14 6-24"/>
    <path class="o g" d="M112 26q-18-16-22 4q10 8 22-4z"/><path class="o g" d="M116 26q18-16 22 4q-10 8-22-4z"/>
    <ellipse class="ink" cx="114" cy="27" rx="3" ry="8"/>`),
  walletMoney: svg(`<rect class="o a" x="58" y="36" width="76" height="36" rx="3"/><circle class="l" cx="96" cy="52" r="8"/>

// ---------- Lesson ----------
// Slide kinds: text, html, rows (picture or sign | word | sentence), map (some | any | no table),
// chat (question + answer), fix (wrong | right), pick (tap the right word), fill (type), match.
// [s:…] some, [a:…] any, [n:…] no: each keeps its colour everywhere.
const T = (h, uk, size = 'l', pic) => ({ t: 'text', h, uk, size, pic });
const R = o => ({ t: 'rows', ...o });
const E = (pic, word, sen, uk) => ({ pic, word, sen, uk });

const C = (scene, q, qUk, r, rUk) => ({ t: 'chat', scene, q, qUk, r, rUk });
const P = (scene, q, o, a) => ({ t: 'pick', scene, q, o, a });
const F = (q, a, hint, pic) => ({ t: 'fill', q, a: [].concat(a), hint, pic });
const ONE = ['someone', 'anyone', 'no one'], THING = ['something', 'anything', 'nothing'], WHERE = ['somewhere', 'anywhere', 'nowhere'];
const cap = a => a.map(w => w[0].toUpperCase() + w.slice(1));

const parts = [

       <p class="note">Same meaning. Both are very common.</p>` },

      ["I don't need nothing.", "I don't need [a:any]thing.", 'Мені нічого не потрібно. Тільки одне «не»!'],
      ["No one don't know.", '[n:No] one knows.', 'Ніхто не знає. Після no one — без don’t.'],
      ["We didn't go nowhere.", "We didn't go [a:any]where.", 'Ми нікуди не ходили.'],

    P('door', 'Knock, knock! ___ is at the door.', cap(ONE), 'Someone'),

    P('fridgeEmpty', "The fridge is empty. There's ___ to eat.", THING, 'nothing'),
    P('bag', 'My phone is ___ in my bag. I can hear it!', WHERE, 'somewhere'),

    P('onlyChild', "I'm an only child. I don't have ___ brothers or sisters.", ['some', 'any', 'no'], 'any'),

    F('___ knows the answer.', ['no one', 'nobody'], 'ніхто', '🤷'),
    F('___ called you.', ['someone', 'somebody'], 'хтось', '📱'),
    F("Let's go ___!", 'somewhere', 'кудись', '🗺️'),
    { t: 'match', pairs: [
      ['someone', 'хтось'],
      ['something', 'щось'],
      ['somewhere', 'десь'],
      ['no one', 'ніхто'],

      ['nowhere', 'ніде'],

    R({ head: 'Learn by heart', uk: "Вивчи напам'ять", two: true, rows: [
      E('🚪', null, '[s:Some]one is at the door.', 'Хтось стоїть за дверима.'),
      E('🗺️', null, "Let's go [s:some]where!", 'Ходімо кудись!'),
      E('🏠', null, 'Is [a:any]one home?', 'Є хтось удома?'),
      E('🤫', null, "Don't tell [a:any]one!", 'Нікому не кажи!'),
      E('🔑', null, "I can't find my keys [a:any]where.", 'Я ніде не можу знайти ключі.'),
      E('🤷', null, '[n:No] one knows.', 'Ніхто не знає.'),
      E('🤔', null, 'I have [n:no] idea.', 'Гадки не маю.'),

    ] }),
    T('Great job!', 'Молодець!', 'xl'),
  ]],
];
const slides = parts.flatMap(([mode, list]) => list.map(s => ({ ...s, mode })));

const $ = s => document.querySelector(s);
const stage = $('#stage'), bar = $('#bar'), act = $('#act'), prev = $('#prev'), next = $('#next');
const hl = (k, w) => `<span class="hl k-${k}">${w}</span>`;
const fmt = h => h.replace(/\[([a-z]):([^\]]+)\]/g, (_, k, w) => hl(k, w));
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/-/g, ' ').replace(/[.?!,]+$/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const ukLine = s => s.uk ? `<p class="uk" lang="uk"><span class="tag">UA</span>${s.uk}</p>` : '';
const ukSm = t => t ? `<span class="uk sm" lang="uk">${t}</span>` : '';
const picEl = s => s.scene ? SCN[s.scene] : s.pic ? `<p class="pic" aria-hidden="true">${s.pic}</p>` : '';
const headEl = s => (s.head ? `<p class="head">${fmt(s.head)}</p>` : '') + (s.sub ? `<p class="formula">${fmt(s.sub)}</p>` : '');

let i = 0;
let onAct = null;

function setAct(label, fn, pressed) {
  act.hidden = !fn;
  act.textContent = label || '';
  act.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  onAct = fn;
}

function toggleUk() {
  const els = stage.querySelectorAll('.uk');
  if (!els.length) return;
  const on = !els[0].classList.contains('on');
  els.forEach(el => el.classList.toggle('on', on));
  setAct(on ? 'Hide' : 'Translate', toggleUk, on);
}

// Shrink a line only when one long word is wider than the screen.
function fit() {
  stage.querySelectorAll('.xl, .l, .m, .head').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth > el.clientWidth + 1) {
      const fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(14, fs * el.clientWidth / el.scrollWidth * 0.97) + 'px';
    }
  });
}

function renderRows(s) {
  const c3 = s.rows.some(r => r.word);
  const rows = s.rows.map(r => {
    const lead = r.sign ? `<span class="sign k-${r.k}">${r.sign}</span>` : `<span class="ic" aria-hidden="true">${r.pic}</span>`;
    const word = c3 ? `<div class="cell w"><span>${fmt(r.word || '')}</span></div>` : '';
    return `<div class="row"><div class="cell lead">${lead}</div>${word}<div class="cell sen"><span>${fmt(r.sen)}</span>${ukSm(r.uk)}</div></div>`;
  }).join('');
  const note = s.note ? `<p class="note">${fmt(s.note)}</p>` : '';
  stage.innerHTML = `<div class="slide ${s.two ? 'xwide' : 'wide'}">${picEl(s)}${headEl(s)}<div class="rows ${c3 ? 'c3' : 'c2'}${s.two ? ' two' : ''}">${rows}</div>${note}${ukLine(s)}</div>`;
}

function renderMap(s) {
  const cols = [['s', 'some', '+'], ['a', 'any', '? · not'], ['n', 'no', '–']];
  const head = '<div></div>' + cols.map(([k, w, sign]) => `<div class="ch k-${k}">${w}<small>${sign}</small></div>`).join('');
  const rows = s.rows.map(([e, label, ua, cells]) =>
    `<div class="rh"><span class="ic" aria-hidden="true">${e}</span>${label}${ukSm(ua)}</div>` +
    cells.map(([en, u], n) => `<div class="cell-m k-${cols[n][0]}"><span>${fmt(en)}</span>${ukSm(u)}</div>`).join('')).join('');
  stage.innerHTML = `<div class="slide wide">${headEl(s)}<div class="map">${head}${rows}</div>${ukLine(s)}</div>`;
}

function renderChat(s) {
  stage.innerHTML = `<div class="slide wide">${SCN[s.scene]}<p class="formula">In real life</p>
    <div class="chat"><div class="bub q"><span>${fmt(s.q)}</span>${ukSm(s.qUk)}</div>
    <div class="bub r"><span>${fmt(s.r)}</span>${ukSm(s.rUk)}</div></div></div>`;
}

function renderFix(s) {
  const rows = s.rows.map(([bad, good, ua]) => `<div class="x">${bad}</div><div>${fmt(good)} <span class="ok-mark">✓</span>${ukSm(ua)}</div>`).join('');
  stage.innerHTML = `<div class="slide wide">${headEl(s)}<div class="fix"><div class="fh bad-h">✗ WRONG</div><div class="fh ok-h">✓ RIGHT</div>${rows}</div>${ukLine(s)}</div>`;
}

function render() {
  const s = slides[i];
  document.body.dataset.mode = s.mode;
  bar.style.width = ((i + 1) / slides.length * 100) + '%';
  prev.disabled = i === 0;
  next.disabled = i === slides.length - 1;
  setAct(null, null);
  stage.scrollTop = 0;

  if (s.t === 'text') {
    stage.innerHTML = `<div class="slide">${picEl(s)}<p class="${s.size}">${fmt(s.h)}</p>${ukLine(s)}</div>`;
  } else if (s.t === 'html') {
    stage.innerHTML = `<div class="slide">${fmt(s.html)}${ukLine(s)}</div>`;
  } else if (s.t === 'rows') {
    renderRows(s);
  } else if (s.t === 'map') {
    renderMap(s);
  } else if (s.t === 'chat') {
    renderChat(s);
  } else if (s.t === 'fix') {
    renderFix(s);
  } else if (s.t === 'fill') {
    renderFill(s);
  } else if (s.t === 'pick') {
    renderPick(s);
  } else if (s.t === 'match') {
    renderMatch(s);
  }
  if (s.t !== 'fill' && stage.querySelector('.uk')) setAct('Translate', toggleUk, false);
  fit();
}

function renderPick(s) {
  const q = fmt(s.q).replace('___', '<span class="blank" id="blank"></span>');
  const opts = s.o.map(o => `<button type="button" class="tile opt">${o}</button>`).join('');
  stage.innerHTML = `<div class="slide wide">${picEl(s)}<p class="m">${q}</p><div class="opts n${s.o.length}" style="--n:${s.o.length}">${opts}</div></div>`;
  const blank = $('#blank'), btns = [...stage.querySelectorAll('.opt')];
  btns.forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    if (b.textContent === s.a) {
      blank.textContent = s.a;
      blank.classList.add('ok');
      b.classList.add('done');
      btns.forEach(x => { x.disabled = true; });
      setAct('Next →', () => go(1));
      setTimeout(() => { if (b.isConnected) go(1); }, 1200);
    } else {
      b.classList.add('bad');
      b.disabled = true;
    }
  }));
}

function renderFill(s) {
  const whole = s.q === '___';
  const len = Math.max(...s.a.map(x => x.length)) + 1;
  const width = whole ? 'min(22ch, 100%)' : len + 'ch';
  const input = `<input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer" style="width:${width}">`;
  const hint = s.hint ? `<p class="hint" lang="uk">(${s.hint})</p>` : '';
  stage.innerHTML = `<div class="slide${whole ? ' wide' : ''}">${picEl(s)}<p class="m">${s.q.replace('___', input)}</p>${hint}<p class="answer" id="ans"></p></div>`;

  const el = $('#in');
  let tries = 0, done = false;
  const check = () => {
    if (done) return go(1);
    if (!el.value.trim()) return el.focus();
    if (s.a.some(a => norm(a) === norm(el.value))) {
      done = true;
      el.className = 'ok';
      el.readOnly = true;
      setAct('Next →', check);
      setTimeout(() => { if (el.isConnected) go(1); }, 1000);
    } else {
      tries++;
      el.className = '';
      void el.offsetWidth;
      el.className = 'bad';
      if (tries >= 2) $('#ans').textContent = s.a[0];
      el.focus();
    }
  };
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  el.addEventListener('input', () => { if (!done) el.className = ''; });
  setAct('Check', check);
  setTimeout(() => el.focus({ preventScroll: true }), 60);
}

function renderMatch(s) {
  const tiles = (side, k) => shuffle(s.pairs.map((p, n) => ({ n, w: p[k] })))
    .map(o => `<button type="button" class="tile" data-side="${side}" data-n="${o.n}">${o.w}</button>`).join('');
  stage.innerHTML = `<div class="slide wide"><div class="match"><div class="col">${tiles('en', 0)}</div><div class="col" lang="uk">${tiles('ua', 1)}</div></div></div>`;

  let sel = null, matched = 0;
  stage.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    if (t.classList.contains('done')) return;
    t.classList.remove('bad');
    if (!sel || sel.dataset.side === t.dataset.side) {
      if (sel) sel.classList.remove('sel');
      sel = sel === t ? null : t;
      if (sel) sel.classList.add('sel');
      return;
    }
    const a = sel, b = t;
    sel = null;
    a.classList.remove('sel');
    if (a.dataset.n === b.dataset.n) {
      [a, b].forEach(x => { x.classList.remove('bad'); x.classList.add('done'); x.disabled = true; });
      if (++matched === s.pairs.length) setTimeout(() => { if (a.isConnected) go(1); }, 900);
    } else {
      [a, b].forEach(x => { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); });
    }
  }));
}

function go(d) {
  const n = i + d;
  if (n < 0 || n >= slides.length) return;
  i = n;
  render();
}

prev.onclick = () => go(-1);
next.onclick = () => go(1);
act.onclick = () => onAct && onAct();

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if (slides[i].t === 'pick' && /^[1-9]$/.test(e.key)) {
    const b = stage.querySelectorAll('.opt')[+e.key - 1];
    if (b) b.click();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  else if (e.key === 't' || e.key === 'T') toggleUk();
});

stage.addEventListener('click', e => {
  if (e.target.closest('button, input')) return;
  if (slides[i].t === 'match' || slides[i].t === 'pick') return;
  const inp = $('#in');
  if (inp && !inp.readOnly) return inp.focus();
  go(e.clientX < innerWidth / 3 ? -1 : 1);
});

let x0 = null, y0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  x0 = null;
});

addEventListener('resize', fit);
document.fonts?.ready.then(fit);

function start(data) {
  i = Math.min(Math.max(0, data.i | 0), slides.length - 1);
  render();
}
window.claude?.hot?.snapshot?.(() => ({ i }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
