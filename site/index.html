  const TABS = [['overview', 'Overview'], ['mistakes', 'Mistakes'], ['words', 'Words'], ['pron', 'Sounds'], ['cards', 'Cards'], ['teacher', 'My teaching']];

  function lessonBlock(l) {
    const tab = UI.tab[l.id] || 'overview';
    const counts = { mistakes: arr(l.mistakes).length, words: arr(l.words).length, pron: arr(l.pronunciation).length, cards: arr(l.cards).length };
    return `<details class="lesson" data-lid="${esc(l.id)}" ${UI.open.has(l.id) ? 'open' : ''}>
      <summary><span class="ldate">${esc(fmtDate(l.date, true))}</span><span class="lmeta">${esc(arr(l.topics).slice(0, 3).join(' · '))}</span></summary>
      <div class="tabs" role="tablist">${TABS.map(([k, label]) => `<button class="tab" role="tab" type="button" id="tab-${esc(l.id)}-${k}"
        aria-selected="${tab === k}" data-lid="${esc(l.id)}" data-tab="${k}">${label}${counts[k] ? ` <span class="cnt">${counts[k]}</span>` : ''}</button>`).join('')}</div>
      <div class="tabpanel" role="tabpanel">${panel(l, tab)}</div></details>`;
  }

  function panel(l, tab) {
    const st = stateOf(l.id);
    if (tab === 'overview') {
      return `<p class="sum">${esc(l.summary)}</p>
        <div class="chips">${arr(l.topics).map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
        ${arr(l.strengths).length ? `<div class="group-h">Went well</div>${list(l.strengths)}` : ''}`;
    }
    if (tab === 'mistakes') {
      const ms = arr(l.mistakes).slice().sort((a, b) => (prioRank[a.priority] ?? 3) - (prioRank[b.priority] ?? 3));
      const label = { high: 'Discuss first', medium: 'If there’s time', low: 'Minor' };
      return ['high', 'medium', 'low'].map((p) => [p, ms.filter((m) => m.priority === p)]).filter(([, g]) => g.length)
        .map(([p, g]) => `<div class="group-h">${label[p]}</div><ul class="mlist">${g.map((m) => {
          const done = st.discussed && st.discussed[m.id];
          return `<li class="${done ? 'done' : ''}">${tick(l.id, 'discussed', m.id, done)}
            <div><label class="pair" for="discussed-${esc(l.id)}-${esc(m.id)}">${fix(m.said, m.better)}</label>
            <div class="meta">${m.count > 1 ? `<span class="cnt">×${esc(m.count)}</span>` : ''}${ts(m.t)}${m.note ? `<span class="note">${esc(m.note)}</span>` : ''}</div></div></li>`;
        }).join('')}</ul>`).join('');
    }
    if (tab === 'words') {
      return `<div class="table-wrap"><table><tbody>${arr(l.words).map((w) => `<tr><td class="muted">${esc(w.ua)}</td>
        <td><span class="mark en">${esc(w.en)}</span>${w.ex ? `<div class="note">${esc(w.ex)}</div>` : ''}</td><td class="tcell">${ts([w.t])}</td></tr>`).join('')}</tbody></table></div>`;
    }
    if (tab === 'pron') {
      return `<ul class="mlist plain">${arr(l.pronunciation).map((p) => `<li><div>
        <div class="meta"><span class="issue">${esc(p.issue)}</span>${p.confidence === 'clear' ? '' : '<span class="chip check">check</span>'}<span class="ts">${esc(p.evidence)}</span></div>
        <div class="note">${esc(p.tip)}</div></div></li>`).join('')}</ul>`;
    }
    if (tab === 'cards') {
      const cs = arr(l.cards);
      if (!cs.length) return '<p class="muted">No cards.</p>';
      return `<div class="cards">${cs.map((c) => {
        const sent = st.sent && st.sent[c.n];
        return `<div class="cardimg"><img src="/_blob/${esc(c.asset)}" alt="${esc(c.title)}" loading="lazy">
          <span class="t">${esc(c.title)}</span>
          ${dl ? `<button class="btn" type="button" data-save="${esc(c.asset)}" data-name="${esc(l.id)}-card-${esc(c.n)}.png">Save image</button>` : ''}
          <label class="check">${tick(l.id, 'sent', c.n, sent)} Sent</label></div>`;
      }).join('')}</div>`;
    }
    if (tab === 'teacher') {
      const t = l.teacher || {};
      return `<div class="group-h">Your English</div>
        <ul class="mlist plain">${arr(t.english).map((e) => `<li><div><div class="pair">${fix(e.said, e.better)}</div>
          <div class="meta">${ts([e.t])}${e.why ? `<span class="note">${esc(e.why)}</span>` : ''}</div></div></li>`).join('')}</ul>
        <div class="cols"><div><div class="group-h">Worked</div>${list(t.strengths)}</div>
        <div><div class="group-h">Try next time</div>${list([...arr(t.improve), ...arr(t.habits)])}</div></div>`;
    }
    return '';
  }

  function viewTeaching() {
    const tp = S.teacher;
    const all = Object.values(S.lessons).filter((l) => l.teacher).sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!tp && !all.length) return `<h1>My teaching</h1><p class="lede">Notes appear with the first lesson report.</p>`;
    const n = (tp && tp.lessonsReviewed) || all.length;
    const focus = tp ? `<section class="panel"><div class="panel-h"><h2>Focus now</h2><span class="muted small">${esc(n)} lessons</span></div>
      <div class="cols3"><div><div class="group-h">Your English</div>${list(tp.englishFocus)}</div>
      <div><div class="group-h">Your teaching</div>${list(tp.teachingFocus)}</div>
      <div><div class="group-h">Doing well</div>${list(tp.strengths)}</div></div></section>` : '';
    const per = all.map((l) => {
      const s = S.students[l.student];
      const id = `t-${l.id}`;
      return `<details class="lesson" data-lid="${esc(id)}" ${UI.open.has(id) ? 'open' : ''}>
        <summary><span class="ldate">${esc(s ? s.name : l.student)}</span><span class="lmeta">${esc(fmtDate(l.date))}</span></summary>
        <div class="tabpanel">${panel(l, 'teacher')}</div></details>`;
    }).join('');
    return `<h1>My teaching</h1><p class="lede small">Quotes are matched to you by context; skip any that weren't yours.</p>
      <div class="stack" style="margin-top:20px">${focus}<section><h2 class="sec">By lesson</h2>${per}</section></div>`;
  }

  // ---------- schedule ----------
  // schedule/<id>: a weekly series {kind:'series', student, start, time, durationMin, tz, every, until, ex{origDate:{status,date,time,durationMin,note}}, note}
  // or a one-off {kind:'one', student, date, time, durationMin, tz, status, note}. schedule/settings: {tz, hour12, studentTz{sid: tz}}.
  // Times are wall-clock in the lesson's own tz; SchedCore (schedule-core.js) turns them into instants, DST included.
  const SC = window.SchedCore || null;
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const LENGTHS = [30, 45, 50, 60, 75, 90, 120];
  // one zone can have two names (Chrome reports Europe/Kiev for Europe/Kyiv): compare zones by the engine's canonical name
  const canon = new Map();
  const sameTz = (a, b) => {
    const c = (z) => { if (!canon.has(z)) { let r = z; try { r = new Intl.DateTimeFormat('en-US', { timeZone: z }).resolvedOptions().timeZone; } catch (e) { /* keep */ } canon.set(z, r); } return canon.get(z); };
    return a === b || (!!a && !!b && c(a) === c(b));
  };
  const browserTz = (() => { try { const z = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; return sameTz(z, 'Europe/Kyiv') ? 'Europe/Kyiv' : z; } catch (e) { return 'UTC'; } })();
  const setg = () => S.schedSettings || {};
  const myTz = () => (SC && SC.validTz(setg().tz) ? setg().tz : browserTz);
  const h12 = () => !!setg().hour12;
  const stuTz = (sid) => { const z = (setg().studentTz || {})[sid]; return SC && z && SC.validTz(z) && !sameTz(z, myTz()) ? z : ''; };
  const city = (tz) => String(tz || '').split('/').pop().replace(/_/g, ' ').replace(/^Kiev$/, 'Kyiv');
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const strip = (d) => { const { id, ...rest } = d; return clone(rest); };
  const schedDocs = () => Object.values(S.sched);
  const nameOf = (sid, doc) => String((S.students[sid] && S.students[sid].name) || (doc && doc.name) || sid || '');
  const isObj = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
  // occurrence key → doc id: a one-off's key is its id; a series' key is id@origDate (an id may itself hold '@')
  const docOf = (key) => { const k = String(key); return S.sched[k] || k.lastIndexOf('@') < 0 ? k : k.slice(0, k.lastIndexOf('@')); };
  const todayTz = () => SC.fromInstant(Date.now(), myTz()).date;
  const newId = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const ft = (t) => SC.fmtTime(t, h12());
  const dayShort = (iso) => `${DOW[SC.weekday(iso)]}, ${fmtDate(iso)}`;
  const dayLong = (iso) => { const d = parseD(iso); return `${DOW_LONG[SC.weekday(iso)]}, ${d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}`; };
  const at = (ms, tz) => SC.fromInstant(ms, tz || myTz());
  const range = (o, tz) => `${ft(at(o.start, tz).time)}–${ft(at(o.end, tz).time)}`;
  const nb = (s) => s.replace(/ /g, '\u00a0');   // "5:00 PM–6:00 PM" may break after the dash only
  const colorOf = (sid) => {
    const ids = Object.keys(S.students).sort();
    const i = ids.indexOf(sid);
    return 'c' + ((i < 0 ? [...String(sid)].reduce((a, c) => a + c.charCodeAt(0), 0) : i) % 8);
  };
  const dot = (sid) => `<span class="dot ${colorOf(sid)}" aria-hidden="true"></span>`;
  const repeatText = (d) => !d || d.kind !== 'series' ? 'One-off lesson'
    : `${(d.every || 1) > 1 ? `Every ${d.every} weeks` : 'Every week'} on ${DOW_LONG[SC.weekday(d.start)]}${d.until ? ` until ${fmtDate(d.until)}` : ''}`;
  const occsIn = (from, to, docs) => SC.expand(docs || schedDocs(), from, to, myTz());
  const dueOccs = () => { const t = todayTz(), now = Date.now(); return occsIn(SC.addDays(t, -60), t).filter((o) => o.status === 'planned' && o.end <= now); };
  const nextFor = (sid) => (SC ? SC.nextOccurrence(schedDocs(), sid, Date.now(), myTz()) : null);
  const nextLabel = (o) => { const a = at(o.start); return `${dayShort(a.date)} · ${ft(a.time)}`; };
  // active weekly slots of a student, for chips on their page
  function slotsOf(sid) {
    const t = todayTz();
    return schedDocs().filter((d) => d.kind === 'series' && d.student === sid && (!d.until || d.until >= t))
      .map((d) => { const o = SC.expand([d], SC.addDays(t, 0), SC.addDays(t, 7 * (d.every || 1) + 7), myTz()).find((x) => !x.moved); return { d, o }; })
      .filter((x) => x.o).map((x) => ({ ...x, a: at(x.o.start) }))
      .sort((x, y) => ((x.a.weekday + 6) % 7) - ((y.a.weekday + 6) % 7) || (x.a.time < y.a.time ? -1 : 1))
      .map(({ d, a }) => { return `${DOW[a.weekday]} ${ft(a.time)}${(d.every || 1) > 1 ? ` · every ${d.every} wks` : ''}`; });
  }

  // ----- writes: one chain per document, optimistic, undo through the toast -----
  const SQ = { chains: {}, pending: 0, failed: false, local: {}, n: {} };
  // lay this page's queued writes over a snapshot (see BQ above)
  function overlaySched() {
    Object.entries(SQ.local).forEach(([id, data]) => {
      if (id === 'settings') { if (data) S.schedSettings = data; return; }
      if (data) S.sched[id] = { ...data, id }; else delete S.sched[id];
    });
  }
  function renderSave() {
    const el = document.getElementById('savestate');
    if (!el) return;
    el.className = 'savestate' + (SQ.failed ? ' err' : '');
    el.textContent = SQ.pending ? 'Saving…' : SQ.failed ? 'Last change wasn’t saved' : '';
  }
  function writeOne(id, data) {
    if (!db) return;
    SQ.pending++; renderSave();
    SQ.local[id] = data ? clone(data) : null; SQ.n[id] = (SQ.n[id] || 0) + 1;
    const ref = db.collection('schedule').doc(id);
    const go = () => (data ? ref.set(data) : ref.delete());
    SQ.chains[id] = (SQ.chains[id] || Promise.resolve())
      .then(() => go().catch((e) => {
        if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 500 + Math.random() * 1000)).then(go);
        throw e;
      }))
      .then(() => { SQ.failed = false; }, (e) => {
        SQ.failed = true;
        toast(e && e.code === 'invalid_argument' ? 'You can view this schedule but not change it.'
          : e && e.code === 'quota_exceeded' ? 'The notebook is full. Delete old one-off lessons, then try again.'
          : 'Couldn’t save that change. Check the connection and try again.');
      })
      .finally(() => { SQ.pending--; if (!--SQ.n[id]) { delete SQ.n[id]; delete SQ.local[id]; } renderSave(); });
  }
  // changes: [{id, data | null}]; extra: optional {redo, undo} for side effects (billing)
  function commit(changes, msg, extra) {
    const before = changes.map(({ id }) => ({ id, data: S.sched[id] ? strip(S.sched[id]) : null }));
    const apply = (list) => list.forEach(({ id, data }) => { if (data) S.sched[id] = { ...clone(data), id }; else delete S.sched[id]; });
    apply(changes);
    if (extra && extra.redo) extra.redo();
    render();
    changes.forEach(({ id, data }) => writeOne(id, data));
    toast(msg, { label: 'Undo', fn: () => {
      apply(before);
      if (extra && extra.undo) extra.undo();
      render();
      before.forEach(({ id, data }) => writeOne(id, data));
      toast('Undone');
    } });
  }

  // billing: a done lesson logs −1 once per day (Claude's transcript step skips days already logged)
  // done: charge `date` unless that day is already logged (returns billed = the day charged)
  // undone: reverse only a charge this page made (`date` = the mark's stored `billed` day)
  const ours = (date) => (e) => e && e.kind === 'lesson' && e.date === date && e.src === 'schedule';
  function billFor(sid, date, done) {
    const b = S.billing[sid];
    if (!b || !date) return { msg: '' };
    const log = arr(b.log).filter(Boolean);
    if (done) {
      if (log.some((e) => e.kind === 'lesson' && e.date === date)) return { msg: ' · already logged' };
      return { msg: ' · −1 lesson', billed: date,
        redo: () => writeBill(sid, (x) => { x.log.push({ date, kind: 'lesson', n: -1, src: 'schedule' }); }),
        undo: () => writeBill(sid, (x) => { const i = x.log.findIndex(ours(date)); if (i >= 0) x.log.splice(i, 1); }) };
    }
    const entry = log.find(ours(date));
    if (!entry) return { msg: '' };
    return { msg: ' · lesson un-logged', redo: () => writeBill(sid, (x) => { const j = x.log.findIndex(ours(date)); if (j >= 0) x.log.splice(j, 1); }),
      undo: () => writeBill(sid, (x) => { x.log.push(clone(entry)); }) };
  }

  // a double tap must not also mark the row that slides under the finger
  // (a timer, not the clock: a device clock that jumps must not leave the buttons dead)
  const tapLocked = () => { if (UI.lock) return true; UI.lock = true; setTimeout(() => { UI.lock = false; }, 450); return false; };
  function setStatus(o, status) {
    const doc = S.sched[o.docId];
    if (!doc) return;
    const d = strip(doc);
    let mark = d;   // where status/billed live: the ex entry of a series, the doc of a one-off
    if (d.kind === 'series') {
      d.ex = isObj(d.ex) ? d.ex : {};
      mark = isObj(d.ex[o.origDate]) ? { ...d.ex[o.origDate] } : {};
    }
    const lessonDate = at(o.start).date;
    const bill = status === 'done' ? billFor(o.student, lessonDate, true) : o.status === 'done' ? billFor(o.student, mark.billed, false) : { msg: '' };
    if (status === 'planned') delete mark.status; else mark.status = status;
    if (status !== 'done') delete mark.billed;
    if (bill.billed) mark.billed = bill.billed;
    if (d.kind === 'series') { if (Object.keys(mark).length) d.ex[o.origDate] = mark; else delete d.ex[o.origDate]; }
    const label = status === 'done' ? 'Marked done' : status === 'cancelled' ? 'Lesson cancelled' : 'Back to planned';
    commit([{ id: o.docId, data: d }], `${label}: ${nameOf(o.student, doc)}, ${dayShort(lessonDate)}${bill.msg}`, bill);
  }

  function removeFromHere(o) {
    const doc = S.sched[o.docId];
    if (!doc) return;
    const who = nameOf(o.student, doc);
    if (doc.kind !== 'series' || o.origDate <= doc.start) {
      commit([{ id: o.docId, data: null }], doc.kind === 'series' ? `Removed all ${who}’s lessons in this series` : `Deleted ${who}’s lesson`);
      return;
    }
    const d = strip(doc);
    d.until = SC.addDays(o.origDate, -1);
    d.ex = isObj(d.ex) ? d.ex : {};
    Object.keys(d.ex).forEach((k) => { if (k >= o.origDate) delete d.ex[k]; });
    commit([{ id: o.docId, data: d }], `${who}: no more lessons from ${dayShort(o.origDate)}`);
  }

  // ----- views -----
  function viewSchedule() {
    if (!SC) return `<h1>Schedule</h1><p class="lede">The scheduler didn’t load. Reload the page to try again.</p>`;
    const tz = myTz(), today = todayTz(), now = Date.now();
    const ws = SC.addDays(SC.weekStart(today), 7 * UI.week), we = SC.addDays(ws, 6);
    const occs = occsIn(ws, we);
    const clash = SC.overlaps(occs);
    const live = occs.filter((o) => o.status !== 'cancelled');
    const mins = live.reduce((a, o) => a + (o.durationMin || 0), 0);
    const hrs = `${Math.floor(mins / 60)} h${mins % 60 ? ` ${mins % 60} min` : ''}`;
    const due = dueOccs();
    const span = `${fmtDate(ws)} – ${parseD(ws).getMonth() === parseD(we).getMonth() ? parseD(we).getDate() : fmtDate(we)}`;
    const rel = UI.week === 0 ? 'This week' : UI.week === 1 ? 'Next week' : UI.week === -1 ? 'Last week' : `Week of ${fmtDate(ws)}`;

    const head = `<div class="sched-h"><div><h1>Schedule</h1>
        <p class="lede">${esc(rel)} · ${esc(span)} · ${live.length ? `${live.length} lesson${live.length === 1 ? '' : 's'}, ${esc(hrs)}` : 'no lessons'}</p>
        <p class="hint" style="margin:4px 0 0">Times in ${esc(city(tz))} time · <button class="tzbtn" type="button" data-tzopen>Time zones</button>
          <span class="savestate" id="savestate" role="status"></span></p></div>
      <div class="wknav"><button class="btn sq" type="button" data-week="-1" aria-label="Previous week">‹</button>
        <button class="btn" type="button" data-week="0" ${UI.week === 0 ? 'disabled' : ''}>Today</button>
        <button class="btn sq" type="button" data-week="1" aria-label="Next week">›</button>
        <button class="btn primary lg grow" type="button" data-add="${esc(UI.week === 0 ? today : ws)}">+ Lesson</button></div></div>`;

    const duePanel = due.length ? `<section class="panel due" style="margin-top:18px"><div class="panel-h"><h2>Did these happen?</h2><span class="muted small">${due.length} to mark · done ones log −1 lesson</span></div>
      <ul class="duelist">${due.slice(-6).map((o) => { const a = at(o.start); return `<li>
        <span class="who">${dot(o.student)}<span>${esc(nameOf(o.student, S.sched[o.docId]))} <span class="when2">${esc(dayShort(a.date))} · ${esc(ft(a.time))}</span></span></span>
        <span class="acts"><button class="btn" type="button" data-status="done" data-key="${esc(o.key)}" data-near="${esc(a.date)}">Done</button>
          <button class="btn ghost" type="button" data-status="cancelled" data-key="${esc(o.key)}" data-near="${esc(a.date)}">Didn’t happen</button></span></li>`; }).join('')}</ul>
      ${due.length > 6 ? `<p class="hint" style="margin:10px 0 0">${due.length - 6} more in earlier weeks.</p>` : ''}</section>` : '';

    const days = [];
    for (let i = 0; i < 7; i++) days.push(SC.addDays(ws, i));
    const byDay = {};
    occs.forEach((o) => { const dte = at(o.start).date; (byDay[dte] = byDay[dte] || []).push(o); });
    const week = `<div class="week">${days.map((dte) => {
      const list = byDay[dte] || [];
      const isToday = dte === today, past = dte < today;
      return `<section class="day ${isToday ? 'today' : ''} ${past ? 'past' : ''}" aria-label="${esc(dayLong(dte))}">
        <div class="dh"><b>${DOW[SC.weekday(dte)]}${isToday ? ' · today' : ''}</b><span>${esc(fmtDate(dte))}</span></div>
        <div class="dbody">${list.map((o) => {
          const doc = S.sched[o.docId];
          const due1 = o.status === 'planned' && o.end <= now;
          const st = stuTz(o.student);
          const cl = o.status !== 'cancelled' && (clash.get(o.key) || []).length;
          const meta = [
            o.status === 'done' ? 'Done' : o.status === 'cancelled' ? 'Cancelled' : due1 ? 'Mark it' : '',
            o.moved && o.status !== 'cancelled' ? 'Moved' : '',
            st ? `${city(st)} ${nb(range(o, st))}` : '',
          ].filter(Boolean).join(' · ');
          return `<button type="button" class="occ ${o.status} ${due1 ? 'due' : ''} ${cl ? 'clash' : ''}" data-open="${esc(o.key)}" data-near="${esc(dte)}">
            <span class="ot">${esc(nb(range(o)))}</span>
            <span class="on">${dot(o.student)}<span>${esc(nameOf(o.student, doc))}</span></span>
            ${meta ? `<span class="om">${esc(meta)}</span>` : ''}${cl ? '<span class="om clash-t">Overlaps</span>' : ''}</button>`;
        }).join('')}<button class="dadd" type="button" data-add="${esc(dte)}" aria-label="Add a lesson on ${esc(dayLong(dte))}">+ Add</button></div></section>`;
    }).join('')}</div>`;

    const empty = !schedDocs().length ? `<div class="callout" style="margin-top:18px">No lessons yet. Tap <b>+ Lesson</b> and pick “Every week” for a regular slot. Mark each lesson done afterwards and it comes off the student’s balance.</div>` : '';
    return head + duePanel + empty + week;
  }

  // ----- the sheet (dialog): lesson details, or a form -----
  const sheet = document.getElementById('sheet');
  function findOcc(key, near) {
    const docId = docOf(key);
    const doc = S.sched[docId];
    if (!doc || !near) return null;
    return SC.expand([doc], SC.addDays(near, -3), SC.addDays(near, 3), myTz()).find((o) => o.key === key) || null;
  }
  function openSheet(state) {
    UI.sheet = state;
    paintSheet();
    if (!sheet.open) { try { sheet.showModal(); } catch (e) { sheet.setAttribute('open', ''); } }
    const f = sheet.querySelector('[autofocus]') || sheet.querySelector('.xbtn');
    if (f) f.focus();
  }
  function closeSheet() { UI.sheet = null; if (sheet.open) sheet.close(); }
  sheet.addEventListener('close', () => { UI.sheet = null; const t = document.getElementById('toast'); if (t && t.parentNode === sheet) document.body.append(t); });
  let downOnBackdrop = false;   // a text selection released over the backdrop must not close a form
  sheet.addEventListener('pointerdown', (e) => { downOnBackdrop = e.target === sheet; });
  sheet.addEventListener('click', (e) => { if (e.target === sheet && downOnBackdrop) closeSheet(); });   // tap on the backdrop

  // re-paint lesson details when data changes underneath (never a form: it would wipe what she typed)
  function refreshSheet() {
    if (!UI.sheet || UI.sheet.type !== 'info' || !sheet.open) return;
    const sig = JSON.stringify(findOcc(UI.sheet.key, UI.sheet.near)) + (S.sched[docOf(UI.sheet.key)] ? '' : 'gone');
    if (sig !== UI.sheet.sig) paintSheet();
  }
  function paintSheet() {
    const st = UI.sheet;
    if (!st) return;
    const t = sheet.querySelector('#toast');   // keep a toast shown inside the sheet
    sheet.innerHTML = st.type === 'info' ? infoHTML(st) : st.type === 'tz' ? tzHTML() : formHTML(st);
    if (t) sheet.append(t);
    if (st.type === 'form') syncForm();
  }
  const closeBtn = '<button class="xbtn" type="button" data-close aria-label="Close">×</button>';

  function infoHTML(st) {
    const o = findOcc(st.key, st.near);
    st.sig = JSON.stringify(o) + (S.sched[docOf(st.key)] ? '' : 'gone');
    if (!o) return `<div class="sheet-in"><div class="sheet-h"><h2 id="sheet-title">Lesson removed</h2>${closeBtn}</div><p class="muted" style="margin:0">This lesson is no longer in the schedule.</p></div>`;
    const doc = S.sched[o.docId];
    const a = at(o.start), now = Date.now();
    const stz = stuTz(o.student);
    const clashes = o.status === 'cancelled' ? [] : SC.conflictsWith(occsIn(SC.addDays(a.date, -1), SC.addDays(a.date, 1)), o, o.key);
    const report = S.lessons[`${o.student}-${a.date}`];
    const started = o.start <= now;
    const status = o.status === 'done' ? '<span class="chip fixed big">Done</span>' : o.status === 'cancelled' ? '<span class="chip big">Cancelled</span>'
      : o.end <= now ? '<span class="chip medium big">Did it happen?</span>' : '';
    const series = doc.kind === 'series';
    return `<div class="sheet-in">
      <div class="sheet-h"><div><div class="eyebrow">${esc(repeatText(doc))}</div>
        <h2 id="sheet-title">${dot(o.student)} ${esc(nameOf(o.student, doc))}</h2>
        <div class="when3">${esc(dayLong(a.date))} · ${esc(range(o))}${o.durationMin ? ` · ${o.durationMin} min` : ''}</div>
        ${stz ? `<div class="when3">${esc(city(stz))}: ${esc(dayShort(at(o.start, stz).date))} · ${esc(range(o, stz))}</div>` : ''}</div>${closeBtn}</div>
      ${status || o.moved ? `<div class="chips">${status}${o.moved ? `<span class="chip new big">Moved from ${esc(dayShort(o.origDate))}</span>` : ''}</div>` : ''}
      ${clashes.length ? `<div class="box warn">Overlaps with ${clashes.map((c) => `${esc(nameOf(c.student, S.sched[c.docId]))} (${esc(range(c))})`).join(', ')}.</div>` : ''}
      ${o.note ? `<p style="margin:0">${esc(o.note)}</p>` : ''}
      ${report ? `<a class="small" href="#s-${esc(o.student)}" data-close>Open the lesson report →</a>` : ''}
      <div class="acts">${o.status === 'planned'
        ? `${started ? `<button class="btn primary lg" type="button" data-act="done" autofocus>Done</button>` : ''}
           <button class="btn lg" type="button" data-act="cancelled">${started ? 'Didn’t happen' : 'Cancel this lesson'}</button>`
        : `<button class="btn lg" type="button" data-act="planned">${o.status === 'done' ? 'Not done after all' : 'Restore this lesson'}</button>`}</div>
      <div class="acts split">${series
        ? `<button class="btn" type="button" data-act="move">Move this lesson</button>${started ? '' : '<button class="btn" type="button" data-act="series">Change from here on</button>'}`
        : `<button class="btn" type="button" data-act="edit">Edit</button>`}
        <button class="btn" type="button" data-act="copy">Copy time</button></div>
      <div class="copyslot" hidden><input class="inp copyout" id="copy-out" readonly aria-label="Lesson time to send"></div>
      ${(series ? !started : o.status !== 'done') ? `<div class="acts"><button class="btn danger" type="button" data-act="remove">${series ? (o.origDate <= doc.start ? 'Delete the whole series' : 'Stop repeating from here') : 'Delete this lesson'}</button></div>`
        : series ? '<p class="hint" style="margin:0">To change or stop this series, open one of its coming lessons.</p>' : ''}
    </div>`;
  }

  function tzOptions(sel, extra) {
    let all = [];
    try { all = Intl.supportedValuesOf('timeZone'); } catch (e) { all = []; }
    const common = [];
    [myTz(), browserTz, 'Europe/Kyiv', 'America/Vancouver', 'America/Edmonton', 'America/Winnipeg', 'America/Toronto', 'Europe/Warsaw', 'Europe/London', ...(extra || [])]
      .forEach((z) => { if (SC.validTz(z) && !common.some((c) => sameTz(c, z))) common.push(z); });
    const off = (z) => { const m = SC.tzOffsetMin(Date.now(), z); return `UTC${m < 0 ? '−' : '+'}${Math.floor(Math.abs(m) / 60)}${Math.abs(m) % 60 ? ':' + String(Math.abs(m) % 60).padStart(2, '0') : ''}`; };
    const opt = (z) => `<option value="${esc(z)}" ${z === sel ? 'selected' : ''}>${esc(city(z))} (${esc(off(z))})</option>`;
    return `<optgroup label="Common">${common.map(opt).join('')}</optgroup>${all.length ? `<optgroup label="All">${all.filter((z) => !common.some((c) => sameTz(c, z))).map((z) => `<option value="${esc(z)}" ${z === sel ? 'selected' : ''}>${esc(z.replace(/_/g, ' '))}</option>`).join('')}</optgroup>` : ''}`;
  }
  function tzHTML() {
    const ids = Object.keys(S.students).sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    const st = setg().studentTz || {};
    return `<form class="sheet-in" id="tzform" novalidate>
      <div class="sheet-h"><div><h2 id="sheet-title">Time zones</h2><p class="hint" style="margin:4px 0 0">Lessons stay at the time you set, in the zone you set them in. When clocks change in one country only, the other side’s time moves.</p></div>${closeBtn}</div>
      <div class="field"><label class="flabel" for="tz-me">Your time zone</label><select class="inp" id="tz-me">${tzOptions(myTz())}</select>
        ${!sameTz(browserTz, myTz()) ? `<span class="hint">This device is set to ${esc(city(browserTz))}.</span>` : ''}</div>
      <div class="field"><label class="flabel" for="tz-12">Clock</label><select class="inp" id="tz-12"><option value="24" ${h12() ? '' : 'selected'}>24-hour (17:30)</option><option value="12" ${h12() ? 'selected' : ''}>12-hour (5:30 PM)</option></select></div>
      ${ids.length ? `<div class="field"><span class="flabel">Students who live elsewhere</span><div class="tzrows">${ids.map((sid) => `
        <div class="tzrow"><label for="tz-s-${esc(sid)}">${esc(nameOf(sid))}</label><select class="inp" id="tz-s-${esc(sid)}" data-sid="${esc(sid)}">
          <option value="">Same as you</option>${tzOptions(st[sid] || '__none')}</select></div>`).join('')}</div>
        <span class="hint">Their local time shows next to each lesson.</span></div>` : ''}
      <div class="acts"><button class="btn primary lg" type="submit">Save</button><button class="btn lg" type="button" data-close>Cancel</button></div></form>`;
  }

  // form modes: new | move (one lesson of a series) | series (this and following) | edit (a one-off)
  function formFor(mode, o, date) {
    const doc = o ? S.sched[o.docId] : null;
    const base = { type: 'form', mode, o, confirmed: false, errors: [], warn: [] };
    if (mode === 'new') {
      const sid = UI.lastStudent && S.students[UI.lastStudent] ? UI.lastStudent : '';
      return { ...base, v: { student: sid, name: '', date, time: '17:00', len: 60, repeat: '1', days: [SC.weekday(date)], until: '', tz: myTz(), note: '' } };
    }
    if (mode === 'move') return { ...base, v: { student: o.student, date: o.date, time: o.time, len: o.durationMin, tz: o.tz, note: (doc.ex && doc.ex[o.origDate] && doc.ex[o.origDate].note) || '' } };
    if (mode === 'series') return { ...base, v: { student: o.student, date: o.origDate, time: doc.time, len: doc.durationMin, repeat: String(doc.every || 1), until: doc.until || '', tz: doc.tz, note: doc.note || '' } };
    return { ...base, v: { student: doc.student, name: doc.name || '', date: doc.date, time: doc.time, len: doc.durationMin, repeat: 'none', days: [SC.weekday(doc.date)], until: '', tz: doc.tz, note: doc.note || '' } };
  }
  function formHTML(F) {
    const v = F.v, m = F.mode;
    const title = m === 'new' ? 'New lesson' : m === 'move' ? 'Move this lesson' : m === 'series' ? 'Change from here on' : 'Edit lesson';
    const sub = m === 'move' ? `Only the lesson of ${dayLong(F.o.origDate)} moves. Other weeks stay as they are.`
      : m === 'series' ? `From ${dayLong(F.o.origDate)} on. Earlier lessons stay as they were.` : '';
    const ids = Object.keys(S.students).sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    const pickStudent = m === 'new' || m === 'edit';
    const other = pickStudent && v.student && !S.students[v.student];
    const lens = [...new Set([...LENGTHS, Number(v.len) || 60])].sort((a, b) => a - b);
    const tzs = [];
    [v.tz, myTz(), stuTz(v.student)].forEach((z) => { if (z && !tzs.some((x) => sameTz(x, z))) tzs.push(z); });
    const canRepeat = m !== 'move';
    return `<form class="sheet-in" id="lform" novalidate>
      <div class="sheet-h"><div><h2 id="sheet-title">${esc(title)}</h2>${sub ? `<p class="hint" style="margin:4px 0 0">${esc(sub)}</p>` : ''}</div>${closeBtn}</div>
      ${pickStudent ? `<div class="field"><label class="flabel" for="f-student">Student</label>
        <select class="inp" id="f-student" ${v.student ? '' : 'autofocus'}><option value="" ${v.student ? '' : 'selected'} disabled>Choose…</option>
          ${ids.map((sid) => `<option value="${esc(sid)}" ${sid === v.student ? 'selected' : ''}>${esc(nameOf(sid))}</option>`).join('')}
          <option value="__new" ${other ? 'selected' : ''}>Someone new…</option></select>
        <input class="inp" id="f-name" placeholder="Their name" value="${esc(other ? (v.student === '__new' ? v.name : (v.name || v.student)) : '')}" ${other ? '' : 'hidden'} aria-label="New student’s name"></div>`
        : `<div class="field"><span class="flabel">Student</span><b>${dot(v.student)} ${esc(nameOf(v.student, S.sched[F.o.docId]))}</b></div>`}
      <div class="grid3">
        <div class="field"><label class="flabel" for="f-date" id="f-date-l">${m === 'new' && v.repeat !== 'none' ? 'Starts' : 'Date'}</label><input class="inp" type="date" id="f-date" value="${esc(v.date)}" required></div>
        <div class="field"><label class="flabel" for="f-time">Time</label><input class="inp" type="time" id="f-time" value="${esc(v.time)}" step="300" required></div>
        <div class="field"><label class="flabel" for="f-len">Length</label><select class="inp" id="f-len">${lens.map((n) => `<option value="${n}" ${n === Number(v.len) ? 'selected' : ''}>${n} min</option>`).join('')}</select></div>
      </div>
      ${canRepeat ? `<div class="grid2">
        <div class="field"><label class="flabel" for="f-repeat">Repeats</label><select class="inp" id="f-repeat">
          ${m === 'series' ? '' : `<option value="none" ${v.repeat === 'none' ? 'selected' : ''}>Doesn’t repeat</option>`}
          <option value="1" ${v.repeat === '1' ? 'selected' : ''}>Every week</option><option value="2" ${v.repeat === '2' ? 'selected' : ''}>Every 2 weeks</option>
          ${Number(v.repeat) > 2 ? `<option value="${esc(v.repeat)}" selected>Every ${esc(v.repeat)} weeks</option>` : ''}</select></div>
        <div class="field" id="f-until-w"><label class="flabel" for="f-until">Last lesson <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></label>
          <input class="inp" type="date" id="f-until" value="${esc(v.until)}"></div></div>
        ${m === 'new' ? `<div class="field" id="f-days-w"><span class="flabel" id="f-days-l">On</span><div class="wdays" role="group" aria-labelledby="f-days-l">
          ${[1, 2, 3, 4, 5, 6, 0].map((d) => `<button type="button" class="wday" data-wday="${d}" aria-pressed="${v.days.includes(d)}">${DOW[d]}</button>`).join('')}</div>
          <span class="hint">Pick several days for a student with more than one lesson a week.</span></div>` : ''}` : ''}
      ${tzs.length > 1 ? `<div class="field"><label class="flabel" for="f-tz">Time is in</label><select class="inp" id="f-tz">${tzs.map((z) => `<option value="${esc(z)}" ${z === v.tz ? 'selected' : ''}>${esc(city(z))} time${sameTz(z, myTz()) ? ' (yours)' : ''}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label class="flabel" for="f-note">Note <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></label>
        <input class="inp" id="f-note" value="${esc(v.note)}" maxlength="200" placeholder="${m === 'move' ? 'e.g. moved at her request' : 'e.g. trial lesson'}"></div>
      ${F.errors.length ? `<div class="box err" role="alert">${F.errors.length === 1 ? esc(F.errors[0]) : `<ul>${F.errors.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`}</div>` : ''}
      ${F.warn.length ? `<div class="box warn" role="alert">This overlaps with:<ul>${F.warn.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="acts"><button class="btn primary lg" type="submit">${F.warn.length ? 'Save anyway' : 'Save'}</button><button class="btn lg" type="button" data-close>Cancel</button></div>
    </form>`;
  }
  // show/hide the parts that depend on other fields (no re-render, so typing is never lost)
  function syncForm() {
    const q = (id) => sheet.querySelector('#' + id);
    const rep = q('f-repeat'), stu = q('f-student'), nm = q('f-name');
    const repeating = rep && rep.value !== 'none';
    if (q('f-until-w')) q('f-until-w').hidden = !repeating;
    if (q('f-days-w')) q('f-days-w').hidden = !repeating;
    if (q('f-date-l') && UI.sheet.mode === 'new') q('f-date-l').textContent = repeating ? 'Starts' : 'Date';
    if (stu && nm) nm.hidden = stu.value !== '__new';
  }
  function readForm() {
    const F = UI.sheet, q = (id) => sheet.querySelector('#' + id);
    const v = { ...F.v };
    if (q('f-student')) v.student = q('f-student').value;
    if (q('f-name')) v.name = q('f-name').value.trim();
    v.date = q('f-date').value; v.time = (q('f-time').value || '').slice(0, 5); v.len = Number(q('f-len').value);
    if (q('f-repeat')) v.repeat = q('f-repeat').value;
    if (q('f-until')) v.until = q('f-until').value;
    if (q('f-tz')) v.tz = q('f-tz').value;
    v.note = q('f-note').value.trim();
    if (F.mode === 'new') v.days = [...sheet.querySelectorAll('.wday[aria-pressed="true"]')].map((b) => Number(b.dataset.wday));
    return v;
  }
  const slug = (s) => String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  // the documents a form produces: [{id, data|null}] plus the occurrence keys to check for overlaps (null = every occurrence of those docs)
  function buildChanges(F, v) {
    const errs = [];
    let student = v.student, name = '';
    if (student === '__new') {
      if (!v.name) errs.push('Write the new student’s name.');
      const was = F.mode === 'edit' ? S.sched[F.o.docId] : null;
      // one id per form (a retried "Save anyway" must not mint a new person); editing keeps the lesson's own id
      F.guestId = F.guestId || (was && !S.students[was.student] ? was.student : 'guest-' + Math.random().toString(36).slice(2, 7));
      name = v.name; student = was && was.name === v.name ? was.student : slug(v.name) || F.guestId;
      const known = Object.keys(S.students).find((sid) => nameOf(sid).toLowerCase() === v.name.toLowerCase());
      if (known) { student = known; name = ''; }
    } else if (!student) errs.push('Choose a student.');
    if (!SC.isDate(v.date)) errs.push('Pick a date.');
    if (!SC.isTime(v.time)) errs.push('Pick a start time.');
    const every = Math.min(8, Math.max(1, Math.round(Number(v.repeat)) || 1));
    const repeating = F.mode !== 'move' && v.repeat !== 'none';
    if (repeating && v.until && SC.isDate(v.until) && SC.isDate(v.date) && v.until < v.date) errs.push('The last lesson can’t be before the first one.');
    if (F.mode === 'new' && repeating && !(v.days || []).length) errs.push('Pick at least one day.');
    if (F.mode === 'new' && repeating && v.until && SC.isDate(v.until) && SC.isDate(v.date) && v.until >= v.date) {
      const late = (v.days || []).filter((wd) => SC.addDays(v.date, (wd - SC.weekday(v.date) + 7) % 7) > v.until);
      if (late.length) errs.push(`There’s no ${late.map((wd) => DOW_LONG[wd]).join(' or ')} between the first and the last lesson date.`);
    }
    if (F.mode === 'series' && SC.isDate(v.date) && v.date < todayTz()) errs.push('The new schedule has to start today or later.');
    if (F.mode === 'edit' && repeating && S.sched[F.o.docId] && S.sched[F.o.docId].status) errs.push('This lesson is already marked. Add a new weekly lesson with “+ Lesson” instead.');
    if (errs.length) return { errs };
    const common = { student, ...(name ? { name } : {}), time: v.time, durationMin: v.len, tz: v.tz || myTz(), ...(v.note ? { note: v.note } : {}) };
    const series = (start) => ({ kind: 'series', ...common, start, every, until: v.until || null, ex: {} });
    const one = (extra) => ({ kind: 'one', ...common, date: v.date, ...extra });
    const firstOn = (wd) => SC.addDays(v.date, (wd - SC.weekday(v.date) + 7) % 7);
    let changes = [], keys = null;
    if (F.mode === 'new') {
      changes = repeating ? v.days.map((wd) => ({ id: newId(), data: series(firstOn(wd)) })) : [{ id: newId(), data: one({}) }];
    } else if (F.mode === 'edit') {
      const doc = S.sched[F.o.docId];
      const keep = { ...(doc.status ? { status: doc.status } : {}), ...(doc.billed ? { billed: doc.billed } : {}) };
      changes = repeating ? [{ id: F.o.docId, data: null }, { id: newId(), data: series(v.date) }] : [{ id: F.o.docId, data: one(keep) }];
    } else if (F.mode === 'move') {
      const d = strip(S.sched[F.o.docId]);
      d.ex = isObj(d.ex) ? d.ex : {};
      const e = isObj(d.ex[F.o.origDate]) ? { ...d.ex[F.o.origDate] } : {};
      delete e.date; delete e.time; delete e.durationMin; delete e.note;
      // ex times are wall-clock in the series' own zone: convert when she typed the time in another zone
      const w = v.tz && !sameTz(v.tz, d.tz) ? at(SC.toInstant(v.date, v.time, v.tz), d.tz) : { date: v.date, time: v.time };
      if (w.date !== F.o.origDate || w.time !== d.time || v.len !== d.durationMin) Object.assign(e, { date: w.date, time: w.time, durationMin: v.len });
      if (v.note) e.note = v.note;
      if (Object.keys(e).length) d.ex[F.o.origDate] = e; else delete d.ex[F.o.origDate];
      changes = [{ id: F.o.docId, data: d }];
      keys = [F.o.key];
    } else {   // series: this and following
      const doc = strip(S.sched[F.o.docId]);
      const at0 = F.o.origDate;
      const split = SC.splitSeries(doc, at0, null);
      const next = { ...split.next, kind: 'series', student: doc.student, time: v.time, durationMin: v.len, tz: v.tz || doc.tz, every, until: v.until || null, start: v.date };
      if (v.note) next.note = v.note; else delete next.note;
      if (doc.name) next.name = doc.name;
      // a new day or rhythm makes old per-date changes meaningless
      if (v.date !== at0 || every !== (doc.every || 1)) {
        if (Object.values(isObj(next.ex) ? next.ex : {}).some((e) => isObj(e) && e.status === 'done')) errs.push('A later lesson of this series is already marked done. Change the series from a lesson after it.');
        next.ex = {};
      } else next.ex = isObj(next.ex) ? next.ex : {};
      if (next.until) Object.keys(next.ex).forEach((k) => { if (k > next.until) delete next.ex[k]; });   // like "Stop repeating": changes after the last lesson go too
      delete next.id;
      changes = split.old ? [{ id: F.o.docId, data: split.old }, { id: newId(), data: next }] : [{ id: F.o.docId, data: next }];
      if (split.old) keys = null;
    }
    changes.forEach(({ data }) => { if (data) SC.validate(data).forEach((x) => errs.push(x)); });
    return { errs: [...new Set(errs)], changes, keys };
  }
  function overlapsAfter(changes, keys, from) {
    const ids = new Set(changes.map((c) => c.id));
    const after = { ...S.sched };
    changes.forEach(({ id, data }) => { if (data) after[id] = { ...data, id }; else delete after[id]; });
    const to = SC.addDays(from, 7 * 9);
    const occs = SC.expand(Object.values(after), SC.addDays(from, -1), to, myTz());
    const map = SC.overlaps(occs);
    const byKey = new Map(occs.map((o) => [o.key, o]));
    const mine = occs.filter((o) => o.status !== 'cancelled' && ids.has(o.docId) && (!keys || keys.includes(o.key)) && o.end > Date.now());
    const out = [];
    mine.forEach((o) => (map.get(o.key) || []).forEach((k) => {
      const c = byKey.get(k);
      if (!c) return;
      const a = at(c.start);
      out.push(`${nameOf(c.student, after[c.docId])}, ${dayShort(a.date)} ${range(c)}`);
    }));
    return [...new Set(out)];
  }
  function submitForm() {
    const F = UI.sheet;
    const v = readForm();
    F.v = v;
    const { errs, changes, keys } = buildChanges(F, v);
    if (errs.length) { F.errors = errs; F.warn = []; F.confirmed = false; paintSheet(); return; }
    F.errors = [];
    const sig = JSON.stringify(changes.map((c) => c.data));
    if (!(F.confirmed && F.sig === sig)) {
      const warn = overlapsAfter(changes, keys, v.date < todayTz() ? todayTz() : v.date);
      if (warn.length) { F.warn = warn.slice(0, 4); F.confirmed = true; F.sig = sig; paintSheet(); return; }
    }
    const who = nameOf(changes.find((c) => c.data) ? changes.find((c) => c.data).data.student : '', changes.find((c) => c.data) && changes.find((c) => c.data).data);
    if (F.mode === 'new' && v.student !== '__new') UI.lastStudent = v.student;
    const msg = F.mode === 'new' ? `Added ${who}${changes.length > 1 ? ` · ${changes.length} weekly slots` : v.repeat !== 'none' ? ' · every ' + (v.repeat === '2' ? '2 weeks' : 'week') : ''}`
      : F.mode === 'move' ? `Moved ${who}’s lesson to ${dayShort(v.date)}` : 'Saved';
    closeSheet();
    commit(changes, msg);
    if (F.mode !== 'series') {   // show the week the lesson landed in
      const w = Math.round(SC.daysBetween(SC.weekStart(todayTz()), SC.weekStart(v.date)) / 7);
      if (route().name === 'schedule' && w !== UI.week) { UI.week = w; render(); }
    }
  }
  function saveTz() {
    const next = clone(setg());
    next.tz = sheet.querySelector('#tz-me').value;
    next.hour12 = sheet.querySelector('#tz-12').value === '12';
    next.studentTz = {};
    sheet.querySelectorAll('select[data-sid]').forEach((s) => { if (s.value) next.studentTz[s.dataset.sid] = s.value; });
    S.schedSettings = next;
    closeSheet();
    render();
    writeOne('settings', next);
    toast('Time zones saved');
  }

  async function copyTime(o) {
    const stz = stuTz(o.student) || myTz();
    const a = at(o.start, stz);
    const text = `${dayLong(a.date)}, ${range(o, stz)}${stuTz(o.student) ? ' (your time)' : ''}`;
    const out = sheet.querySelector('#copy-out');
    try { await navigator.clipboard.writeText(text); toast('Copied: ' + text); }
    catch (e) { if (out) { out.value = text; out.parentElement.hidden = false; out.focus(); out.select(); } }
  }

  sheet.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    const wd = e.target.closest('.wday');
    if (wd) { wd.setAttribute('aria-pressed', String(wd.getAttribute('aria-pressed') !== 'true')); return; }
    const act = e.target.closest('[data-act]');
    if (!act || !UI.sheet || UI.sheet.type !== 'info') return;
    const o = findOcc(UI.sheet.key, UI.sheet.near);
    if (!o) return;
    const k = act.dataset.act;
    if (k === 'done' || k === 'cancelled' || k === 'planned') { if (tapLocked()) return; setStatus(o, k); return; }
    if (k === 'move' || k === 'series' || k === 'edit') { openSheet(formFor(k, o)); return; }
    if (k === 'copy') { copyTime(o); return; }
    if (k === 'remove') {
      if (!act.dataset.armed) {   // two taps: the page can't show confirm()
        act.dataset.armed = '1'; act.dataset.label = act.textContent; act.textContent = 'Tap again to confirm';
        setTimeout(() => { if (act.isConnected) { delete act.dataset.armed; act.textContent = act.dataset.label; } }, 4000);
        return;
      }
      closeSheet(); removeFromHere(o);
    }
  });
  sheet.addEventListener('change', (e) => {
    if (!UI.sheet || UI.sheet.type !== 'form') return;
    const F = UI.sheet;
    if (e.target.id === 'f-date' && F.mode === 'new' && SC.isDate(e.target.value)) {   // keep the day chips in step with a single chosen day
      const pressed = [...sheet.querySelectorAll('.wday[aria-pressed="true"]')];
      if (pressed.length <= 1) sheet.querySelectorAll('.wday').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.wday) === SC.weekday(e.target.value))));
    }
    if (e.target.id === 'f-student' && sheet.querySelector('#f-tz') === null && stuTz(e.target.value)) { F.v = readForm(); paintSheet(); return; }
    if (F.warn.length) { F.warn = []; F.confirmed = false; const b = sheet.querySelector('button[type="submit"]'); if (b) b.textContent = 'Save'; sheet.querySelector('.box.warn')?.remove(); }
    syncForm();
  });
  sheet.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'tzform') saveTz(); else if (UI.sheet && UI.sheet.type === 'form') submitForm();
  });

  // ---------- render ----------
  function route() {
    const h = location.hash.replace(/^#/, '');
    if (h.startsWith('s-')) return { name: 'student', id: h.slice(2) };
    if (h === 'teaching') return { name: 'teaching' };
    if (h === 'schedule') return { name: 'schedule' };
    if (h === 'course' || h === 'course-teach') return { name: 'course', sub: h === 'course-teach' ? 'teach' : '' };
    return { name: 'home' };
  }

  function render() {
    const r = route();
    const navOn = r.name === 'teaching' ? 'nav-teaching' : r.name === 'course' ? 'nav-course' : r.name === 'schedule' ? 'nav-schedule' : 'nav-students';
    ['nav-students', 'nav-schedule', 'nav-course', 'nav-teaching'].forEach((id) => {
      const a = document.getElementById(id);
      if (id === navOn) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    if (S.status === 'nodb') {
      main.innerHTML = `<div class="empty"><h1>Open this in Claude</h1><p class="lede">Reports load only on claude.ai or in the Claude app.</p></div>`;
      return;
    }
    if (S.status === 'loading') {
      main.innerHTML = `<div class="empty"><h1>Loading…</h1></div>`;
      return;
    }
    if (S.status === 'slow' && !Object.keys(S.students).length) {
      main.innerHTML = `<div class="empty"><h1>Can’t reach the reports</h1><p class="lede">They’ll appear when the connection is back.</p></div>`;
      return;
    }
    main.innerHTML = r.name === 'student' ? viewStudent(r.id) : r.name === 'teaching' ? viewTeaching()
      : r.name === 'course' ? viewCourse(r.sub) : r.name === 'schedule' ? viewSchedule() : viewHome();
    refreshSheet();
    renderSave();
  }

  // ---------- events ----------
  main.addEventListener('click', async (e) => {
    const wk = e.target.closest('[data-week]');
    if (wk) { const n = Number(wk.dataset.week); UI.week = n === 0 ? 0 : UI.week + n; render(); return; }
    const add = e.target.closest('[data-add]');
    if (add && SC) { openSheet(formFor('new', null, add.dataset.add)); return; }
    const op = e.target.closest('[data-open]');
    if (op && SC) { openSheet({ type: 'info', key: op.dataset.open, near: op.dataset.near }); return; }
    const sst = e.target.closest('[data-status]');
    if (sst && SC) { if (tapLocked()) return; const o = findOcc(sst.dataset.key, sst.dataset.near); if (o) setStatus(o, sst.dataset.status); return; }
    if (e.target.closest('[data-tzopen]') && SC) { openSheet({ type: 'tz' }); return; }
    const tabBtn = e.target.closest('.tab');
    if (tabBtn) {
      UI.tab[tabBtn.dataset.lid] = tabBtn.dataset.tab;
      const det = tabBtn.closest('details');
      const l = S.lessons[tabBtn.dataset.lid];
      det.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b === tabBtn)));
      det.querySelector('.tabpanel').innerHTML = panel(l, tabBtn.dataset.tab);
      return;
    }
    const bill = e.target.closest('[data-bill]');
    if (bill) {
      const n = Number(bill.dataset.n);
      writeBill(bill.dataset.bill, (b) => { b.log.push({ date: todayISO(), kind: bill.dataset.kind, n }); });
      toast(bill.dataset.kind === 'paid' ? `Payment logged (+${n})` : 'Lesson logged (−1)');
      return;
    }
    const uv = e.target.closest('[data-uview]');
    if (uv) { UI.uview[uv.dataset.uview] = Number(uv.dataset.n); render(); return; }
    const ua = e.target.closest('[data-uadv]');
    if (ua) {
      const sid = ua.dataset.uadv, p = progOf(sid), was = p.current;
      const n = nextUnit({ ...p, done: [...arr(p.done), was] });
      moveTo(sid, n, true);
      toast(isReview(was) ? `Unit ${was} done. Review week next (units ${was - 3}–${was}), then unit ${n}.`
        : n ? `Unit ${was} done. Now unit ${n}.` : 'Course finished!');
      return;
    }
    const us = e.target.closest('[data-ustart]');
    if (us) { const n = Number(us.dataset.n); moveTo(us.dataset.ustart, n, false); toast(`Now on unit ${n}`); return; }
    const uu = e.target.closest('[data-uundo]');
    if (uu) { const p = progOf(uu.dataset.uundo); if (p.prev) { saveProgress(uu.dataset.uundo, p.prev); toast('Undone'); } return; }
    const rv = e.target.closest('[data-review]');
    if (rv) { patchState('bank-' + rv.dataset.review, ['reviewed', rv.dataset.id], true); return; }
    const undo = e.target.closest('[data-undo]');
    if (undo) { writeBill(undo.dataset.undo, (b) => { b.log.pop(); }); toast('Last entry removed'); return; }
    const save = e.target.closest('[data-save]');
    if (save && dl) {
      save.disabled = true;
      try {
        const res = await fetch('/_blob/' + save.dataset.save);
        if (!res.ok) throw new Error('missing');
        await dl.save({ filename: save.dataset.name, data: await res.blob() });
      } catch (err) {
        if (!(err && err.code === 'declined')) toast('Couldn’t save the image. Try again in a moment.');
      } finally { save.disabled = false; }
    }
  });
  main.addEventListener('change', (e) => {
    const cb = e.target.closest('input[type="checkbox"][data-lid]');
    if (cb) patchState(cb.dataset.lid, [cb.dataset.key, cb.dataset.id], cb.checked);
  });
  main.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!(d instanceof HTMLDetailsElement)) return;
    const key = d.dataset.lid || d.dataset.uid;
    if (!key) return;
    if (d.dataset.lid) UI.touched = true;
    if (d.open) UI.open.add(key); else UI.open.delete(key);
  }, true);
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  // ---------- data ----------
  function ready() {
    if (S.status !== 'ready' && NEED.every((n) => S.got.has(n))) { S.status = 'ready'; clearTimeout(slowTimer); }
  }
  let slowTimer = null;
  async function start() {
    render();
    const claude = window.claude;
    db = claude && claude.use ? await claude.use('db') : null;
    if (!db) { S.status = 'nodb'; render(); return; }
    claude.use('downloads').then((d) => { dl = d; if (S.status === 'ready') render(); }).catch(() => {});
    slowTimer = setTimeout(() => { if (S.status === 'loading') { S.status = 'slow'; render(); } }, 10000);
    const sub = (name, onDocs) => db.collection(name).onSnapshot((snap) => {
      onDocs(snap.docs.filter((d) => d.exists));
      if (!snap.metadata.fromCache) S.got.add(name);
      if (S.status === 'slow') S.status = 'loading';
      ready(); render();
    }, () => { S.got.add(name); ready(); render(); });
    sub('students', (docs) => { S.students = {}; docs.forEach((d) => { S.students[d.id] = { ...d.data(), id: d.id }; }); });
    sub('lessons', (docs) => { S.lessons = {}; docs.forEach((d) => { S.lessons[d.id] = { ...d.data(), id: d.id }; }); });
    sub('state', (docs) => { S.states = {}; docs.forEach((d) => { S.states[d.id] = d.data() || {}; }); });
    sub('materials', (docs) => { S.materials = {}; docs.forEach((d) => { S.materials[d.id] = d.data() || {}; }); });
    sub('bank', (docs) => { S.bank = {}; docs.forEach((d) => { S.bank[d.id] = d.data() || {}; }); });
    sub('billing', (docs) => { S.billing = {}; docs.forEach((d) => { S.billing[d.id] = d.data() || {}; }); Object.assign(S.billing, BQ.local); });
    sub('teacher', (docs) => { const p = docs.find((d) => d.id === 'profile'); S.teacher = p ? p.data() : null; });
    sub('course', (docs) => { const p = docs.find((d) => d.id === 'plan'); S.course = p ? p.data() : null; });
    sub('progress', (docs) => { S.progress = {}; docs.forEach((d) => { S.progress[d.id] = d.data() || {}; }); });
    sub('schedule', (docs) => {
      S.sched = {}; S.schedSettings = null;
      docs.forEach((d) => { if (d.id === 'settings') S.schedSettings = d.data() || {}; else S.sched[d.id] = { ...d.data(), id: d.id }; });
      overlaySched();
    });
  }
  start();
})();
</script>
