<title>Lesson Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a teacher's notebook. One column of sections, summary first (next lesson), detail below (lesson reports). */
:root{
  --paper:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --ink:#141E36; --muted:#5A6479; --line:#DCE2EE;
  --accent:#2742C4; --accent-soft:#E5EAFC;
  --hl:#FFE14D; --hl-text:#141E36;
  --red:#B3302A; --red-soft:#FBE8E6; --green:#11764A; --green-soft:#E1F3E9; --amber:#8F5600; --amber-soft:#FCEFD6;
  --c0:#2742C4; --c1:#C2410C; --c2:#0F766E; --c3:#9D174D; --c4:#4D7C0F; --c5:#7C3AED; --c6:#B45309; --c7:#0369A1;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1320; --surface:#161D2E; --sunk:#1D2539; --ink:#E7EBF5; --muted:#9CA5BB; --line:#2A3449;
    --accent:#93A6FF; --accent-soft:#222C4F; --hl:#4A4214; --hl-text:#FFE98A;
    --red:#FF8B80; --red-soft:#3A1F1E; --green:#63D6A0; --green-soft:#15302A; --amber:#F3B860; --amber-soft:#372A10;
    --c0:#93A6FF; --c1:#FB923C; --c2:#2DD4BF; --c3:#F472B6; --c4:#A3E635; --c5:#C4B5FD; --c6:#FBBF24; --c7:#7DD3FC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1320; --surface:#161D2E; --sunk:#1D2539; --ink:#E7EBF5; --muted:#9CA5BB; --line:#2A3449;
  --accent:#93A6FF; --accent-soft:#222C4F; --hl:#4A4214; --hl-text:#FFE98A;
  --red:#FF8B80; --red-soft:#3A1F1E; --green:#63D6A0; --green-soft:#15302A; --amber:#F3B860; --amber-soft:#372A10;
  --c0:#93A6FF; --c1:#FB923C; --c2:#2DD4BF; --c3:#F472B6; --c4:#A3E635; --c5:#C4B5FD; --c6:#FBBF24; --c7:#7DD3FC;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;margin:0;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none;color:var(--ink);margin-right:auto;letter-spacing:-.01em}
.brand span{background:linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%);color:var(--hl-text)}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:6px 12px;border-radius:99px}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px, 5vw, 38px);line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px}
.lede{color:var(--muted);max-width:62ch;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.mark{background:linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%);color:var(--hl-text);padding:0 2px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.high{background:var(--red-soft);color:var(--red)}
.chip.medium{background:var(--amber-soft);color:var(--amber)}
.chip.low{background:var(--sunk);color:var(--muted)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.recurring{background:var(--red-soft);color:var(--red)}
.chip.improving{background:var(--amber-soft);color:var(--amber)}
.chip.fixed{background:var(--green-soft);color:var(--green)}
.chip.check{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.chip.clear{background:var(--green-soft);color:var(--green)}
.ts{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* home */
.students{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr));gap:14px;margin-top:20px}
.scard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;transition:border-color .15s, transform .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-1px)}
.scard .name{font-family:var(--display);font-size:24px;font-weight:700}
.scard ul{margin:0;padding-left:18px;font-size:14.5px}
.scard .open{margin-top:auto;font-weight:600;color:var(--accent);font-size:14.5px}

/* student */
.back{display:inline-block;text-decoration:none;font-weight:600;font-size:14.5px;margin-bottom:14px}
.profile{display:grid;grid-template-columns:minmax(0, 1.4fr) minmax(0, 1fr);gap:20px;align-items:start}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.next{display:grid;grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr);gap:20px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0;padding-top:0}
.todo input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--green)}
.todo .done .said, .todo .done .better{opacity:.5}
.said{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
.better{color:var(--green);font-weight:600}
.issue{font-weight:700}
.pair{display:flex;flex-direction:column;gap:2px;min-width:0}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan li{display:grid;grid-template-columns:52px 1fr;gap:12px}
.plan .min{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 0;text-align:center;height:fit-content}
.plan b{display:block}
.plan span{color:var(--muted);font-size:14.5px}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.en{font-weight:600}

/* lessons */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lesson + .lesson{margin-top:12px}
.lesson > summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.lesson > summary::-webkit-details-marker{display:none}
.lesson > summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.lesson[open] > summary::before{transform:rotate(90deg)}
.lesson .ldate{font-family:var(--display);font-weight:700;font-size:19px}
.lesson .lmeta{color:var(--muted);font-size:14.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 10px 9px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabpanel{padding:20px}
.mlist{list-style:none;margin:0;padding:0}
.mlist > li{display:grid;grid-template-columns:24px minmax(0, 1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.mlist > li:first-child{border-top:0;padding-top:0}
.mlist input{width:18px;height:18px;margin-top:4px;accent-color:var(--green)}
.mhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.note{color:var(--muted);font-size:14.5px;margin-top:4px}
.group-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.group-h:first-child{margin-top:0}
.bullets{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cols{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:14px}
.cardimg{display:flex;flex-direction:column;gap:8px}
.cardimg img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.cardimg .t{font-size:13.5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.check{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.check input{accent-color:var(--green)}
.callout{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:14.5px;color:var(--muted)}

.bill{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip.big{font-size:14.5px;padding:5px 12px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.blog{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.blog li{display:flex;gap:12px}
.mats{list-style:none;margin:8px 0 0;padding:0}
.mats li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mats li:first-child{border-top:0}
.mats input{margin-top:4px;accent-color:var(--green)}
.mats .done a{color:var(--muted)}
.rchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.rchip:hover{border-color:var(--green);color:var(--green)}
.theme{margin-top:12px}
.theme p{margin:2px 0 0;font-size:14.5px;line-height:1.6}
.wdone{color:var(--muted);text-decoration:line-through}
.bank > summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px;margin-top:12px}
.bank table{margin-top:8px}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scard-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.when{font-weight:600;color:var(--accent);font-size:14.5px}
.cnt{font-size:12.5px;font-weight:600;color:var(--muted)}
.tab .cnt{font-weight:500}
h2.sec{margin-bottom:12px}
.flist{list-style:none;margin:0;padding:0}
.flist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0;padding-top:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:4px}
.meta .note{margin:0}
.sum{margin:0 0 12px;max-width:70ch}
.mlist.plain > li{grid-template-columns:minmax(0,1fr)}
.mlist .done .said,.mlist .done .better{opacity:.5}
.tcell{width:1%;white-space:nowrap;text-align:right}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width: 760px){ .cols3{grid-template-columns:minmax(0,1fr)} }
.empty{text-align:left;max-width:560px;padding:32px 0}
/* course */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:99px;padding:3px;gap:2px;margin-top:16px}
.seg a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;padding:6px 14px;border-radius:99px}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.ulist{list-style:none;margin:0;padding:0}
.ulist > li{border-top:1px solid var(--line)}
.ulist > li:first-child{border-top:0}
.unit > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;align-items:start}
.unit > summary::-webkit-details-marker{display:none}
.unum{font-family:var(--mono);font-size:13px;background:var(--sunk);color:var(--muted);border-radius:8px;height:28px;display:flex;align-items:center;justify-content:center}
.unit[open] .unum{background:var(--accent-soft);color:var(--accent)}
.ut{font-weight:600}
.ucando{color:var(--muted);font-size:14.5px}
.unit .chips{margin-top:6px}
.ubody{padding:0 0 16px 46px}
.ufacts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;margin:0}
.ufacts dt{color:var(--muted)} .ufacts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ufix{color:var(--amber)}
.urev{padding:10px 0 10px 46px;color:var(--muted);font-size:14px;font-weight:600}
.unow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ubig{font-family:var(--display);font-weight:700;font-size:28px;width:54px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.unow b{display:block;font-size:17px;line-height:1.3}
.ustrip{display:flex;flex-wrap:wrap;gap:8px 12px;margin:16px 0 6px}
.ugrp{display:flex;gap:3px}
.ub{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12.5px;cursor:pointer;color:var(--muted);padding:0}
.ub.done{background:var(--green-soft);border-color:transparent;color:var(--green)}
.ub.cur{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.ub[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.uview{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.uview .ut{margin-bottom:8px}
.uactions{margin-top:14px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;height:26px;display:flex;align-items:center;justify-content:center}
.steps b{display:block} .steps span{color:var(--muted);font-size:14.5px}
.why > summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px}
.why > summary::-webkit-details-marker{display:none}
.why > summary::after{content:"Show";color:var(--accent);font-weight:600;font-size:14.5px}
.why[open] > summary::after{content:"Hide"}
.why[open] > summary{margin-bottom:14px}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:10px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0;padding-top:0}
.plist b{display:block}
@media (max-width: 760px){ .ubody, .urev{padding-left:0} }
.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:20;max-width:calc(100% - 32px)}

.toast{display:flex;align-items:center;gap:14px}
.toast-btn{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 4px}

/* schedule: a week of day columns (stacked rows on phones); a lesson opens a sheet */
.sched-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 16px;flex-wrap:wrap}
.wknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{color:var(--surface);filter:brightness(1.1)}
.btn.lg{padding:9px 14px;font-size:14.5px}
.btn.sq{width:38px;padding-inline:0}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.danger[data-armed]{background:var(--red);border-color:var(--red);color:var(--surface)}
.savestate{font-size:13px;color:var(--muted);min-height:20px;margin-left:6px}
.savestate.err{color:var(--red);font-weight:600}
.tzbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:18px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:168px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:0 6px;flex-wrap:wrap}
.dh b{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.dh span{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.day.today .dh b,.day.today .dh span{color:var(--accent)}
.day.past .dh b{color:var(--muted)}
.dbody{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.occ{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:var(--sunk);border:1px solid transparent;
  border-radius:9px;padding:7px 8px;cursor:pointer;min-width:0}
.occ:hover{border-color:var(--accent)}
.occ .ot{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.occ .on{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.occ .on > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ .om{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.occ.done{background:var(--green-soft)} .occ.done .om{color:var(--green);font-weight:600}
.occ.cancelled{background:transparent;border:1px dashed var(--line)}
.occ.cancelled .on{text-decoration:line-through;color:var(--muted)}
.occ.due{background:var(--amber-soft)} .occ.due .om{color:var(--amber);font-weight:600}
.occ.clash{border-color:var(--red)} .occ .clash-t{color:var(--red);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c0)}
.dot.c1{background:var(--c1)} .dot.c2{background:var(--c2)} .dot.c3{background:var(--c3)} .dot.c4{background:var(--c4)}
.dot.c5{background:var(--c5)} .dot.c6{background:var(--c6)} .dot.c7{background:var(--c7)}
.dadd{margin-top:auto;align-self:flex-start;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:2px 0;text-align:left}

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#students"><span>Lesson</span> Notebook</a>
    <nav class="nav" aria-label="Sections">
      <a href="#students" id="nav-students">Students</a>
      <a href="#schedule" id="nav-schedule">Schedule</a>
      <a href="#course" id="nav-course">Course</a>
      <a href="#teaching" id="nav-teaching">My teaching</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty">
    <h1>Loading…</h1>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="schedule-core.js"></script>
<script>
(() => {
  const S = { students: {}, lessons: {}, states: {}, billing: {}, bank: {}, materials: {}, progress: {}, sched: {}, schedSettings: null, course: null, teacher: null, got: new Set(), status: 'loading' };
  const UI = { open: new Set(), tab: {}, uview: {}, week: 0, sheet: null };
  const NEED = ['students', 'lessons', 'state', 'teacher', 'billing', 'bank', 'materials', 'course', 'progress', 'schedule'];
  let db = null, dl = null;
  const main = document.getElementById('main');

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const arr = (x) => (Array.isArray(x) ? x : []);
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const parseD = (iso) => { const [y, m, d] = String(iso || '').split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
  const fmtDate = (iso, long) => {
    const d = parseD(iso);
    return long ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
                : `${MON[d.getMonth()]} ${d.getDate()}`;
  };
  const prioRank = { high: 0, medium: 1, low: 2 };

  // toast(msg) or toast(msg, {label: 'Undo', fn}) for an action button
  function toast(msg, action) {
    const t = document.getElementById('toast');
    // an open modal sheet makes the rest of the page inert (and covers the toast on phones): show it inside the sheet
    const host = document.querySelector('dialog[open]') || document.body;
    if (t.parentNode !== host) host.append(t);
    t.replaceChildren(document.createTextNode(msg));
    if (action) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-btn'; b.textContent = action.label;
      b.addEventListener('click', () => { t.hidden = true; action.fn(); });
      t.append(b);
    }
    t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, action ? 7000 : 3200);
  }

  const lessonsOf = (sid) => Object.values(S.lessons).filter((l) => l.student === sid).sort((a, b) => (a.date < b.date ? 1 : -1));
  const stateOf = (lid) => S.states[lid] || {};

  // ---------- writes (teacher's own ticks) ----------
  let chain = Promise.resolve();
  function patchState(lid, path, value) {
    const next = JSON.parse(JSON.stringify(stateOf(lid)));
    next[path[0]] = next[path[0]] || {};
    if (value) next[path[0]][path[1]] = true; else delete next[path[0]][path[1]];
    S.states[lid] = next;
    render();
    if (!db) return;
    chain = chain.then(() => db.collection('state').doc(lid).set(next)).catch((e) => {
      toast(e && e.code === 'invalid_argument' ? 'You can view this notebook but not change it.' : 'Couldn’t save that tick. Try again in a moment.');
    });
  }

  // ---------- views ----------
  const list = (xs) => `<ul class="bullets">${arr(xs).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const fix = (said, better) => `<span class="said">${esc(said)}</span><span class="better">${esc(better)}</span>`;
  const tick = (lid, key, id, done) => `<input type="checkbox" id="${key}-${esc(lid)}-${esc(id)}" data-lid="${esc(lid)}" data-key="${key}" data-id="${esc(id)}" ${done ? 'checked' : ''} aria-label="${key === 'sent' ? 'Sent' : 'Discussed'}">`;
  const ts = (xs) => arr(xs).map((t) => `<span class="ts">${esc(t)}</span>`).join('');

  // ---------- lessons & payments (balance in lessons: + paid, − taught) ----------
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function billStatus(sid) {
    const b = S.billing[sid];
    if (!b) return null;
    const log = arr(b.log);
    const bal = log.reduce((a, e) => a + (Number(e && e.n) || 0), 0);
    if (b.autopay) return { text: 'Pays every lesson', cls: 'fixed', bal };   // never owes: no unpaid count
    if (!log.length) return { text: 'No payments logged', cls: '', bal };
    if (bal > 0) return { text: `${bal} lesson${bal === 1 ? '' : 's'} left`, cls: 'fixed', bal };
    if (bal < 0) return { text: `${-bal} unpaid`, cls: 'recurring', bal };
    return { text: b.perPayment > 1 ? 'Package used up' : 'Paid up', cls: b.perPayment > 1 ? 'recurring' : '', bal };
  }
  function billPanel(sid) {
    const b = S.billing[sid];
    if (!b) return '';
    const st = billStatus(sid);
    const log = arr(b.log);
    const per = Number(b.perPayment) || 0;
    return `<section class="panel"><div class="panel-h"><h2>Lessons & payments</h2><span class="muted small">${esc(b.plan || '')}</span></div>
      <div class="bill"><span class="chip big ${st.cls}">${esc(st.text)}</span>
        ${per > 0 ? `<button class="btn" type="button" data-bill="${esc(sid)}" data-kind="paid" data-n="${per}">+ Paid (${per})</button>` : ''}
        <button class="btn" type="button" data-bill="${esc(sid)}" data-kind="lesson" data-n="-1">− Lesson</button>
        ${log.length ? `<button class="btn ghost" type="button" data-undo="${esc(sid)}">Undo last</button>` : ''}</div>
      ${coverText(sid, st.bal)}
      ${log.length ? `<ul class="blog">${log.slice(-5).reverse().map((e) => `<li><span class="muted">${esc(fmtDate(e.date))}</span><span>${e.kind === 'paid' ? `Paid +${esc(e.n)}` : 'Lesson −1'}</span></li>`).join('')}</ul>` : ''}</section>`;
  }
  // how far a positive balance reaches into the schedule
  function coverText(sid, bal) {
    if (!SC || !(bal > 0)) return '';
    const t = todayTz(), now = Date.now();
    const up = occsIn(t, SC.addDays(t, 180)).filter((o) => o.student === sid && o.status === 'planned' && o.start > now);
    if (!up.length) return '';
    const k = Math.ceil(bal);
    return `<p class="note" style="margin:10px 0 0">${up.length >= k ? `Paid lessons last until ${esc(dayShort(at(up[k - 1].start).date))}.`
      : `Covers all ${up.length} scheduled lesson${up.length === 1 ? '' : 's'} in the next 6 months.`}</p>`;
  }
  // one write chain per student; while writes are queued, their newest copy is laid over incoming snapshots
  // (a snapshot taken before a queued write lands must not roll the page back and lose the next change)
  const BQ = { chains: {}, local: {}, n: {} };
  function writeBill(sid, mutate) {
    const next = JSON.parse(JSON.stringify(S.billing[sid] || { log: [] }));
    next.log = arr(next.log).filter((e) => e && typeof e === 'object');
    mutate(next);
    S.billing[sid] = next;
    render();
    if (!db) return;
    BQ.local[sid] = next; BQ.n[sid] = (BQ.n[sid] || 0) + 1;
    const go = () => db.collection('billing').doc(sid).set(next);
    BQ.chains[sid] = (BQ.chains[sid] || Promise.resolve())
      .then(() => go().catch((e) => {
        if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 500 + Math.random() * 1000)).then(go);
        throw e;
      }))
      .catch((e) => toast(e && e.code === 'invalid_argument' ? 'You can view this notebook but not change it.' : 'Couldn’t save that. Try again in a moment.'))
      .finally(() => { if (!--BQ.n[sid]) { delete BQ.n[sid]; delete BQ.local[sid]; } });
  }

  // ---------- word bank: imported list (bank/<sid>) + every lesson's words ----------
  const THEMES = { work: 'Work', money: 'Money & finance', numbers: 'Numbers & spreadsheets', law: 'Law', people: 'People',
    less: '-less words', everyday: 'Everyday', phrases: 'Phrases', city: 'City & places', weather: 'Weather', food: 'Food',
    home: 'Home', event: 'The event', grammar: 'Grammar', sounds: 'Sounds', health: 'Health', lesson: 'From lessons' };
  function wordBank(sid) {
    const seen = new Map();
    arr((S.bank[sid] || {}).words).slice().sort((a, b) => (b.n || 0) - (a.n || 0)).forEach((w) => {
      const k = String(w.en || '').toLowerCase();
      if (k && !seen.has(k)) seen.set(k, { en: w.en, theme: w.theme || 'everyday', sent: w.sent || 1, old: true });
    });
    lessonsOf(sid).slice().reverse().forEach((l) => arr(l.words).forEach((w) => {
      const k = String(w.en || '').toLowerCase();
      if (!k) return;
      if (seen.has(k)) Object.assign(seen.get(k), { ua: w.ua, date: l.date, again: true });
      else seen.set(k, { en: w.en, ua: w.ua, date: l.date, theme: 'lesson' });
    }));
    return [...seen.values()];
  }
  function bankPanel(sid) {
    const all = wordBank(sid);
    if (!all.length) return '';
    const done = (stateOf('bank-' + sid).reviewed) || {};
    const isDone = (w) => !!done[String(w.en).toLowerCase()];
    const latest = lessonsOf(sid)[0];
    const review = all.filter((w) => !isDone(w) && (!latest || w.date !== latest.date)).slice(0, 8);
    const nDone = all.filter(isDone).length;
    const groups = {};
    all.forEach((w) => { (groups[w.theme] = groups[w.theme] || []).push(w); });
    const order = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
    return `<section class="panel"><div class="panel-h"><h2>Word bank</h2><span class="muted small">${all.length} words · ${nDone} reviewed</span></div>
      ${review.length ? `<div class="group-h">Review next · tap when done</div><div class="chips">${review.map((w) => `
        <button class="rchip" type="button" data-review="${esc(sid)}" data-id="${esc(String(w.en).toLowerCase())}">${esc(w.en)}${w.sent > 1 ? ` <span class="cnt">×${esc(w.sent)}</span>` : ''}</button>`).join('')}</div>` : ''}
      <details class="bank"><summary>All words by theme</summary>${order.map((t) => `
        <div class="theme"><b>${esc(THEMES[t] || t)}</b> <span class="cnt">${groups[t].length}</span>
        <p>${groups[t].map((w) => `<span class="${isDone(w) ? 'wdone' : ''}">${esc(w.en)}</span>`).join(' · ')}</p></div>`).join('')}</details></section>`;
  }

  // ---------- materials sent to the student (newest first) ----------
  function matPanel(sid) {
    const items = arr((S.materials[sid] || {}).items);
    if (!items.length) return '';
    const done = (stateOf('mat-' + sid).reviewed) || {};
    const nDone = items.filter((m) => done[m.n]).length;
    return `<section class="panel"><div class="panel-h"><h2>Materials</h2><span class="muted small">${items.length} sent · ${nDone} reviewed again</span></div>
      <details class="bank"><summary>All materials</summary><ul class="mats">${items.map((m) => `
        <li class="${done[m.n] ? 'done' : ''}"><input type="checkbox" id="mat-${esc(sid)}-${esc(m.n)}" data-lid="mat-${esc(sid)}" data-key="reviewed" data-id="${esc(m.n)}" ${done[m.n] ? 'checked' : ''} aria-label="Reviewed again">
          <div><div><span class="muted small">${esc(m.date || '—')}</span> <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></div>
          ${m.issue ? `<div class="note">${esc(m.issue)}</div>` : ''}</div></li>`).join('')}</ul></details></section>`;
  }

  // ---------- course: one unit order for everyone (course/plan), each student's place in it (progress/<sid>) ----------
  const units = () => arr((S.course || {}).units);
  const unitOf = (n) => units().find((u) => u.n === n);
  const isReview = (n) => arr((S.course || {}).reviewAfter).includes(n);
  const progOf = (sid) => S.progress[sid] || { current: 0, done: [] };
  const daysSince = (iso) => Math.round((parseD(todayISO()) - parseD(iso)) / 864e5);
  const link = (m) => (m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title));

  function unitFacts(u) {
    const mats = arr(u.materials);
    const rows = [
      ['Can do', esc(u.cando)],
      ['Words', esc(u.words)],
      ['Sound', esc(u.sound)],
      ['Pages', mats.length ? mats.map(link).join(' · ') : '<span class="muted">None yet</span>'],
      u.fix ? ['Fix pages', `<span class="ufix">${esc(u.fix)}</span>`] : null,
      u.extra ? ['Extra', esc(u.extra)] : null,
    ].filter(Boolean);
    return `<dl class="ufacts">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  }
  function nextUnit(p) {
    const total = units().length;
    const done = new Set(arr(p.done));
    for (let n = (p.current || 0) + 1; n <= total; n++) if (!done.has(n)) return n;
    for (let n = 1; n <= total; n++) if (!done.has(n) && n !== p.current) return n;
    return 0;
  }
  let progChain = Promise.resolve();
  function saveProgress(sid, next) {
    S.progress[sid] = next;
    delete UI.uview[sid];
    render();
    if (!db) return;
    progChain = progChain.then(() => db.collection('progress').doc(sid).set(next)).catch(() => toast('Couldn’t save that. Try again in a moment.'));
  }
  function moveTo(sid, n, finish) {
    const { prev, ...snap } = JSON.parse(JSON.stringify(progOf(sid)));
    const done = arr(snap.done).filter((x) => x !== n);
    if (finish && snap.current && !done.includes(snap.current)) done.push(snap.current);
    const started = { ...(snap.started || {}) };
    if (n) started[n] = started[n] || todayISO();
    saveProgress(sid, { ...snap, current: n, done: done.sort((a, b) => a - b), started, prev: JSON.parse(JSON.stringify(snap)) });
  }

  function coursePanel(sid) {
    const c = S.course;
    if (!c || !units().length) return '';
    const p = progOf(sid);
    const total = units().length;
    const done = new Set(arr(p.done));
    const view = UI.uview[sid] || p.current || 1;
    const u = unitOf(view) || units()[0];
    const cur = unitOf(p.current);
    const since = cur && p.started && p.started[p.current];
    const groups = [];
    units().forEach((x, i) => { if (i % 4 === 0) groups.push([]); groups[groups.length - 1].push(x.n); });
    const strip = `<div class="ustrip" role="group" aria-label="Units">${groups.map((g) => `<div class="ugrp">${g.map((n) => `
      <button type="button" class="ub ${n === p.current ? 'cur' : done.has(n) ? 'done' : ''}" data-uview="${esc(sid)}" data-n="${n}"
        aria-pressed="${n === view}" title="${esc(unitOf(n).grammar)}">${n}</button>`).join('')}</div>`).join('')}</div>`;
    const prevN = p.current - 1;
    const rev = cur && isReview(prevN) && done.has(prevN) && p.prev && p.prev.current === prevN && since && daysSince(since) < 7
      ? `<div class="callout" style="margin-top:12px">Review week first: units ${prevN - 3}–${prevN}, no new grammar${(c.checks || {})[prevN] ? ` · ${esc(c.checks[prevN])}` : ''}.</div>` : '';
    const nxt = cur ? nextUnit({ ...p, done: [...done, p.current] }) : 0;
    const isCur = cur && view === p.current;
    return `<section class="panel"><div class="panel-h"><h2>Course</h2><a class="small" href="#course">All units</a></div>
      ${cur ? `<div class="unow"><span class="ubig">${p.current}</span><div><div class="eyebrow">Unit ${p.current} of ${total}${since ? ` · since ${esc(fmtDate(since))}` : ''}</div>
        <b>${esc(cur.grammar)}</b></div></div>` : '<p class="muted" style="margin:0">Not placed yet. Tap a unit, then start it.</p>'}
      ${rev}${strip}<div class="muted small">Green: done · Blue: now · Tap a number to see that unit</div>
      <div class="uview"><div class="group-h">${isCur ? 'This unit' : `Unit ${view}${done.has(view) ? ' · done' : ''}`}</div>
        ${isCur ? '' : `<div class="ut">${esc(u.grammar)}</div>`}${unitFacts(u)}
        <div class="bill uactions">${isCur
          ? `<button class="btn" type="button" data-uadv="${esc(sid)}">Unit ${p.current} done${nxt ? ` → ${nxt}` : ''}</button>`
          : `<button class="btn" type="button" data-ustart="${esc(sid)}" data-n="${view}">Start unit ${view}</button>`}
          ${p.prev ? `<button class="btn ghost" type="button" data-uundo="${esc(sid)}">Undo</button>` : ''}</div></div>
      ${p.pace || p.note ? `<p class="note" style="margin:14px 0 0">${esc([p.pace, p.note].filter(Boolean).join(' · '))}</p>` : ''}</section>`;
  }

  function viewCourse(sub) {
    const c = S.course;
    const teach = sub === 'teach';
    const seg = `<nav class="seg" aria-label="Course parts"><a href="#course" ${teach ? '' : 'aria-current="page"'}>Units · every student</a>
      <a href="#course-teach" ${teach ? 'aria-current="page"' : ''}>How to teach · you</a></nav>`;
    if (!c || !units().length) return `<h1>Course</h1><p class="lede">The course plan isn’t loaded yet.</p>`;
    const head = `<h1>Course</h1><p class="lede">${teach
      ? 'Only for you: how a lesson, a unit and reviews work.'
      : `${units().length} units, A2 to B1+. Same order for every student, each at their own pace. Where each one is: their page.`}</p>${seg}`;
    if (!teach) {
      const at = {};
      Object.entries(S.progress).forEach(([sid, p]) => { if (p.current && S.students[sid]) (at[p.current] = at[p.current] || []).push(S.students[sid].name); });
      const phases = arr(c.phases).length ? c.phases : [{ name: 'Units', from: 1, to: units().length }];
      return `${head}<div class="stack" style="margin-top:20px">${phases.map((ph) => `
        <section class="panel"><div class="panel-h"><h2>${esc(ph.name)}</h2><span class="muted small">Units ${ph.from}–${ph.to}${ph.sum ? ` · ${esc(ph.sum)}` : ''}</span></div>
        <ul class="ulist">${units().filter((u) => u.n >= ph.from && u.n <= ph.to).map((u) => {
          const id = 'u-' + u.n;
          const who = at[u.n] || [];
          const check = (c.checks || {})[u.n];
          return `<li><details class="unit" data-uid="${id}" ${UI.open.has(id) ? 'open' : ''}><summary><span class="unum">${u.n}</span>
            <div><div class="ut">${esc(u.grammar)}</div><div class="ucando">${esc(u.cando)}</div>
            ${who.length ? `<div class="chips">${who.map((nm) => `<span class="chip new">${esc(nm)}</span>`).join('')}</div>` : ''}</div></summary>
            <div class="ubody">${unitFacts(u)}</div></details></li>
            ${isReview(u.n) ? `<li class="urev">↻ Review week: units ${u.n - 3}–${u.n}${check ? ` · ${esc(check)}` : ''}</li>` : ''}`;
        }).join('')}</ul></section>`).join('')}</div>`;
    }
    const table = (heads, rows) => `<div class="table-wrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((x, i) => `<td${i === 0 ? ' class="en"' : ''}>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const total = arr(c.lesson).reduce((a, b) => a + (Number(b.min) || 0), 0);
    return `${head}<div class="stack" style="margin-top:20px">
      <section class="panel"><div class="panel-h"><h2>A lesson</h2>${total ? `<span class="muted small">${total} min</span>` : ''}</div>
        <ol class="plan">${arr(c.lesson).map((p) => `<li><span class="min">${esc(p.min)}′</span><div><b>${esc(p.title)}</b><span>${esc(p.detail)}</span></div></li>`).join('')}</ol></section>
      <section class="panel"><h2 class="sec">A unit in 5 steps</h2>
        <ol class="steps">${arr(c.steps).map((s) => `<li><div><b>${esc(s.title)}</b><span>${esc(s.detail)}</span></div></li>`).join('')}</ol></section>
      <section class="panel"><h2 class="sec">Pace</h2>${table(['Lessons', 'A unit', 'How'], arr(c.pace).map((r) => [r.who, r.time, r.how]))}</section>
      <section class="panel"><h2 class="sec">Review</h2>${table(['When', 'What'], arr(c.review).map((r) => [r.when, r.what]))}</section>
      <div class="cols">
        <section class="panel"><h2 class="sec">Correcting mistakes</h2>${list(c.feedback)}</section>
        <section class="panel"><h2 class="sec">Words</h2>${list(c.words)}
          ${arr(c.wordMaterials).length ? `<div class="group-h" style="margin-top:16px">Word pages you have</div><p class="small" style="margin:0">${c.wordMaterials.map(link).join(' · ')}</p>
          ${c.wordMaterialsFix ? `<p class="note ufix">${esc(c.wordMaterialsFix)}</p>` : ''}` : ''}</section>
      </div>
      <section class="panel"><h2 class="sec">Sounds to watch</h2>${table(['Sound', 'Pair', 'Who'], arr(c.sounds).map((r) => [r.sound, r.pair, r.who || '—']))}
        ${arr(c.soundLinks).length ? `<div class="group-h" style="margin-top:16px">See the mouth</div>${arr(c.soundLinks).map((l) => `<p class="small" style="margin:4px 0 0">${link(l)}${l.note ? ` <span class="muted">· ${esc(l.note)}</span>` : ''}</p>`).join('')}` : ''}</section>
      <details class="panel why" data-uid="why" ${UI.open.has('why') ? 'open' : ''}><summary><h2>Why it works</h2></summary>
        <ul class="plist">${arr(c.principles).map((p) => `<li><b>${esc(p.idea)}</b><span class="muted small">${esc(p.you)}</span>
          ${p.src ? `<div class="small">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.src)}</a>` : `<span class="muted">${esc(p.src)}</span>`}</div>` : ''}</li>`).join('')}</ul></details>
    </div>`;
  }

  function viewHome() {
    const students = Object.values(S.students).sort((a, b) => String(a.name).localeCompare(String(b.name)));

          return chips ? `<div class="chips">${chips}</div>` : '';
        })()}
        <div class="muted small">${last ? `Last: ${esc(fmtDate(last.date))}` : 'No lessons yet'}${nextTxt ? ` · Next: ${esc(nextTxt)}` : ''}</div>

  function viewStudent(sid) {
    const s = S.students[sid];
    if (!s) return `<a class="back" href="#students">← Students</a><div class="empty"><h1>Student not found</h1></div>`;

    const slots = SC ? slotsOf(sid) : [];
    const head = `<div><div class="shead"><h1>${esc(s.name)}</h1>${s.level ? `<span class="chip">${esc(s.level)}</span>` : ''}</div>
      ${s.about ? `<p class="lede">${esc(s.about)}</p>` : ''}
      ${slots.length ? `<div class="slots">${slots.map((x) => `<a class="chip new" href="#schedule">${esc(x)}</a>`).join('')}</div>` : ''}</div>`;
    const nx = nextFor(sid);
    const nextWhen = nx ? nextLabel(nx) : latest && latest.nextWhen;

    let next = '';

        ...arr(latest.pronunciation).filter((p) => p.confidence === 'clear')
          .map((p) => ({ id: p.id, html: `<span class="issue">${esc(p.issue)}</span><span class="small muted">${esc(p.tip)}</span>` })),
        ...arr(latest.mistakes).filter((m) => m.priority === 'high')
          .map((m) => ({ id: m.id, count: m.count, html: fix(m.said, m.better) })),
      ];

      next = `<section class="panel"><div class="panel-h"><h2>Next lesson</h2>${nextWhen ? `<span class="when">${esc(nextWhen)}</span>` : ''}</div>

          <div><div class="group-h">Go over</div><ul class="todo">${items.map((it) => {
            const done = st.discussed && st.discussed[it.id];
            return `<li class="${done ? 'done' : ''}">${tick(latest.id, 'discussed', it.id, done)}
              <label class="pair" for="discussed-${esc(latest.id)}-${esc(it.id)}">${it.html}${it.count > 1 ? `<span class="cnt">×${esc(it.count)}</span>` : ''}</label></li>`;

          <div><div class="group-h">Plan${total ? ` · ${total} min` : ''}</div><ol class="plan">${arr(latest.nextLesson).map((p) => `

      <li><span>${esc(f.issue)}</span>${f.status && f.status !== 'new' ? `<span class="chip ${esc(f.status)}">${esc(f.status)}</span>` : ''}</li>`).join('')}</ul></section>` : '';

    const lessons = `<section><h2 class="sec">Lessons</h2>${ls.length ? ls.map(lessonBlock).join('') : '<p class="muted">No lessons yet.</p>'}</section>`;
    return `<a class="back" href="#students">← Students</a><div class="stack">${head}${billPanel(sid)}${coursePanel(sid)}${next}${tracker}${bankPanel(sid)}${matPanel(sid)}${lessons}</div>`;
