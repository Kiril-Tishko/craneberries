<title>Say It Nicely</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Onest:wght@400;500;600&display=swap">
<style>
/* One quiet column: the situation card, the reply field, then the diplomatic answer with its phrases marked. */
:root {
  --bg: #E7ECEF;
  --card: #FFFFFF;
  --ink: #17222D;
  --muted: #5C6B78;
  --line: #D2DBE1;
  --accent: #22405C;
  --on-accent: #FFFFFF;
  --mark: #FFE27A;
  --star: #C98E00;
  --ok: #2E7A4E;
  --ins: #CDEBD8;
  --shadow: rgba(24, 44, 64, .28);
  --f-scene: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161B; --card: #1A222A; --ink: #E4EAEE; --muted: #93A1AD; --line: #2A3641;
    --accent: #9DC2E4; --on-accent: #0D1925; --mark: rgba(255, 210, 84, .34); --star: #F2C14E;
    --ok: #7FCB9C; --ins: rgba(127, 203, 156, .24); --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161B; --card: #1A222A; --ink: #E4EAEE; --muted: #93A1AD; --line: #2A3641;
  --accent: #9DC2E4; --on-accent: #0D1925; --mark: rgba(255, 210, 84, .34); --star: #F2C14E;
  --ok: #7FCB9C; --ins: rgba(127, 203, 156, .24); --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 56px;
  display: flex; flex-direction: column; gap: 16px;
}

.bar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.icon-btn {
  position: relative; width: 42px; height: 42px; border: 0; border-radius: 12px;
  background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.badge {
  position: absolute; top: 1px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--accent); color: var(--on-accent);
  font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums;
}

.view { display: flex; flex-direction: column; gap: 16px; }

.card {
  position: relative; background: var(--card); border-radius: 22px;
  padding: 30px 26px 28px;
  box-shadow: 0 1px 0 var(--line), 0 18px 40px -26px var(--shadow);
}
#situation { display: flex; flex-direction: column; gap: 12px; padding-right: 26px; }
.ctx { margin: 0; font-size: .98rem; line-height: 1.45; color: var(--muted); }
.quote {
  margin: 0; font-family: var(--f-scene); font-weight: 400;
  font-size: clamp(1.4rem, 1.15rem + 1.1vw, 1.75rem); line-height: 1.3; text-wrap: pretty;
}
.quote::before { content: "\201C"; }
.quote::after { content: "\201D"; }
.move { margin: -8px 0 0; color: var(--muted); font-size: .95rem; line-height: 1.45; }
#skip { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; }
#skip svg { width: 18px; height: 18px; }

.finish { display: flex; flex-direction: column; gap: 18px; }
.finish p { margin: 0; font-family: var(--f-scene); font-size: 1.5rem; line-height: 1.3; }
.finish .row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.finish .status { font-family: var(--f-ui); font-size: .95rem; color: var(--muted); }

.reply {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 6px 6px 6px 18px;
}
.reply:focus-within { border-color: var(--accent); }
#reply {
  flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none;
  font: inherit; font-size: 1.06rem; line-height: 1.45; color: var(--ink);
  padding: 10px 0; max-height: 40vh;
}
#reply::placeholder { color: var(--muted); opacity: .7; }
.send {
  flex: none; width: 44px; height: 44px; border: 0; border-radius: 13px;
  background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer;
}
.send svg { width: 20px; height: 20px; }

.result { display: flex; flex-direction: column; gap: 18px; padding: 6px 4px 0; }
#answer { margin: 0; font-size: 1.28rem; line-height: 1.55; text-wrap: pretty; }
mark, .mk {
  color: inherit; padding: 0 .08em; border-radius: .15em;
  background: linear-gradient(transparent 30%, var(--mark) 30%, var(--mark) 94%, transparent 94%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
  padding: 7px 13px 7px 10px; border-radius: 999px; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); font-size: .95rem; line-height: 1.3; text-align: left;
}
.chip span { min-width: 0; }
.chip svg, .star svg { width: 17px; height: 17px; flex: none; color: var(--muted); fill: none; }
.chip[aria-pressed="true"] { border-color: var(--star); }
.chip[aria-pressed="true"] svg, .star[aria-pressed="true"] svg { color: var(--star); fill: currentColor; }

.mine { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
#mineText { margin: 0; color: var(--muted); font-size: 1rem; }
#mineText::before { content: "\201C"; }
#mineText::after { content: "\201D"; }
.polish { display: flex; flex-direction: column; gap: 8px; }
.better { display: flex; gap: 10px; align-items: flex-start; margin: 0; font-size: 1.08rem; line-height: 1.5; }
.better > svg { flex: none; width: 18px; height: 18px; margin-top: .25em; color: var(--accent); }
.better.ok > svg { color: var(--ok); }
.better > span { min-width: 0; }
.ins { background: var(--ins); border-radius: .2em; padding: 0 .1em; }
.fixes { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 0 28px; padding: 0; list-style: none; font-size: .92rem; }
.fixes s { color: var(--muted); }
.tip { margin: 0 0 0 28px; color: var(--muted); font-size: .92rem; }
.dots { display: inline-flex; gap: 5px; padding: 6px 0 6px 28px; }
.alts { display: flex; flex-direction: column; gap: 18px; }
.alts:empty { display: none; }
.alts .dots { padding-left: 0; }
.alt { display: flex; flex-direction: column; gap: 12px; padding-top: 18px; border-top: 1px dashed var(--line); }
.alt-a { margin: 0; font-size: 1.18rem; line-height: 1.55; text-wrap: pretty; }
.alt .move { margin: -4px 0 0; }
.alt-btn {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 8px 15px 8px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--accent); font-size: .95rem; font-weight: 500;
}
.alt-btn svg { width: 17px; height: 17px; }
.alt-btn:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.alt-btn:disabled { opacity: .55; cursor: default; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .35; animation: pulse 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: .9; } }
.quiet-btn { align-self: flex-start; margin-left: 28px; border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: .92rem; text-decoration: underline; text-underline-offset: 3px; }

.next-row { display: flex; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
  padding: 11px 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font-weight: 500; font-size: 1rem;
}
.pill svg { width: 18px; height: 18px; }
.pill.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.pill:disabled { opacity: .55; cursor: default; }

/* Phrasebook */
.seg { display: inline-flex; align-self: flex-start; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: .95rem; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
.book { display: flex; flex-direction: column; gap: 26px; }
.group { display: flex; flex-direction: column; }
.group h2 { margin: 0 0 6px; font-size: .74rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.entry { border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: 0; }
.entry-row { display: flex; align-items: center; gap: 4px; }
.star { flex: none; width: 38px; height: 38px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; margin-left: -10px; }
.ph { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 0; cursor: pointer; font-size: 1.05rem; line-height: 1.35; }
.ex { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px 28px; font-size: .95rem; line-height: 1.5; }
.ex p { margin: 0; }
.exq { color: var(--muted); font-family: var(--f-scene); font-size: 1.02rem; }
.empty { margin: 8px 0 0; color: var(--muted); font-size: 1rem; }
.empty button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

@media (max-width: 420px) {
  .card { padding: 26px 20px 24px; border-radius: 20px; }
  #answer { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) {
  .dots i { animation: none; opacity: .6; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v12.5H7.5A2.5 2.5 0 0 1 5 17zM5 17a2.5 2.5 0 0 1 2.5-2.5H18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5.5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h13.5M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V8h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M5 19l1-4L15.5 5.5a2.1 2.1 0 0 1 3 3L9 18z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<main>
  <header class="bar">
    <button class="icon-btn" id="back" type="button" aria-label="Back to practice" hidden><svg><use href="#i-back"/></svg></button>
    <span></span>
    <button class="icon-btn" id="toBook" type="button" aria-label="Phrasebook"><svg><use href="#i-book"/></svg><span class="badge" id="savedCount" hidden></span></button>
  </header>

  <section class="view" id="practice">
    <article class="card" id="card">
      <div id="situation">
        <p class="ctx" id="ctx">You moved to the US a year ago. Some things still bother you.</p>
        <p class="quote" id="quote">So, what don't you like about living here?</p>
      </div>
      <button class="icon-btn" id="skip" type="button" aria-label="Another situation"><svg><use href="#i-skip"/></svg></button>
      <div class="finish" id="finish" hidden>
        <p id="finishText"></p>
        <div class="row-btns">
          <button class="pill" id="more" type="button">New situations</button>
          <button class="pill ghost" id="restart" type="button">Start over</button>
        </div>
        <div class="status" id="moreStatus" hidden></div>
      </div>
    </article>

    <form class="reply" id="replyForm" autocomplete="off">
      <textarea id="reply" rows="2" placeholder="Your answer" aria-label="Your answer"></textarea>
      <button class="send" id="send" type="submit" aria-label="Show a diplomatic answer"><svg><use href="#i-up"/></svg></button>
    </form>

    <div class="result" id="result" hidden>
      <p id="answer"></p>
      <p class="move" id="move" hidden></p>
      <div class="chips" id="chips"></div>
      <div class="alts" id="alts" aria-live="polite"></div>
      <button class="alt-btn" id="another" type="button" hidden><svg aria-hidden="true"><use href="#i-skip"/></svg>Another answer</button>
      <div class="mine" id="mine" hidden>
        <p id="mineText"></p>
        <div class="polish" id="polish"></div>
      </div>
      <div class="next-row"><button class="pill" id="next" type="button">Next <svg><use href="#i-next"/></svg></button></div>
    </div>
  </section>

  <section class="view" id="bookView" hidden>
    <div class="seg" role="group" aria-label="Show">
      <button type="button" id="fSaved" aria-pressed="true">Saved</button>
      <button type="button" id="fAll" aria-pressed="false">All</button>
    </div>
    <div class="book" id="book"></div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // Awkward questions. c = what's true for you, q = what they say, a = a diplomatic answer with [phrases],
  // m = the move in a few words, k = kind of move (KINDS).
  const BANK = [
    { k: "used", c: "You moved to the US a year ago. Some things still bother you.", q: "So, what don't you like about living here?", a: "Hmm, [it was hard for me to get used to] driving everywhere. Back home I walked a lot. But [it's getting easier].", m: "Talk about your adjustment, not their country's faults." },
    { k: "used", c: "You're visiting a friend's family abroad. The food is too heavy for you.", q: "How do you like our food?", a: "[It's very different from what I'm used to]! [Some dishes took me a while], but I really love the bread.", m: "Different, not bad. Then one real compliment." },
    { k: "used", c: "You're new in town. People seem cold to you.", q: "Do you find people here friendly?", a: "People seem [a bit more reserved] than back home, so [it took me a while to make friends]. But [once you get to know them], they're great.", m: "‘Reserved’ sounds kinder than ‘cold’." },
    { k: "used", c: "You live in the US. You think a 20% tip is too much.", q: "What do you think about tipping here?", a: "[Honestly, it took some getting used to]. [Back home, we don't tip as much], so I'm still learning the rules.", m: "Compare with home instead of judging." },
    { k: "used", c: "You moved to the US. Everything feels very expensive.", q: "What surprised you most here?", a: "[The prices, to be honest]! [It took me a while to adjust]. But I love how friendly people are in stores.", m: "One honest surprise, one real plus." },
    { k: "used", c: "An American friend made you coffee. It's very weak.", q: "Good coffee, right?", a: "[It's lighter than I'm used to]! Back home we drink it really strong. [Thanks for making it]!", m: "Describe it, don't rate it." },
    { k: "used", c: "You moved here in the fall. You hate the winters.", q: "What's the worst thing about living here?", a: "[I wouldn't say ‘worst’], but [the winters were hard for me]. [I'm learning to] enjoy them, though.", m: "Reject the strong word, then answer softly." },
    { k: "used", c: "Your host is proud of the city. You find it noisy and dirty.", q: "Isn't our city amazing?", a: "[It has so much energy]! [It's a bit louder than I'm used to], but there's always something to do.", m: "Find a true, kind word for the same thing." },
    { k: "used", c: "You live abroad. You often don't understand your friends' jokes.", q: "Do you get our jokes?", a: "[Not always, to be honest]! [Humor is the last thing you learn] in a new language. [I'm getting there].", m: "Admit it with a smile; it's not their fault." },
    { k: "used", c: "Your American friends eat dinner at 5:30. It feels strange to you.", q: "Is dinner at 5:30 weird for you?", a: "[A little, at first]! Back home we eat later, but [I'm starting to like it].", m: "‘At first’ puts the problem in the past." },
    { k: "used", c: "You're at a friend's home abroad. Wearing shoes inside feels wrong to you.", q: "Oh, you can keep your shoes on!", a: "Thanks! [I'm just used to taking them off]. [It's a habit from home].", m: "Your habit, not their rule." },
    { k: "used", c: "You live in the US. Small talk with strangers annoyed you at first.", q: "What was hardest to get used to here?", a: "[Probably the small talk]! Back home we don't chat with strangers much. [Now I kind of like it], though.", m: "Hard then, okay now." },

    { k: "taste", c: "A friend loves a movie. You found it boring.", q: "Wasn't it a great movie?", a: "[It wasn't really my thing], but [I can see why people love it]. The music was beautiful.", m: "Make it about your taste, not the movie." },
    { k: "taste", c: "A friend cooked dinner. It's too spicy for you.", q: "How is it?", a: "[It's really tasty]! [It's just a bit spicy for me]. I'm not used to spicy food.", m: "Compliment first, then ‘a bit … for me’." },
    { k: "taste", c: "A colleague plays you a new song. You don't like it.", q: "Don't you love this song?", a: "[It's not really my style], but [it's catchy]! Who is it?", m: "‘Not my style’ plus a question moves on." },
    { k: "taste", c: "A friend tries on a jacket. You don't think the color suits them.", q: "Be honest. Does it look good?", a: "[The fit is great]. [I'm not sure about the color on you], though. Maybe try the dark blue?", m: "Praise one thing, doubt one thing, suggest." },
    { k: "taste", c: "A friend recommended a restaurant. You didn't like it.", q: "So, how was the restaurant?", a: "[It had a really nice atmosphere]! [The food wasn't quite what I expected], but I'm glad we tried it.", m: "‘Not what I expected’ is softer than ‘bad’." },
    { k: "taste", c: "Your host family has a big dog. You're scared of dogs.", q: "Isn't he adorable?", a: "[He's very cute]! [I'm just a little nervous around dogs], so I'll admire him from here.", m: "Name your feeling, not the dog's problem." },
    { k: "taste", c: "A colleague invites you to karaoke again. You hate karaoke.", q: "You're coming, right? It'll be so fun!", a: "[Karaoke isn't really my thing], but have fun! [Let's do lunch] next week instead.", m: "No to the activity, yes to the person." },
    { k: "taste", c: "Friends abroad ask if you'd live in their country. You wouldn't.", q: "Would you ever live here?", a: "[It's a beautiful place to visit]! [I'm not sure I could live here], but [never say never].", m: "Praise it as a visit; keep it open." },

    { k: "kind", c: "A friend's new apartment is small and dark.", q: "What do you think of my new place?", a: "[It's really cozy]! And [the location is great]. [It might be nice to add] a lamp or two.", m: "‘Cozy’ is the diplomatic word for small." },
    { k: "kind", c: "You visited your host's country. It rained, and the hotels were overpriced.", q: "How was your trip?", a: "[It was quite an adventure]! [The weather wasn't on our side], but we saw some beautiful places.", m: "Blame the weather, not the country." },
    { k: "kind", c: "A friend is dating someone you don't really like.", q: "So, what do you think of him?", a: "[I don't know him that well yet]. [What matters most is that] he makes you happy.", m: "Don't judge; talk about what matters to them." },
    { k: "kind", c: "Your manager asks about your job. You're not fully happy.", q: "Are you happy here?", a: "[Mostly, yes]. [There are a few things I'd love to talk about], like my schedule.", m: "‘Mostly’ plus one specific topic." },
    { k: "kind", c: "The host asks about last night's party. It was boring.", q: "Did you have fun last night?", a: "[It was nice to see everyone]! [It was a quiet night], but I'm glad I came.", m: "Talk about the people, not the fun." },
    { k: "kind", c: "A friend's mom cooked dinner. You didn't like it.", q: "Would you like some more?", a: "[Thank you, but I couldn't eat another bite]! [It was so kind of you] to cook for us.", m: "Being full is always a polite reason." },
    { k: "kind", c: "At a dinner abroad, they serve a dish you find strange.", q: "Do you eat this in Ukraine?", a: "[Not really, it's new for me]! [I'm glad I got to try it].", m: "‘New for me’ is honest and kind." },
    { k: "kind", c: "A friend gave you a gift you don't like.", q: "Do you like it?", a: "[That's so thoughtful of you]! [I love that you thought of me].", m: "Thank them for the thought, not the thing." },
    { k: "kind", c: "A friend got a haircut. You don't love it.", q: "Do you like my new hair?", a: "[It's a big change]! [I think I need a day to get used to it], but you look happy, and that's what matters.", m: "Your adjustment, then their happiness." },
    { k: "kind", c: "Your neighbor built a new fence. You think it's ugly.", q: "What do you think of the new fence?", a: "[It's definitely eye-catching]! [It must have been a lot of work].", m: "‘Eye-catching’, and praise the effort." },
    { k: "kind", c: "A friend sang at a party. It wasn't good.", q: "How was my singing?", a: "[You looked like you were having so much fun]! [That's what it's all about].", m: "Praise the joy, skip the quality." },

  const KIND_ORDER = ["used", "taste", "kind", "sides", "dodge", "honest", "correct"];
  const KINDS = {
    used: "Not used to it yet", taste: "Just not for me", kind: "Kind but true", sides: "Not taking sides",
    dodge: "Not going there", honest: "Honest feedback", correct: "Correcting gently"
  };
  const CONT = new Set(["but", "to", "if", "about", "on", "for", "with", "of", "when", "and", "so", "be", "is", "like", "as", "in", "at", "by", "the", "a", "through", "do", "could", "keep", "me", "get", "into", "mind", "usually", "we", "down", "add", "more"]);

  const $ = s => document.querySelector(s);
  const S = { done: new Set(), saved: new Set(), extra: [], more: [], alts: [], cur: null, filter: "saved" };
  const sessionDone = new Set();

  // ---------- text helpers ----------
  function parseAnswer(a) {
    const parts = []; const re = /\[([^\]]+)\]/g; let i = 0, m;
    while ((m = re.exec(a))) {
      if (m.index > i) parts.push({ t: a.slice(i, m.index) });
      parts.push({ t: m[1], p: true });
      i = re.lastIndex;
    }
    if (i < a.length) parts.push({ t: a.slice(i) });
    return parts;
  }
  // `after` is the answer text right after the phrase: an ellipsis is added only when
  // the sentence goes on and the phrase ends on a word that needs more ("Could you send it by…").
  function chipText(raw, after) {
    let t = raw.trim().replace(/[.,:;]+$/, "");
    if (!t) return "";
    t = t[0].toUpperCase() + t.slice(1);
    const goesOn = /^\s+[A-Za-z0-9$]/.test(after || "") && !/[!?]$/.test(t);
    const last = (t.split(/\s+/).pop() || "").toLowerCase().replace(/[^a-z']/g, "");
    if (goesOn && CONT.has(last)) t += "…";
    return t;
  }
  const keyOf = t => t.toLowerCase().replace(/…$/, "").replace(/[^\p{L}\p{N}' ]/gu, "").replace(/\s+/g, " ").trim();
  function phrasesOf(a) {
    const seen = new Set(), out = [];
    const parts = parseAnswer(a);
    parts.forEach((p, i) => {
      if (!p.p) return;
      const nx = parts[i + 1];
      const t = chipText(p.t, nx && !nx.p ? nx.t : ""); const k = keyOf(t);
      if (t && !seen.has(k)) { seen.add(k); out.push(t); }
    });

  }
  function plain(a) { return a.replace(/\[([^\]]+)\]/g, "$1"); }
  function fillMarked(el, a) {
    el.textContent = "";
    for (const p of parseAnswer(a)) {
      if (p.p) { const m = document.createElement("mark"); m.textContent = p.t; el.append(m); }
      else el.append(document.createTextNode(p.t));

  }
  function svg(id) {

    u.setAttribute("href", "#" + id); s.append(u); s.setAttribute("aria-hidden", "true");
    return s;
  }

  // ---------- storage ----------
  const LS = "say-it-nicely";
  function readLocal() { try { return JSON.parse(localStorage.getItem(LS) || "null") || {}; } catch { return {}; } }
  function writeLocal() {
    try { localStorage.setItem(LS, JSON.stringify({ done: [...S.done], saved: [...S.saved], extra: S.extra, more: S.more })); } catch {}
  }
  let db = null;
  const queues = {};
  function bodyFor(name) {
    if (name === "progress") return { done: [...S.done] };
    if (name === "saved") return { phrases: [...S.saved] };
    if (name === "more") return { items: S.more };
    return { items: S.extra };
  }
  function persist(name) {
    writeLocal();
    if (!db) return;
    const body = bodyFor(name);
    queues[name] = (queues[name] || Promise.resolve())
      .then(() => db.doc("me/" + name).set(body))
      .catch(e => console.warn("Could not save " + name, e && e.code));
  }
  function validMore(e) {
    return e && typeof e.t === "string" && typeof e.k === "string" && typeof e.ex === "string" && KINDS[e.kind];
  }
  function validItem(x) {
    return x && typeof x.c === "string" && typeof x.q === "string" && typeof x.a === "string" && x.q.trim() && x.a.includes("[") && typeof x.id === "string";
  }
  async function connect() {
    if (!window.claude || !window.claude.use) return;
    let d = null;
    try { d = await window.claude.use("db"); } catch { d = null; }
    if (!d) return;
    let snaps;
    try {
      snaps = await Promise.race([
        Promise.all(["progress", "saved", "extra", "more"].map(n => d.doc("me/" + n).get())),
        new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000))
      ]);
    } catch (e) { console.warn("Saved progress not reachable yet", e && e.code); db = d; return; }
    db = d;
    const [p, s, x, mo] = snaps.map(sn => (sn && sn.exists ? sn.data() : null));
    if (p && Array.isArray(p.done)) S.done = new Set([...p.done, ...sessionDone]); else persist("progress");
    if (s && Array.isArray(s.phrases)) S.saved = new Set(s.phrases); else if (S.saved.size) persist("saved");
    if (x && Array.isArray(x.items)) S.extra = x.items.filter(validItem); else if (S.extra.length) persist("extra");
    if (mo && Array.isArray(mo.items)) S.more = mo.items.filter(validMore); else if (S.more.length) persist("more");
    writeLocal();
    refreshChips(); updateCount();
    if (!$("#bookView").hidden) renderBook();
  }

  // ---------- practice ----------
  const pool = () => BANK.concat(S.extra);
  function pickNext() {
    const curId = S.cur && S.cur.id;
    let left = pool().filter(x => !S.done.has(x.id) && x.id !== curId);
    if (!left.length) left = pool().filter(x => !S.done.has(x.id));
    return left.length ? left[Math.floor(Math.random() * left.length)] : null;
  }
  function showSituation() {
    $("#finish").hidden = true;
    $("#situation").hidden = false;
    $("#skip").hidden = false;
    $("#ctx").textContent = S.cur.c;
    $("#quote").textContent = S.cur.q;
    $("#replyForm").hidden = false;
    $("#result").hidden = true;
    stopPolish(); stopAlt();
  }
  function next(focus) {
    S.cur = pickNext();
    if (!S.cur) { showFinish(); return; }
    showSituation();
    const r = $("#reply"); r.value = ""; autosize();
    if (focus && matchMedia("(pointer: fine)").matches) r.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function showFinish() {
    stopPolish(); stopAlt();
    $("#situation").hidden = true;
    $("#skip").hidden = true;
    $("#replyForm").hidden = true;
    $("#result").hidden = true;
    $("#finish").hidden = false;
    $("#finishText").textContent = "That's all " + pool().length + " questions.";
    $("#moreStatus").hidden = true;
    $("#more").disabled = false;
    sampleReady.then(fn => { $("#more").hidden = !fn || sampleOff; });
  }
  function reveal() {
    if (!S.cur) return;
    const text = $("#reply").value.trim();
    S.done.add(S.cur.id); sessionDone.add(S.cur.id); persist("progress");
    fillMarked($("#answer"), S.cur.a);
    $("#move").textContent = S.cur.m || ""; $("#move").hidden = !S.cur.m;
    refreshChips();
    $("#alts").textContent = ""; S.alts = [];
    $("#another").hidden = true; $("#another").disabled = false;
    sampleReady.then(fn => { if (S.cur && !$("#result").hidden) $("#another").hidden = !fn || sampleOff; });
    $("#replyForm").hidden = true;
    $("#result").hidden = false;
    if (text) {
      $("#mine").hidden = false;
      $("#mineText").textContent = text;
      polish(S.cur, text);
    } else {

      stopPolish();
    }

  }
  function fillChips(box, item, answer) {
    box.textContent = "";
    for (const t of phrasesOf(answer)) {
      const k = keyOf(t);
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.k = k;
      const sp = document.createElement("span"); sp.textContent = t;
      b.append(svg("i-star"), sp);
      setChip(b, t);
      b.addEventListener("click", () => {
        toggleSave(k, { t, k, kind: item.k, ex: answer, q: item.q });
        document.querySelectorAll(".chip").forEach(c => { if (c.dataset.k === k) setChip(c, c.textContent); });
      });
      box.append(b);
    }
  }
  function setChip(b, t) {
    const on = S.saved.has(b.dataset.k);

    b.setAttribute("aria-label", (on ? "Remove from phrasebook: " : "Save to phrasebook: ") + t);
  }
  function refreshChips() {

    document.querySelectorAll("#alts .chip").forEach(c => setChip(c, c.textContent));
  }
  // A phrase from one of Claude's answers is kept in me/more so the phrasebook can show it.
  function toggleSave(k, entry) {
    if (S.saved.has(k)) {
      S.saved.delete(k);
      const before = S.more.length;
      S.more = S.more.filter(e => e.k !== k);
      if (S.more.length !== before) persist("more");
    } else {
      S.saved.add(k);
      if (entry && !bookMap().has(k)) { S.more.push(entry); persist("more"); }
    }
    persist("saved"); updateCount();
  }
  function updateCount() {
    const n = [...S.saved].filter(k => bookMap().has(k)).length;
    const b = $("#savedCount"); b.hidden = !n; b.textContent = n;
  }

  // ---------- Claude: polish her reply ----------
  const sampleReady = (window.claude && window.claude.use)
    ? window.claude.use("sample").catch(() => null)
    : Promise.resolve(null);
  let sampleOff = false;
  let polishCtl = null;

  let altCtl = null;

  function altPrompt(item, seen) {
    return [
      "You write diplomatic answers in simple, natural American English for an advanced learner (a Ukrainian English teacher).",
      "Diplomatic means honest but tactful, not just polite: soften negatives (\"It was hard for me to get used to...\" instead of \"I don't like...\"), make it about your own taste or experience, start with something true and positive, don't take sides, correct gently, or dodge lightly. No outright lies. Never fancy.",
      "",
      "What is true for her: " + item.c,
      "Someone says to her: \"" + item.q + "\"",
      "",
      "Answers she has already seen:",
      seen.map(a => "- " + a).join("\n"),
      "",
      "Write ONE clearly different diplomatic answer: a different move or angle, not the same idea in other words.",
      "Reply with only a JSON object: {\"a\": the answer, 1-3 short sentences, with 2-3 reusable diplomatic phrases wrapped in [square brackets], \"m\": the diplomatic move in at most 8 words}",
      "Example: {\"a\": \"[To be honest], [I'm still getting used to] the winters. [The summers make up for it], though!\", \"m\": \"Admit it, then balance it.\"}"

  async function anotherAnswer() {
    const item = S.cur;
    const btn = $("#another"), box = $("#alts");
    const fn = await sampleReady;
    if (!fn || sampleOff || !item) { btn.hidden = true; return; }
    stopAlt();
    const ctl = new AbortController(); altCtl = ctl;
    box.querySelectorAll(".alt-err").forEach(n => n.remove());
    btn.disabled = true;
    const wait = dots(); wait.setAttribute("aria-label", "Writing another answer");
    box.append(wait);
    const seen = [plain(item.a)].concat(S.alts.map(x => plain(x.a)));
    try {
      const r = await fn.json(altPrompt(item, seen), { modelTier: "quick", signal: ctl.signal, cache: false });
      if (ctl.signal.aborted || S.cur !== item) return;
      wait.remove();
      const a = r && typeof r.a === "string" ? r.a.trim() : "";
      if (!a) throw { code: "empty_completion" };
      const alt = { a, m: typeof r.m === "string" ? r.m.trim() : "" };

  function renderAlt(item, alt) {

  function polishPrompt(item, text) {
    return [
      "You coach an advanced English learner (a Ukrainian English teacher who uses American English) on DIPLOMATIC answers: answering an awkward or tricky question honestly, without offending anyone.",
      "Diplomatic is more than polite. It means: soften a negative opinion (\"It was hard for me to get used to...\" instead of \"I don't like...\"), make it about your own taste or experience instead of judging, start with something true and positive, don't take sides, correct gently, and dodge too-personal questions lightly. No outright lies. Simple everyday words, never fancy.",
      "",
      "What is true for her: " + item.c,
      "Someone says to her: \"" + item.q + "\"",
      "Her answer: \"\"\"" + text + "\"\"\"",
      "A good model answer, for reference only: " + plain(item.a),
      "",
      "Reply with only a JSON object with these keys:",
      "\"ok\": true if her answer is already diplomatic (honest but tactful) and natural; false if it is too blunt, too negative, takes sides, sounds fake, or just avoids the question.",
      "\"better\": her answer made diplomatic. Keep her idea and as many of her own words as you can. Natural American English, 1-3 short sentences. If it already works, make only tiny changes or none.",
      "\"tip\": the diplomatic move she missed or could use, at most 12 words, no praise. Empty string if there is nothing useful to add.",
      "\"fix\": a list of her grammar or word-choice mistakes, each as {\"wrong\": \"...\", \"right\": \"...\"} with just the few words involved. Empty list if there are none.",
      "Example: {\"ok\": false, \"better\": \"Honestly, the winters were hard for me to get used to.\", \"tip\": \"Say what was hard for you, not what's bad here.\", \"fix\": [{\"wrong\": \"I don't like your winter\", \"right\": \"the winters were hard for me\"}]}"

  function dots() {

    return d;
  }

  async function polish(item, text) {
    stopPolish();
    const box = $("#polish");
    box.textContent = "";
    const fn = await sampleReady;
    if (!fn || sampleOff) return;
    if (S.cur !== item) return;
    const ctl = new AbortController(); polishCtl = ctl;
    box.append(dots());
    try {
      const r = await fn.json(polishPrompt(item, text), { modelTier: "quick", signal: ctl.signal });
      if (ctl.signal.aborted || S.cur !== item) return;
      renderPolish(r, text);
    } catch (e) {
      if (ctl.signal.aborted || (e && e.code === "cancelled")) return;
      box.textContent = "";
      if (e && OFF_CODES.includes(e.code)) { sampleOff = true; return; }
      const msg = document.createElement("p"); msg.className = "tip";
      msg.textContent = e && e.code === "rate_limited"
        ? "Too many checks at once. Try again in a minute."
        : "Couldn't check your reply this time.";
      const again = document.createElement("button");
      again.type = "button"; again.className = "quiet-btn"; again.textContent = "Try again";
      again.addEventListener("click", () => polish(item, text));
      box.append(msg, again);
    } finally {
      if (polishCtl === ctl) polishCtl = null;
    }
  }

  function diffWords(a, b) {
    const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean);
    const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}']/gu, "").replace(/’/g, "'");
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = norm(A[i]) === norm(B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (j < m) {
      if (i < n && norm(A[i]) === norm(B[j])) { out.push({ w: B[j], same: true }); i++; j++; }
      else if (i < n && dp[i + 1][j] >= dp[i][j + 1]) i++;
      else { out.push({ w: B[j], same: false }); j++; }
    }
    return out;
  }

  function renderPolish(r, text) {
    const box = $("#polish"); box.textContent = "";
    if (!r || typeof r !== "object") return;
    const better = typeof r.better === "string" ? r.better.trim() : "";
    const ok = r.ok === true;
    const tokens = better ? diffWords(text, better) : [];
    const changed = tokens.some(t => !t.same);

    const p = document.createElement("p");
    p.className = "better" + (ok ? " ok" : "");
    p.append(svg(ok ? "i-check" : "i-pen"));
    const span = document.createElement("span");
    if (better && (changed || !ok)) {
      // Group neighboring changed words into one highlight.
      const runs = [];
      for (const t of tokens) {
        const last = runs[runs.length - 1];
        if (last && last.same === t.same) last.w.push(t.w); else runs.push({ same: t.same, w: [t.w] });
      }
      runs.forEach((r, idx) => {
        if (idx) span.append(document.createTextNode(" "));
        if (r.same) span.append(document.createTextNode(r.w.join(" ")));
        else { const s = document.createElement("span"); s.className = "ins"; s.textContent = r.w.join(" "); span.append(s); }
      });
    } else {
      span.textContent = "Good to go.";
    }
    p.append(span);
    box.append(p);

    const fixes = Array.isArray(r.fix) ? r.fix.filter(f => f && typeof f.wrong === "string" && typeof f.right === "string" && f.wrong.trim()) : [];
    if (fixes.length) {
      const ul = document.createElement("ul"); ul.className = "fixes";
      for (const f of fixes.slice(0, 4)) {
        const li = document.createElement("li");
        const s = document.createElement("s"); s.textContent = f.wrong.trim();
        li.append(s, document.createTextNode(" → " + f.right.trim()));
        ul.append(li);
      }
      box.append(ul);
    }
    const tip = typeof r.tip === "string" ? r.tip.trim() : "";
    if (tip) { const t = document.createElement("p"); t.className = "tip"; t.textContent = tip; box.append(t); }
  }

  // ---------- Claude: more situations ----------
  async function generateMore() {
    const fn = await sampleReady;
    const status = $("#moreStatus");
    if (!fn || sampleOff) { $("#more").hidden = true; return; }
    $("#more").disabled = true; $("#restart").disabled = true;
    status.hidden = false; status.textContent = "Writing new situations…";
    const existing = pool().map(x => "- " + x.q).join("\n");
    const prompt = [
      "Write 12 new awkward questions for practicing DIPLOMATIC answers in English: questions where an honest answer could offend, so you answer honestly but tactfully.",
      "Example: abroad, someone asks \"What don't you like about living here?\" and the diplomatic answer is \"It was hard for me to get used to driving everywhere.\"",
      "The learner is a Ukrainian English teacher living her life in English: living or traveling abroad, students and their parents, colleagues and bosses, friends, hosts, neighbors.",
      "Each item is an object:",
      "\"c\": what is true for you, one short sentence in the second person (\"You find people here a bit cold.\"), so the tricky part is clear.",
      "\"q\": exactly what the other person says, one short line.",
      "\"a\": a diplomatic answer in simple, natural American English, 1-3 short sentences, not fancy. Honest, no outright lies: soften negatives, talk about your own taste or experience, start with a true positive, don't take sides, correct gently, or dodge lightly. Wrap 2-3 reusable diplomatic phrases in square brackets, like: \"[It was hard for me to get used to] the cold.\"",
      "\"m\": the diplomatic move in at most 8 words, like \"Your adjustment, not their country's faults.\"",
      "\"k\": one of: " + KIND_ORDER.map(k => k + " (" + KINDS[k] + ")").join(", "),
      "No health or religion. Do not repeat or closely copy these existing questions:",
      existing,
      "",
      "Reply with only a JSON array of 12 {\"c\", \"q\", \"a\", \"m\", \"k\"} objects."
    ].join("\n");
    try {
      const arr = await fn.json(prompt, { cache: false });
      const stamp = Date.now().toString(36);
      const items = (Array.isArray(arr) ? arr : [])
        .filter(x => x && typeof x.q === "string" && typeof x.a === "string" && x.q.trim() && /\[[^\]]+\]/.test(x.a))
        .slice(0, 15)
        .map((x, i) => ({
          id: "x" + stamp + i, k: KINDS[x.k] ? x.k : "kind",
          c: typeof x.c === "string" ? x.c.trim() : "", q: x.q.trim().replace(/^["\u201c]|["\u201d]$/g, ""),
          a: x.a.trim(), m: typeof x.m === "string" ? x.m.trim() : ""
        }));
      if (!items.length) throw { code: "empty" };
      S.extra = S.extra.concat(items);
      persist("extra");
      updateCount();
      next(true);
    } catch (e) {
      if (e && OFF_CODES.includes(e.code)) { sampleOff = true; $("#more").hidden = true; status.textContent = ""; status.hidden = true; }
      else status.textContent = e && e.code === "rate_limited" ? "Too many requests. Try again in a minute." : "That didn't work. Try again.";
    } finally {
      $("#more").disabled = false; $("#restart").disabled = false;
    }
  }

  // ---------- phrasebook ----------
  let bookCache = null, bookSize = "";
  function bookMap() {
    const p = pool();
    const size = p.length + ":" + S.more.length;
    if (bookCache && bookSize === size) return bookCache;
    const map = new Map();
    for (const it of p) for (const t of phrasesOf(it.a)) {
      const k = keyOf(t);
      if (!map.has(k)) map.set(k, { t, k, kind: it.k, ex: it.a, q: it.q });
    }
    for (const e of S.more) if (!map.has(e.k)) map.set(e.k, e);
    bookCache = map; bookSize = size;
    return map;
  }
  function renderBook() {
    $("#fSaved").setAttribute("aria-pressed", S.filter === "saved" ? "true" : "false");
    $("#fAll").setAttribute("aria-pressed", S.filter === "all" ? "true" : "false");
    const root = $("#book"); root.textContent = "";
    const entries = [...bookMap().values()].filter(e => S.filter === "all" || S.saved.has(e.k));
    if (!entries.length) {
      const p = document.createElement("p"); p.className = "empty";
      p.append(document.createTextNode("Tap the star on a phrase to keep it here. "));
      const b = document.createElement("button"); b.type = "button"; b.textContent = "See all phrases";
      b.addEventListener("click", () => { S.filter = "all"; renderBook(); });
      p.append(b); root.append(p);
      return;
    }
    for (const kind of KIND_ORDER) {
      const list = entries.filter(e => e.kind === kind);
      if (!list.length) continue;
      const g = document.createElement("section"); g.className = "group";
      const h = document.createElement("h2"); h.textContent = KINDS[kind]; g.append(h);
      for (const e of list) {
        const wrap = document.createElement("div"); wrap.className = "entry";
        const row = document.createElement("div"); row.className = "entry-row";
        const star = document.createElement("button");
        star.type = "button"; star.className = "star";
        const on = S.saved.has(e.k);
        star.setAttribute("aria-pressed", on ? "true" : "false");
        star.setAttribute("aria-label", (on ? "Remove " : "Save ") + e.t);
        star.append(svg("i-star"));
        const ph = document.createElement("button");
        ph.type = "button"; ph.className = "ph"; ph.textContent = e.t;
        ph.setAttribute("aria-expanded", "false");
        const ex = document.createElement("div"); ex.className = "ex"; ex.hidden = true;
        const exq = document.createElement("p"); exq.className = "exq"; exq.textContent = "\u201c" + e.q + "\u201d";
        const exa = document.createElement("p"); fillMarked(exa, e.ex);
        ex.append(exq, exa);
        ph.addEventListener("click", () => { ex.hidden = !ex.hidden; ph.setAttribute("aria-expanded", ex.hidden ? "false" : "true"); });
        star.addEventListener("click", () => {
          toggleSave(e.k);
          const now = S.saved.has(e.k);
          star.setAttribute("aria-pressed", now ? "true" : "false");
          star.setAttribute("aria-label", (now ? "Remove " : "Save ") + e.t);
        });
        row.append(star, ph); wrap.append(row, ex); g.append(wrap);
      }
      root.append(g);
    }
  }

  // ---------- views ----------
  function route() {
    const book = location.hash === "#phrases";
    $("#practice").hidden = book;
    $("#bookView").hidden = !book;
    $("#back").hidden = !book;
    $("#toBook").hidden = book;
    if (book) { renderBook(); window.scrollTo(0, 0); }
    else refreshChips();
  }

  function autosize() {
    const r = $("#reply"); r.style.height = "auto"; r.style.height = Math.min(r.scrollHeight, window.innerHeight * 0.4) + "px";
  }

  // ---------- wiring ----------
  $("#replyForm").addEventListener("submit", e => { e.preventDefault(); reveal(); });
  $("#reply").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); reveal(); }
  });
  $("#reply").addEventListener("input", autosize);
  $("#next").addEventListener("click", () => next(true));
  $("#skip").addEventListener("click", () => next(true));
  $("#restart").addEventListener("click", () => { S.done.clear(); sessionDone.clear(); persist("progress"); next(true); });
  $("#more").addEventListener("click", generateMore);
  $("#another").addEventListener("click", anotherAnswer);
  $("#toBook").addEventListener("click", () => { location.hash = "phrases"; });
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#fSaved").addEventListener("click", () => { S.filter = "saved"; renderBook(); });
  $("#fAll").addEventListener("click", () => { S.filter = "all"; renderBook(); });
  window.addEventListener("hashchange", route);

  function start(data) {
    const local = readLocal();
    if (Array.isArray(local.done)) S.done = new Set(local.done);
    if (Array.isArray(local.saved)) S.saved = new Set(local.saved);
    if (Array.isArray(local.extra)) S.extra = local.extra.filter(validItem);
    if (Array.isArray(local.more)) S.more = local.more.filter(validMore);
    const keep = data && data.cur ? pool().find(x => x.id === data.cur) : null;
    if (keep) { S.cur = keep; showSituation(); $("#reply").value = data.draft || ""; autosize(); }
    else next(false);
    updateCount();
    route();
    try {
      if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
        window.claude.hot.snapshot(() => ({ cur: S.cur && S.cur.id, draft: $("#reply").value }));
      }
    } catch {}
    connect();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
