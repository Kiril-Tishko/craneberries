// A song lesson for an A2+ student. The lyrics load live from lrclib.net when the page opens; they are not stored here.

// hl = the exact words to highlight in the line. Tapping any other word shows its Ukrainian; words left for later

window.LESSON = {
  id: 'human',
  title: 'Human',
  sub: 'Rag’n’Bone Man',
  video: {type: 'youtube', id: 'L3wKzyIN1yk'},
  captions: {type: 'lrc', url: 'https://lrclib.net/api/get/7918608'},
  parts: [
    {name: 'Part 1', start: 2.3, end: 24.5, lines: [
      {words: [['I’m only human', 'я лише людина', 'Sorry, I forgot. <em>I’m only human</em>.']], hl: ['I’m only human'], start: 2.4, end: 12.9},
      {words: [['foolish', 'нерозумний, дурний', 'That was a <em>foolish</em> idea.'], ['blind', 'сліпий', 'Love is <em>blind</em>.']], hl: ['foolish', 'blind'],
        note: 'fool + -ish, like self + -ish = selfish.', start: 13.1, end: 16.65},
      {words: [['behind', 'позаду, за', 'The parking lot is <em>behind</em> the building.']], hl: ['behind'], start: 16.65, end: 20.0},
      {words: [['blind', 'сліпий', 'Without my glasses, I’m almost <em>blind</em>.']], hl: ['blind'],
        note: '“Got no way to prove it” = I have no way to prove it.', start: 20.0, end: 24.5}
    ]},
    {name: 'Part 2', start: 24.5, end: 37.6, lines: [
      {words: [['after all', 'зрештою, усе-таки', 'Don’t be angry with him. He’s only a kid, <em>after all</em>.']], hl: ['after all'],
        note: 'Here it means “don’t forget that…”. It doesn’t mean “finally”.', start: 24.5, end: 30.7}
    ]},
    {name: 'Part 3', start: 38.6, end: 63.3, lines: [
      {words: [['take a look', 'подивитися, поглянути', '<em>Take a look</em> at this chart.']], hl: ['take a look'],
        note: 'Usually: take a look at something. In the song: in the mirror.', start: 38.6, end: 42.1},
      {words: [['after all', 'зрештою, усе-таки', 'Let’s help him. He’s our friend, <em>after all</em>.']], hl: ['after all'], start: 50.4, end: 56.4}
    ]}
  ],
  // Not for now: tapping these says so.
  later: [['see through', 'бачити наскрізь'], ['put your blame on', 'звинувачувати'], ['put the blame on', 'звинувачувати'],
    ['deceived', 'обдурений']],

  gloss: {
    'i’m': 'я (I am)', i: 'я', only: 'лише, тільки', human: 'людина', maybe: 'можливо', foolish: 'нерозумний, дурний', blind: 'сліпий',

  }
