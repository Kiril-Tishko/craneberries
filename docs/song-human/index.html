<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Human, Line by Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout: the left column is the player (video, clip bar, lyrics, one fixed row of buttons);
   the right column is only what to learn. Nothing changes size while she works, so nothing jumps. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#141B24; --muted:#5D6773; --line:#D5DBE2;
  --accent:#C2410C; --accent-ink:#FFFFFF; --soft:#FCE9DE; --ua:#5B4A0E; --ua-bg:#FFF2C6; --ok:#1E7A4F; --tint:#F4F6F8;
  --font:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F141A; --surface:#18202A; --ink:#E8EDF2; --muted:#9AA6B3; --line:#2A3542;
  --accent:#FB8A4C; --accent-ink:#0F141A; --soft:#3A2418; --ua:#F4DD8A; --ua-bg:#3A3214; --ok:#6FD1A0; --tint:#121921; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.ghost{visibility:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:1200px;margin:0 auto;display:grid;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,3vw,26px);font-weight:800}
h1 span{color:var(--muted);font-weight:600;font-size:.7em}
.where{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted);font-weight:600}
main{display:grid;gap:16px;grid-template-columns:1.3fr 1fr;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}

/* Player column */
.player{display:flex;flex-direction:column;gap:8px;min-width:0}
.video{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;width:100%;max-width:100%}
.video iframe,.video #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;border:0;border-radius:0;padding:0;background:rgba(10,12,16,.82);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.cover span{width:80px;height:80px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1}
.cover.playing{background:transparent}
.cover.playing span{display:none}
.clip{display:flex;align-items:center;gap:10px;height:16px}
.bar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.clip span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;width:64px;text-align:right}
.subs{height:132px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 18px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:center}
.subs p{margin:0;font-size:clamp(19px,2.3vw,24px);font-weight:600;line-height:1.3;transition:opacity .25s}
.subs .wait{opacity:0}
.subs.cols{display:block;column-count:2;column-gap:24px;text-align:left;padding-block:10px}
.subs.cols p{font-size:15px;line-height:1.25;break-inside:avoid;margin-bottom:2px}
.subs .note{color:var(--muted);font-weight:400}
.subs mark{background:var(--ua-bg);color:var(--ua);border-radius:6px;padding:0 4px}
.controls{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-size:16px;font-weight:600}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#listen{min-width:172px}
#next{min-width:184px}
.tiny{background:none;border:0;color:var(--muted);font-size:15px;padding:6px 4px}
#slow[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

/* Learn column */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:300px}
.kicker{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.words{display:flex;flex-direction:column;gap:12px}
.w{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:start}
.w b{font-size:clamp(28px,4vw,42px);font-weight:800;line-height:1.1;text-wrap:balance}
.w .ua{grid-column:1;justify-self:start;font-size:clamp(17px,2.1vw,20px);font-weight:600;color:var(--ua);background:var(--ua-bg);padding:4px 12px;border-radius:12px}
.add{grid-column:2;grid-row:1;width:40px;height:40px;border-radius:99px;padding:0;font-size:22px;line-height:1;margin-top:4px}
.add[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.mean{margin:0;background:var(--tint);border-radius:14px;padding:10px 14px;font-size:18px;line-height:1.4;transition:opacity .25s}
.mean span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.ex{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.ex em{font-style:normal;color:var(--ink);font-weight:600}
.big{font-size:clamp(26px,3.2vw,34px);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
.answer{font-size:clamp(28px,4vw,40px);font-weight:800;margin:0}
.skip{align-self:flex-start;margin-top:auto}
.notewrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tip{margin:0;font-size:16px;line-height:1.45;border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.big em{font-style:normal}
@media (prefers-reduced-motion:reduce){.subs p,.mean{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Human <span>Rag’n’Bone Man</span></h1>
    <div class="where"><span id="mywords"></span><span id="where"></span></div>
  </header>
  <main>
    <div class="player">
      <div class="video"><div id="player"></div><button class="cover" id="cover" aria-label="Play or pause"><span id="coverIcon">▶</span></button></div>
      <div class="clip"><div class="bar"><i id="fill"></i></div><span id="cliptime"></span></div>
      <div class="subs" id="subs" aria-live="polite"></div>
      <div class="controls">
        <button id="back" class="tiny">← Back</button>
        <button id="listen" class="primary">▶ Listen</button>
        <button id="slow" aria-pressed="false" title="Play slower">🐢 Slower</button>
        <span></span>
        <button id="next" class="primary ghost">Next →</button>
      </div>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>
<script>
const VIDEO = 'L3wKzyIN1yk';
const LYRICS_URL = 'https://lrclib.net/api/get/7918608';
// Times in seconds (from the song's synced lyrics). The lyrics load live from lrclib.net; they are not stored here.
// hl = the exact words to highlight in that line; mean = what the line means, in simple Ukrainian.
const PARTS = [
  {name:'Part 1', start:0, end:24.5, lines:[
    {words:[['I’m only human','я лише людина']], hl:['I’m only human'], ex:'Everyone makes mistakes. <em>We’re only human.</em>',
      note:'People say this after a small mistake: “Sorry, I forgot. I’m only human.”', start:2.4, end:12.9},
    {words:[['foolish','дурний, нерозумний']], hl:['foolish'], ex:'That was a <em>foolish</em> idea.', start:13.1, end:15.3},
    {words:[['blind','сліпий']], hl:['blind'], ex:'Love is <em>blind</em>.', start:15.2, end:16.8},
    {words:[['see through','бачити наскрізь'],['behind','за, позаду']], hl:['see through','behind'], ex:'I can <em>see through</em> his excuses.', start:16.7, end:20.1},
    {words:[['no way to','немає як'],['prove','довести']], hl:['no way to','prove'], ex:'Can you <em>prove</em> it?',
      note:'He sings “Got no way to prove it”. In fast, casual English people drop “I’ve”: (I’ve) got no way to…', start:20.0, end:24.5}
  ]},
  {name:'Part 2', start:24.5, end:37.6, lines:[
    {words:[['after all','зрештою, усе-таки']], hl:['after all'], ex:'Don’t be angry with him. He’s only a kid, <em>after all</em>.',
      note:'“After all” here means “don’t forget that…”. It doesn’t mean “finally”.', start:24.5, end:30.7},
    {words:[['put the blame on (someone)','звинувачувати (когось)']], hl:['put your blame on','put the blame on'], ex:'Don’t <em>put the blame on</em> me. It wasn’t my fault.',
      note:'He sings both “your blame” and “the blame”. In everyday English people usually just say “Don’t blame me.”', start:30.7, end:37.6}
  ]}
];
// Each part: listen without stopping → break it down line by line → the whole part again. Then My words.
const STEPS = [];
PARTS.forEach((p, pn) => {
  STEPS.push({kind:'first', pn, start:p.start, end:p.end});
  p.lines.forEach((l, ln) => STEPS.push(Object.assign({kind:'line', pn, ln}, l)));
  STEPS.push({kind:'again', pn, start:p.start, end:p.end});
});
STEPS.push({kind:'practice'});

let i = 0, player = null, ready = false, timer = null, off = 0;
let state = 'idle';            // idle · playing · paused · ended
let clip = null;               // {start, end} of the clip in use
let slow = false, slowRate = 0.75;
const heard = STEPS.map(() => false);
let LINES = [], lyricsFailed = false;
let dict = [], pr = {n: 0, show: false};
try { off = parseFloat(localStorage.getItem('human-offset') || '0') || 0; } catch (e) {}
try { dict = JSON.parse(localStorage.getItem('human-dict') || '[]'); } catch (e) { dict = []; }
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const saveDict = () => { try { localStorage.setItem('human-dict', JSON.stringify(dict)); } catch (e) {} };

fetch(LYRICS_URL).then((r) => r.json()).then((d) => {
  LINES = (d.syncedLyrics || '').split('\n').map((l) => {
    const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    return m ? {t: +m[1] * 60 + +m[2], text: m[3]} : null;
  }).filter((x) => x && x.text);
  drawSubs();
}).catch(() => { lyricsFailed = true; drawSubs(); });

function hlFor(s){
  if (s.kind === 'line') return s.hl;
  if (s.kind === 'first' || s.kind === 'again') return PARTS[s.pn].lines.flatMap((l) => l.hl);
  return (dict[pr.n] || {}).hl || [];
}
function marked(text, hls){
  let h = esc(text);
  hls.forEach((w) => {
    const pat = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[’']/g, "[’']");
    h = h.replace(new RegExp(`(^|[^\\w’'])(${pat})(?![\\w’'])`, 'gi'), '$1<mark>$2</mark>');
  });
  return h;
}
const linesIn = (a, b) => LINES.filter((l) => l.t >= a - .3 && l.t < b - .3);
const nowT = () => (ready ? player.getCurrentTime() - off : (clip ? clip.start : 0));

// Lyrics box: fixed height. Every line of the clip is laid out from the start and fades in when it is sung,
// so nothing moves. In a whole part, only the current line shows while it plays; when it stops, the whole part stays.
function drawSubs(){
  const box = $('subs'), s = STEPS[i];
  box.className = 'subs';
  if (lyricsFailed){ box.innerHTML = '<p class="note">The lyrics didn’t load. Reload the page.</p>'; return; }
  const range = s.kind === 'practice' ? clip : s;
  if (!range || !LINES.length || (s.kind !== 'practice' && !heard[i])){ box.innerHTML = '<p class="note">♪</p>'; return; }
  const hls = hlFor(s), lines = linesIn(range.start, range.end), t = nowT();
  const live = state === 'playing' || state === 'paused';
  if (s.kind === 'first' || s.kind === 'again'){
    if (live){ const cur = LINES.filter((l) => l.t <= t + .15).pop(); box.innerHTML = `<p>${cur ? marked(cur.text, hls) : '♪'}</p>`; return; }
    if (lines.length > 3) box.classList.add('cols');
    box.innerHTML = lines.map((l) => `<p>${marked(l.text, hls)}</p>`).join('');
    return;
  }
  box.innerHTML = lines.map((l) => `<p class="${live && l.t > t + .15 && l !== lines[0] ? 'wait' : ''}">${marked(l.text, hls)}</p>`).join('') || '<p class="note">♪</p>';
}
function drawClip(){
  if (!clip){ $('fill').style.width = '0'; $('cliptime').textContent = ''; return; }
  const len = clip.end - clip.start;
  const done = state === 'ended' ? len : Math.min(len, Math.max(0, nowT() - clip.start));
  $('fill').style.width = `${(done / len) * 100}%`;
  $('cliptime').textContent = `${Math.round(done)} / ${Math.round(len)} s`;
}
function drawPlayer(){
  const s = STEPS[i], practice = s.kind === 'practice';
  const noClip = practice && !(pr.show && dict[pr.n]);
  $('cover').classList.toggle('playing', state === 'playing');
  $('coverIcon').textContent = state === 'ended' ? '↺' : '▶';
  $('coverIcon').hidden = noClip;
  $('cover').style.cursor = noClip ? 'default' : 'pointer';
  const L = $('listen');
  L.textContent = practice ? '▶ Hear it' : (heard[i] ? '↺ Listen again' : '▶ Listen');
  L.className = practice || heard[i] ? '' : 'primary';
  L.classList.toggle('ghost', practice && noClip);
  $('back').classList.toggle('ghost', i === 0);
  const N = $('next');
  let label = 'Next →', show = heard[i];
  if (s.kind === 'first') label = 'Break it down →';
  if (s.kind === 'again') label = s.pn + 1 < PARTS.length ? `${PARTS[s.pn + 1].name} →` : 'My words →';
  if (practice){ label = 'Next word →'; show = pr.show && pr.n < dict.length; }
  N.textContent = label;
  N.classList.toggle('ghost', !show);
}
function where(){
  const s = STEPS[i];
  if (s.kind === 'practice') return 'My words';
  const p = PARTS[s.pn];
  if (s.kind === 'line') return `${p.name} · line ${s.ln + 1} of ${p.lines.length}`;
  return p.name;
}

function render(){
  const s = STEPS[i], h = heard[i];
  $('mywords').textContent = dict.length ? `📒 ${dict.length}` : '';
  $('where').textContent = where();
  let html = '';
  if (s.kind === 'first'){
    const nextPart = STEPS.findIndex((x, n) => n > i && x.kind === 'first');
    html = `<p class="big">Listen to ${PARTS[s.pn].name.toLowerCase()} without stopping 🎧</p>
      <p class="ex">Then we break it down line by line.</p>
      <button class="tiny skip ${h ? '' : 'ghost'}" id="skip" data-to="${nextPart > -1 ? nextPart : STEPS.length - 1}">Skip to ${nextPart > -1 ? PARTS[s.pn + 1].name : 'My words'} →</button>`;
  } else if (s.kind === 'line'){
    html = `<div class="words">${s.words.map(([en, ua]) => {
        const on = dict.some((d) => d.en === en);
        return `<div class="w"><b>${esc(en)}</b><button class="add" data-en="${esc(en)}" aria-pressed="${on}" aria-label="${on ? 'Remove from my words' : 'Add to my words'}">${on ? '✓' : '+'}</button><span class="ua">${esc(ua)}</span></div>`;
      }).join('')}</div>
      <p class="ex">${s.ex}</p>
      ${s.note ? `<div class="notewrap"><button class="tiny" id="noteBtn" aria-expanded="false">💡 Note</button><p class="tip" id="noteText" hidden>${esc(s.note)}</p></div>` : ''}`;
  } else if (s.kind === 'again'){
    html = `<p class="big">Now ${PARTS[s.pn].name.toLowerCase()} again, without stopping</p>
      <p class="ex">Can you catch every word now?</p>`;
  } else if (!dict.length){
    html = `<p class="big">That’s all for now 🎉</p><p class="ex">Tap + next to a word to practice it here.</p>`;
  } else if (pr.n >= dict.length){
    html = `<p class="big">You practiced ${dict.length} word${dict.length > 1 ? 's' : ''} 🎉</p>
      <button id="restart" class="primary" style="align-self:flex-start">↺ Once more</button>`;
  } else {
    const d = dict[pr.n];
    html = `<p class="kicker">📒 ${pr.n + 1} of ${dict.length}</p>
      <p class="big">${d.ex ? d.ex.replace(/<em>.*?<\/em>/, '_____') : esc(d.ua || '')}</p>
      <p class="ex ${pr.show ? 'ghost' : ''}">Which word goes in the gap?</p>
      <p class="answer ${pr.show ? '' : 'ghost'}">${esc(d.en)}</p>
      <button id="reveal" class="primary ${pr.show ? 'ghost' : ''}" style="align-self:flex-start">Show the answer</button>`;
  }
  $('card').innerHTML = html;
  drawPlayer(); drawSubs(); drawClip();
}

function tick(){
  drawSubs(); drawClip();
  if (state === 'playing' && player.getCurrentTime() >= clip.end + off) finish();
}
function finish(){ clearInterval(timer); state = 'ended'; if (ready) player.pauseVideo(); drawPlayer(); drawSubs(); drawClip(); }
function startClip(c){
  if (!ready) return;
  clip = c; state = 'playing';
  clearInterval(timer);
  player.seekTo(Math.max(0, c.start + off), true);
  player.playVideo();
  timer = setInterval(tick, 120);
  drawPlayer(); drawSubs(); drawClip();
}
function pause(){ clearInterval(timer); if (ready) player.pauseVideo(); state = 'paused'; drawPlayer(); }
function resume(){ if (!ready) return; player.playVideo(); state = 'playing'; timer = setInterval(tick, 120); drawPlayer(); }
function stepClip(){
  const s = STEPS[i];
  if (s.kind !== 'practice') return {start: s.start, end: s.end};
  const d = dict[pr.n]; return d && pr.show ? {start: d.start, end: d.end} : null;
}
function listen(){            // side button: always plays the clip from its start
  const c = stepClip(); if (!c) return;
  if (STEPS[i].kind !== 'practice' && !heard[i]){ heard[i] = true; render(); }
  startClip(c);
}
function videoClick(){        // the video: pause / continue; after the end, play again
  if (state === 'playing') return pause();
  if (state === 'paused') return resume();
  listen();
}
function go(n){
  clearInterval(timer); if (ready) player.pauseVideo();
  state = 'idle'; clip = null;
  i = Math.min(STEPS.length - 1, Math.max(0, n));
  if (STEPS[i].kind === 'practice') pr = {n: 0, show: false};
  render();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.classList.contains('ghost')) return;
  if (b.id === 'listen') listen();
  if (b.id === 'cover') videoClick();
  if (b.id === 'slow'){ slow = !slow; b.setAttribute('aria-pressed', slow); if (ready && state === 'playing') player.setPlaybackRate(slow ? slowRate : 1); }
  if (b.id === 'back') go(i - 1);
  if (b.id === 'skip') go(+b.dataset.to);
  if (b.id === 'next'){
    if (STEPS[i].kind === 'practice'){ clearInterval(timer); if (ready) player.pauseVideo(); state = 'idle'; clip = null; pr = {n: pr.n + 1, show: false}; render(); }
    else go(i + 1);
  }
  if (b.classList.contains('add')){
    const s = STEPS[i], en = b.dataset.en, k = dict.findIndex((d) => d.en === en);
    if (k > -1) dict.splice(k, 1);
    else dict.push({en, ex: s.ex, hl: s.hl, start: s.start, end: s.end});
    saveDict(); render();
  }
  if (b.id === 'reveal'){ pr.show = true; render(); }
  if (b.id === 'noteBtn'){ const t = $('noteText'); t.hidden = !t.hidden; b.setAttribute('aria-expanded', String(!t.hidden)); }
  if (b.id === 'restart'){ pr = {n: 0, show: false}; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === ' '){ e.preventDefault(); videoClick(); }
  if (e.key === 'ArrowRight' && !$('next').classList.contains('ghost')) $('next').click();
  if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
  // Lyrics out of time with the video? [ and ] move them by half a second (remembered in this browser).
  if (e.key === '[' || e.key === ']'){
    off = Math.round((off + (e.key === ']' ? .5 : -.5)) * 10) / 10;
    try { localStorage.setItem('human-offset', String(off)); } catch (err) {}
  }
});

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {videoId: VIDEO,
    playerVars: {controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, rel: 0, playsinline: 1, cc_load_policy: 0, modestbranding: 1},
    events: {
      onReady: () => { ready = true; },
      onStateChange: (e) => {
        if (e.data !== 1) return;
        // Speed can only be set while the video plays; hide the button if this video has no slower speed.
        const rates = player.getAvailablePlaybackRates ? player.getAvailablePlaybackRates() : [1];
        slowRate = rates.includes(0.75) ? 0.75 : (rates.includes(0.5) ? 0.5 : 1);
        if (slowRate === 1){ slow = false; $('slow').classList.add('ghost'); }
        player.setPlaybackRate(slow ? slowRate : 1);
      }
    }});
};
render();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
