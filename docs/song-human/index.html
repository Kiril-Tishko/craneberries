<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Human, Line by Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout: video on the left (top on phones), one step card beside it; nothing scrolls. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#141B24; --muted:#56606C; --line:#D5DBE2;
  --accent:#C2410C; --accent-ink:#FFFFFF; --soft:#FCE9DE; --ua:#5B4A0E; --ua-bg:#FFF2C6;
  --font:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F141A; --surface:#18202A; --ink:#E8EDF2; --muted:#9AA6B3; --line:#2A3542;
  --accent:#FB8A4C; --accent-ink:#0F141A; --soft:#3A2418; --ua:#F4DD8A; --ua-bg:#3A3214; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:1200px;margin:0 auto;height:100%;display:grid;gap:16px;grid-template-rows:auto 1fr}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:600;font-size:.7em}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--accent);width:22px}
.dots i.whole{outline:2px solid var(--muted);outline-offset:1px}
main{display:grid;gap:16px;min-height:0;grid-template-columns:1.25fr 1fr;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.video{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;width:100%;max-width:100%}
.video iframe,.video #player{width:100%;height:100%;display:block;border:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tag{align-self:flex-start;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--soft);padding:5px 10px;border-radius:99px}
.words{display:flex;flex-direction:column;gap:10px}
.w{display:flex;flex-direction:column;gap:4px}
.w b{font-size:clamp(28px,4.2vw,44px);font-weight:800;line-height:1.1;text-wrap:balance}
.w .ua{align-self:flex-start;font-size:clamp(17px,2.2vw,21px);font-weight:600;color:var(--ua);background:var(--ua-bg);padding:4px 12px;border-radius:12px}
.ex{color:var(--muted);font-size:17px;line-height:1.4}
.ex em{font-style:normal;color:var(--ink);font-weight:600}
.hint{color:var(--muted);font-size:15px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-size:16px;font-weight:600}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:19px;padding:12px 22px}
button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto}
.sync{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.sync button{padding:2px 9px;font-size:13px;border-radius:8px}
.time{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Human <span>Rag’n’Bone Man · first 2 parts</span></h1>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </header>
  <main>
    <div>
      <div class="video"><div id="player"></div></div>
      <div class="sync" style="margin-top:8px">Timing <button id="minus" aria-label="Earlier">−</button><span class="time" id="off">0.0 s</span><button id="plus" aria-label="Later">+</button></div>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>
<script>
const VIDEO = 'L3wKzyIN1yk';
// Line timings (seconds) from the song's synced lyrics. The page shows only key words, never the lyrics.
const STEPS = [
  {tag:'Part 1 · line 1', words:[['I’m only human','я лише людина']], ex:'Everyone makes mistakes. <em>We’re only human.</em>', start:2.4, end:12.9},
  {tag:'Part 1 · line 2', words:[['foolish','дурний, нерозумний']], ex:'That was a <em>foolish</em> idea.', start:13.1, end:15.3},
  {tag:'Part 1 · line 3', words:[['blind','сліпий; тут: не бачу правди']], ex:'Love is <em>blind</em>.', start:15.2, end:16.8},
  {tag:'Part 1 · line 4', words:[['see through','бачити наскрізь'],['behind','за, позаду']], ex:'I can <em>see through</em> his excuses.', start:16.7, end:20.1},
  {tag:'Part 1 · line 5', words:[['no way to','немає як'],['prove','довести']], ex:'Can you <em>prove</em> it?', start:20.0, end:24.5},
  {tag:'Part 1 · all together', whole:true, start:0, end:24.5},
  {tag:'Part 2 · line 1', words:[['after all','зрештою, усе-таки']], ex:'Don’t be angry with him. He’s only a kid, <em>after all</em>.', start:24.5, end:30.7},
  {tag:'Part 2 · line 2', words:[['put the blame on (someone)','звинувачувати (когось)']], ex:'Don’t <em>put the blame on</em> me. It wasn’t my fault.', start:30.7, end:37.6},
  {tag:'Part 2 · all together', whole:true, start:24.5, end:37.6}
];
let i = 0, player = null, ready = false, timer = null, slow = false, off = 0;
try { off = parseFloat(localStorage.getItem('human-offset') || '0') || 0; } catch (e) {}
const $ = (id) => document.getElementById(id);
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function render(){
  const s = STEPS[i];
  $('dots').innerHTML = STEPS.map((x, n) => `<i class="${n === i ? 'on' : ''} ${x.whole ? 'whole' : ''}"></i>`).join('');
  $('off').textContent = `${off > 0 ? '+' : ''}${off.toFixed(1)} s`;
  $('card').innerHTML = `
    <span class="tag">${s.tag}</span>
    ${s.whole ? `<div class="w"><b>Now listen to the whole part</b></div>
      <p class="hint">${fmt(s.start)} – ${fmt(s.end)}. Can you catch every word?</p>`
    : `<div class="words">${s.words.map(([en, ua]) => `<div class="w"><b>${en}</b><span class="ua">${ua}</span></div>`).join('')}</div>
      <p class="ex">${s.ex}</p>
      <p class="hint">Listen for ${s.words.length > 1 ? 'these words' : 'this'} in the song 👂</p>`}
    <div class="ctrl">
      <button class="play" id="play">▶ Listen</button>
      <button id="again">↺ Again</button>
      <button id="slow" aria-pressed="${slow}">🐢 Slower</button>
    </div>
    <div class="nav">
      <button id="back" ${i === 0 ? 'disabled' : ''}>← Back</button>
      <button id="next" ${i === STEPS.length - 1 ? 'disabled' : ''}>Next →</button>
    </div>`;
}
function playStep(){
  if (!ready) return;
  const s = STEPS[i];
  clearInterval(timer);
  player.setPlaybackRate(slow ? 0.75 : 1);
  player.seekTo(Math.max(0, s.start + off), true);
  player.playVideo();
  timer = setInterval(() => {
    if (player.getCurrentTime() >= s.end + off){ player.pauseVideo(); clearInterval(timer); }
  }, 100);
}
function go(d){ i = Math.min(STEPS.length - 1, Math.max(0, i + d)); clearInterval(timer); if (ready) player.pauseVideo(); render(); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'play' || b.id === 'again') playStep();
  if (b.id === 'slow'){ slow = !slow; render(); }
  if (b.id === 'next') go(1);
  if (b.id === 'back') go(-1);
  if (b.id === 'minus' || b.id === 'plus'){
    off = Math.round((off + (b.id === 'plus' ? .5 : -.5)) * 10) / 10;
    try { localStorage.setItem('human-offset', String(off)); } catch (err) {}
    render();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === ' '){ e.preventDefault(); playStep(); }
});
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {videoId: VIDEO,
    playerVars: {rel: 0, cc_load_policy: 1, playsinline: 1, modestbranding: 1},
    events: {onReady: () => { ready = true; }}});
};
render();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
