<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Human, Line by Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout: video + the line under it on the left (top on phones); the words and the buttons on the right. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#141B24; --muted:#56606C; --line:#D5DBE2;
  --accent:#C2410C; --accent-ink:#FFFFFF; --soft:#FCE9DE; --ua:#5B4A0E; --ua-bg:#FFF2C6;
  --font:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F141A; --surface:#18202A; --ink:#E8EDF2; --muted:#9AA6B3; --line:#2A3542;
  --accent:#FB8A4C; --accent-ink:#0F141A; --soft:#3A2418; --ua:#F4DD8A; --ua-bg:#3A3214; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:1200px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800}
h1 span{color:var(--muted);font-weight:600;font-size:.7em}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:99px;background:var(--line)}
.dots i.done{background:var(--muted)}
.dots i.on{background:var(--accent);width:22px}
main{display:grid;gap:16px;grid-template-columns:1.25fr 1fr;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.video{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;width:100%;max-width:100%}
.video iframe,.video #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;border:0;border-radius:0;padding:0;background:rgba(10,12,16,.82);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.cover span{width:84px;height:84px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:34px;padding-left:6px}
.cover.playing{background:transparent}
.cover.playing span{display:none}
.subs{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-height:86px;
  display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center}
.subs p{margin:0;font-size:clamp(20px,2.5vw,26px);font-weight:600;line-height:1.3}
.subs.many p{font-size:clamp(16px,1.8vw,19px)}
.subs.cols{display:block;column-count:2;column-gap:24px;text-align:left}
.subs.cols p{break-inside:avoid;margin-bottom:4px}
@media (max-width:520px){.subs.cols{column-count:1}}
.subs .note{color:var(--muted);font-size:22px;font-weight:400}
.subs mark{background:var(--ua-bg);color:var(--ua);border-radius:6px;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.words{display:flex;flex-direction:column;gap:12px}
.w{display:flex;flex-direction:column;gap:5px}
.w b{font-size:clamp(28px,4.2vw,44px);font-weight:800;line-height:1.1;text-wrap:balance}
.w .ua{align-self:flex-start;font-size:clamp(17px,2.2vw,21px);font-weight:600;color:var(--ua);background:var(--ua-bg);padding:4px 12px;border-radius:12px}
.ex{margin:0;color:var(--muted);font-size:17px;line-height:1.4}
.ex em{font-style:normal;color:var(--ink);font-weight:600}
.big{font-size:clamp(26px,3.4vw,36px);font-weight:800;line-height:1.15;margin:0}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-size:16px;font-weight:600}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:20px;padding:13px 24px}
button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tiny{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 6px}
.sync{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);justify-content:flex-end;margin-top:6px}
.sync button{padding:2px 9px;font-size:13px;border-radius:8px}
.time{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.primary{transition:transform .1s}.primary:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Human <span>Rag’n’Bone Man</span></h1>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </header>
  <main>
    <div>
      <div class="video"><div id="player"></div><button class="cover" id="cover" aria-label="Listen"><span>▶</span></button></div>
      <div class="subs" id="subs" aria-live="polite"></div>
      <div class="sync" id="syncrow" hidden>Lyrics timing <button id="minus" aria-label="Earlier">−</button><span class="time" id="off">0.0 s</span><button id="plus" aria-label="Later">+</button></div>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>
<script>
const VIDEO = 'L3wKzyIN1yk';
const LYRICS_URL = 'https://lrclib.net/api/get/7918608';
// Line timings in seconds (from the song's synced lyrics). The lyrics themselves load live; they are not stored here.
const STEPS = [
  {words:[['I’m only human','я лише людина']], ex:'Everyone makes mistakes. <em>We’re only human.</em>', start:2.4, end:12.9},
  {words:[['foolish','дурний, нерозумний']], ex:'That was a <em>foolish</em> idea.', start:13.1, end:15.3},
  {words:[['blind','сліпий; тут: не бачу правди']], ex:'Love is <em>blind</em>.', start:15.2, end:16.8},
  {words:[['see through','бачити наскрізь'],['behind','за, позаду']], ex:'I can <em>see through</em> his excuses.', start:16.7, end:20.1},
  {words:[['no way to','немає як'],['prove','довести']], ex:'Can you <em>prove</em> it?', start:20.0, end:24.5},
  {whole:true, start:0, end:24.5},
  {words:[['after all','зрештою, усе-таки']], ex:'Don’t be angry with him. He’s only a kid, <em>after all</em>.', start:24.5, end:30.7},
  {words:[['put the blame on (someone)','звинувачувати (когось)']], ex:'Don’t <em>put the blame on</em> me. It wasn’t my fault.', start:30.7, end:37.6},
  {whole:true, start:24.5, end:37.6}
];
let i = 0, player = null, ready = false, timer = null, off = 0, playing = false;
let slow = false, slowRate = 0.75, slowOk = true;
const listened = STEPS.map(() => false);
let LINES = [], lyricsFailed = false;
try { off = parseFloat(localStorage.getItem('human-offset') || '0') || 0; } catch (e) {}
const $ = (id) => document.getElementById(id);
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Key words of a step; a whole-part step uses every key word of its part.
function keyWords(n){
  const s = STEPS[n];
  if (!s.whole) return s.words.map((w) => w[0]);
  return STEPS.filter((x) => !x.whole && x.start >= s.start - .5 && x.end <= s.end + .5).flatMap((x) => x.words.map((w) => w[0]));
}
function marked(text, words){
  let h = esc(text);
  words.forEach((en) => {
    const phrase = en.replace(/\(.*?\)/g, '').trim();
    const tries = [phrase].concat(phrase.split(/\s+/).filter((w) => w.length > 3));
    for (const w of tries){
      const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[’']/g, "[’']") + ')', 'i');
      if (re.test(h) && !/<mark>[^<]*$/.test(h.split(re)[0])){ h = h.replace(re, '<mark>$1</mark>'); break; }
    }
  });
  return h;
}
// The lines that belong to a step (shown after the clip stops, to look at).
function stepLines(n){
  const s = STEPS[n];
  return LINES.filter((l) => l.t >= s.start - .3 && l.t < s.end - .3);
}
function lineAt(t){ let k = -1; for (let n = 0; n < LINES.length; n++){ if (LINES[n].t <= t + .15) k = n; else break; } return k; }

fetch(LYRICS_URL).then((r) => r.json()).then((d) => {
  LINES = (d.syncedLyrics || '').split('\n').map((l) => {
    const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    return m ? {t: +m[1] * 60 + +m[2], text: m[3]} : null;
  }).filter((x) => x && x.text);
  drawSubs();
}).catch(() => { lyricsFailed = true; drawSubs(); });

function drawSubs(){
  const box = $('subs'); box.classList.remove('many', 'cols');
  if (lyricsFailed){ box.innerHTML = '<p class="note">The lyrics didn’t load. Reload the page.</p>'; return; }
  if (!listened[i] || !LINES.length){ box.innerHTML = '<p class="note">♪</p>'; return; }
  const words = keyWords(i);
  if (playing && ready){
    const k = lineAt(player.getCurrentTime() - off);
    box.innerHTML = `<p>${k >= 0 ? marked(LINES[k].text, words) : '♪'}</p>`;
    return;
  }
  const lines = stepLines(i);
  if (lines.length > 2) box.classList.add('many');
  if (lines.length > 4) box.classList.add('cols');
  box.innerHTML = lines.map((l) => `<p>${marked(l.text, words)}</p>`).join('') || '<p class="note">♪</p>';
}

function render(){
  const s = STEPS[i], heard = listened[i];
  $('dots').innerHTML = STEPS.map((x, n) => `<i class="${n === i ? 'on' : listened[n] ? 'done' : ''}"></i>`).join('');
  $('off').textContent = `${off > 0 ? '+' : ''}${off.toFixed(1)} s`;
  $('card').innerHTML = `
    ${s.whole ? `<p class="big">Now the whole part, without stopping</p>`
      : `<div class="words">${s.words.map(([en, ua]) => `<div class="w"><b>${en}</b><span class="ua">${ua}</span></div>`).join('')}</div>
         <p class="ex">${s.ex}</p>`}
    <div class="ctrl">
      <button id="play" class="${heard ? '' : 'primary'}">▶ ${heard ? 'Listen again' : 'Listen'}</button>
      ${slowOk ? `<button id="slow" aria-pressed="${slow}">🐢 Slower</button>` : ''}
    </div>
    <div class="nav">
      ${i > 0 ? '<button id="back" class="tiny">← Back</button>' : '<span></span>'}
      ${heard && i < STEPS.length - 1 ? '<button id="next" class="primary">Next →</button>' : ''}
      ${heard && i === STEPS.length - 1 ? '<span class="ex">That’s all for now 🎉</span>' : ''}
    </div>
    <button id="gear" class="tiny" style="align-self:flex-end">⚙ Lyrics timing</button>`;
  drawSubs();
}

function stop(){
  clearInterval(timer); playing = false;
  if (ready) player.pauseVideo();
  $('cover').classList.remove('playing');
  drawSubs();
}
function playStep(){
  if (!ready) return;
  const s = STEPS[i];
  clearInterval(timer);
  const first = !listened[i];
  listened[i] = true; playing = true;
  if (first) render();
  player.seekTo(Math.max(0, s.start + off), true);
  player.playVideo();
  $('cover').classList.add('playing');
  timer = setInterval(() => {
    drawSubs();
    if (player.getCurrentTime() >= s.end + off) stop();
  }, 150);
}
function go(d){
  stop();
  i = Math.min(STEPS.length - 1, Math.max(0, i + d));
  render();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'play') playStep();
  if (b.id === 'cover') playing ? stop() : playStep();
  if (b.id === 'slow'){ slow = !slow; if (ready && playing) player.setPlaybackRate(slow ? slowRate : 1); render(); }
  if (b.id === 'next') go(1);
  if (b.id === 'back') go(-1);
  if (b.id === 'gear') $('syncrow').hidden = !$('syncrow').hidden;
  if (b.id === 'minus' || b.id === 'plus'){
    off = Math.round((off + (b.id === 'plus' ? .5 : -.5)) * 10) / 10;
    try { localStorage.setItem('human-offset', String(off)); } catch (err) {}
    $('off').textContent = `${off > 0 ? '+' : ''}${off.toFixed(1)} s`;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === ' '){ e.preventDefault(); playing ? stop() : playStep(); }
  if (e.key === 'ArrowRight' && listened[i]) go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {videoId: VIDEO,
    playerVars: {controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, rel: 0, playsinline: 1, cc_load_policy: 0, modestbranding: 1},
    events: {
      onReady: () => { ready = true; },
      onStateChange: (e) => {
        if (e.data !== 1) return;
        // The speed can only be set once the video plays; hide the button if this video has no slower speed.
        const rates = player.getAvailablePlaybackRates ? player.getAvailablePlaybackRates() : [1];
        slowRate = rates.includes(0.75) ? 0.75 : (rates.includes(0.5) ? 0.5 : 1);
        if (slowRate === 1 && slowOk){ slowOk = false; slow = false; render(); }
        player.setPlaybackRate(slow ? slowRate : 1);
      }
    }});
};
render();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
