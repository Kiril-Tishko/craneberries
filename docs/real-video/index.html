<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real Video Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF1F4;--surface:#FFF;--soft:#F3F5F8;--ink:#141B24;--muted:#5D6773;--line:#D5DBE2;--accent:#C2410C;--accent-ink:#FFF;
  --ua:#5B4A0E;--ua-bg:#FFF2C6;--word:#FFE14D;--tint:#FDEDE4;--font:"Lexend","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F141A;--surface:#18202A;--soft:#202A36;--ink:#E8EDF2;--muted:#9AA6B3;--line:#2A3542;
  --accent:#FB8A4C;--accent-ink:#0F141A;--ua:#F4DD8A;--ua-bg:#3A3214;--tint:#3A2618;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
button{font-family:var(--font);color:inherit;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;flex:none;fill:currentColor}
.app{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words button{font-weight:600;font-size:16px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.words button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* The whole library: a row of topics (scrolls sideways on a phone), then that topic's words (app.js renderChips). */
.words.shelf{display:block;min-width:0}
.top{min-width:0}
.top .words.shelf{flex:1 1 0}
.top .words.shelf~.search{align-self:flex-start;margin-top:4px}
.gtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;margin:0 -2px 10px;border-bottom:1px solid var(--line)}
.gtabs::-webkit-scrollbar{display:none}
@media (min-width:561px){.gtabs{flex-wrap:wrap;overflow:visible}}
/* A phone: topics and words each scroll sideways in one row (a soft fade says there is more), so the video stays near the top. */
@media (max-width:560px){
  .gtabs,.gwords{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .words .gwords{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 24px 2px 2px;margin:0 -2px}
  .words .gwords::-webkit-scrollbar{display:none}
  .words .gwords button{flex:none;white-space:nowrap}
}
.words .gtabs button{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:15px;padding:8px 13px 8px 11px;border-radius:12px;
  border:1px solid transparent;background:transparent;color:var(--muted);white-space:nowrap}
.words .gtabs button:hover{background:var(--soft);color:var(--ink)}
.words .gtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gtabs span{font-size:17px;line-height:1}
.gtabs small{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 7px}
.gtabs [aria-selected="true"] small{background:var(--tint);color:var(--accent)}
.gwords{display:flex;gap:8px;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:16px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}

/* The player: video, then timeline, caption and the controls, all in one panel. */
.player{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.video{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.side{display:none}
/* The player is taller than the box: the picture keeps its full size in the middle, and YouTube's title (top)
   and "Watch on YouTube" bar (bottom) land in black margins that the box cuts off. */
.video iframe{position:absolute;left:0;top:-40%;width:100%;height:180%;border:0;opacity:0}
/* Two players lie on top of each other; only the one in use is seen, the other preloads the next clip. */
.video iframe.on{opacity:1}
/* Our cover sits on the video all the time, so no YouTube buttons ever show. Before a clip starts it darkens the
   picture; once started, a pause only dims it a little. Tap = play/pause, double-tap a side = 1 s back/forward. */
.cover{position:absolute;inset:0;border:0;padding:0;background:rgba(10,12,16,.86);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.cover .big{width:78px;height:78px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.cover .big svg{width:34px;height:34px;margin-left:4px}
.cover.dim{background:rgba(10,12,16,.25)}
.cover.dim .big{width:60px;height:60px;opacity:.92}
.cover.dim .big svg{width:26px;height:26px}
.cover.playing{background:transparent}
.cover.playing .big{display:none}
.flash{position:absolute;top:50%;transform:translateY(-50%);padding:8px 14px;border-radius:99px;background:rgba(10,12,16,.6);color:#fff;
  font-weight:600;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}
.flash.l{left:6%}.flash.r{right:6%}
.flash.on{opacity:1;transition:none}

.bar{display:flex;align-items:center;gap:12px;padding:10px 14px 2px}
.pp{width:38px;height:38px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pp svg{width:18px;height:18px}
.tlhit{flex:1;padding:10px 0;cursor:pointer;touch-action:none}
.tl{position:relative;height:6px;border-radius:99px;background:var(--line)}
.tl-word{position:absolute;top:0;bottom:0;background:var(--word);border-radius:99px}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px;opacity:.8}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:99px;background:var(--accent);border:2px solid var(--surface)}
/* Fixed width, so the timeline doesn't move when 9.9 s becomes 10.0 s. */
.tltime{flex:none;width:12.5ch;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.capbar{min-height:60px;display:flex;align-items:center;justify-content:center;padding:4px 16px 10px;
  font-size:clamp(17px,2.2vw,22px);font-weight:600;text-align:center;line-height:1.3}
.capbar mark{background:var(--word);color:#141B24;border-radius:4px;padding:0 3px}

.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--soft);border-top:1px solid var(--line)}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}
/* Pressed and held: "With context" stays on for the next clips (a small dot). */
.mode{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mode.held::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:99px;background:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:10px 18px;gap:4px}
.primary svg{width:20px;height:20px;margin-right:-4px}
.back{padding:9px}
.count{color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font-weight:600;font-size:14px;padding:7px 10px;border:0;background:transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.capbar .err{color:var(--muted);font-size:16px}
/* Subtitles hidden (the CC button, or ?listen): the line is there but blurred, like a censored bit of film, so
   nothing moves; a tap on it (or on the eye) shows it. */
.capbar{position:relative}
.capbar.cens{cursor:pointer}
.capbar.cens>span{filter:blur(7px);opacity:.75;user-select:none;-webkit-user-select:none;pointer-events:none}
.capbar .peek{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.capbar .peek svg{width:20px;height:20px}
.capbar.cens:hover .peek{color:var(--accent);border-color:var(--accent)}
/* CC beside the timeline: hide or show the subtitles (a slash while they are hidden). */
.ccb{--ccbg:var(--surface);width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--ccbg);color:var(--muted);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none}
.ccb svg{width:22px;height:22px}
.ccb:hover{color:var(--accent)}
.ccb[aria-pressed="true"]{--ccbg:var(--tint);color:var(--accent);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;align-content:start}
@media (max-width:820px){.card{padding:14px;gap:8px}}
.pic{font-size:52px;line-height:1}
.en{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.15}
.uaw{justify-self:start;background:var(--ua-bg);color:var(--ua);padding:4px 12px;border-radius:10px;font-weight:600;font-size:18px}
/* 💡 note: hidden until tapped; its space is kept so nothing jumps. */
.tip{display:grid;gap:8px;justify-items:start;margin-top:4px}
.tip .btn{border-style:dashed}
.note{margin:0;font-size:16px;line-height:1.45}
.note.off{visibility:hidden}
.foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.foot button{border:0;background:transparent;color:var(--muted);opacity:.45;font-size:15px;padding:2px 4px;cursor:pointer}
.foot button:hover,.foot button[aria-expanded="true"]{opacity:1}
.foot a{color:var(--muted)}

/* Top row: back to the lesson, the lesson's words, the search. */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.top .words{flex:1 1 auto}
.ltitle{font-weight:800;font-size:16px;margin-right:4px}
#back{padding:7px 12px 7px 8px}
.search{position:relative;flex:0 1 220px;min-width:160px}
.search input{width:100%;font:500 15px var(--font);color:var(--ink);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
#sugg{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:100%;width:max-content;max-width:min(360px,90vw);margin:0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#sugg button{display:block;width:100%;text-align:left;font-size:15px;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer}
#sugg button:hover{background:var(--soft)}
#sugg span{color:var(--muted);font-size:13px}
#sugg .none{padding:8px 10px;color:var(--muted);font-size:14px}
@media (max-width:560px){.search{flex:1 1 100%}}

/* ?embed: inside a lesson slide on the student site. No heading (the lesson's screen before it shows the word): the
   video as big as the slide allows, then the timeline, the caption and one row of buttons, all of it in view (app.js
   fitEmbed sets --vw, the video's width; the caption and the buttons keep the slide's width, so their height never
   depends on the video's). It takes the lesson's own look (tools/lesson-page/engine.html): its colors, rounded
   buttons, progress dots, no box inside the lesson's card. "Next clip" is a soft button, so it doesn't compete with
   the lesson's own Next. */
body.embed{padding:0;background:transparent;height:100vh;display:flex;flex-direction:column;justify-content:center}
body.embed:not(.editing){overflow:hidden}
body.embed.editing{height:auto}
body.embed .search,body.embed #back,body.embed .ltitle,body.embed main>.card{display:none!important}
body.embed.one .top{display:none}
body.embed .app{gap:8px;max-width:none;width:100%;margin:0}
body.embed .words{justify-content:center}
body.embed main{display:block;width:100%}
body.embed{--bg:#EDF2F0;--surface:#FFFFFF;--soft:#F4F8F6;--ink:#10241F;--muted:#4F635D;--line:#D2DDD9;--accent:#1E6B58;
  --accent-ink:#FFFFFF;--tint:#DCEFE8;--mark:#FBE1EC;--mark-ink:#C42A6B;--ua:#6B5A12;--ua-bg:#FFF4C9}
@media (prefers-color-scheme:dark){body.embed{--bg:#0E1916;--surface:#16241F;--soft:#1B2B25;--ink:#E6F1ED;--muted:#9DB3AB;--line:#2A3B35;
  --accent:#6FD1B4;--accent-ink:#0E1916;--tint:#163A31;--mark:#3B1B2A;--mark-ink:#FF8DBB;--ua:#F3DC85;--ua-bg:#3A3212}}
body.embed .player{border:0;border-radius:0;background:transparent;overflow:visible;display:flex;flex-direction:column;align-items:center}
body.embed .vrow{position:relative;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
body.embed .video{width:var(--vw,100%);max-width:100%;border-radius:18px;flex:none}
/* The clip arrows: big round buttons beside the video (app.js fitEmbed leaves them their room). No arrow back on the
   first clip, none forward on the last: the lesson's own Next goes on from there. */
body.embed .side{display:flex;flex:none;width:46px;height:46px;border-radius:99px;align-items:center;justify-content:center;padding:0;
  border:2px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;transition:border-color .15s,opacity .15s}
body.embed .side svg{width:26px;height:26px}
body.embed .side:hover{border-color:var(--accent)}
body.embed .side:disabled{opacity:0;pointer-events:none}
body.embed.single .side{display:none}
/* No room beside the video (a narrow or a low screen, app.js 'ovl'): the arrows sit on its edges, white, so the video
   keeps its size. */
body.embed.ovl .vrow{width:auto;align-self:center}
body.embed.ovl .side{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;border:0;
  background:rgba(255,255,255,.92);color:#1E6B58;box-shadow:0 2px 10px rgba(0,0,0,.3)}
body.embed.ovl .side.l{left:6px}
body.embed.ovl .side.r{right:6px}
body.embed.ovl .side svg{width:24px;height:24px}
/* A low, wide screen (a phone on its side, app.js 'short'): on the left the video, its timeline and the speed under
   it (his choice, Nov 19); beside them the caption, "With context" and the dots. Everything stays in view. */
body.embed.short .player{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:14px;align-items:center}
body.embed.short .tools,body.embed.short .group{display:contents}
body.embed.short .vrow{grid-column:1;grid-row:1}
body.embed.short .bar{grid-column:1;grid-row:2;width:max(var(--vw),330px)}
body.embed.short .vrow{justify-self:center}
body.embed.short #speed{grid-column:1;grid-row:3;justify-self:center;margin-top:4px}
body.embed.short .capbar{grid-column:2;grid-row:1;width:auto;align-self:end}
body.embed.short .lt{grid-column:2;grid-row:2;justify-self:center;margin-top:8px}
body.embed.short .nav{grid-column:2;grid-row:3;justify-self:center;margin:4px 0 0}
body.embed.short .etools{grid-column:1/3;grid-row:4}
body.embed .etools{width:100%}
body.embed .bar{width:max(var(--vw,100%),min(100%,440px));max-width:100%;padding:10px 2px 0}
body.embed .tl{height:6px;background:var(--line)}
body.embed .cover{background:rgba(16,36,31,.9)}
body.embed .cover.dim{background:rgba(16,36,31,.25)}
body.embed .cover.playing{background:transparent}
body.embed .capbar{width:min(100%,760px);min-height:48px;padding:6px 8px;font-size:clamp(18px,2.6vw,23px)}
body.embed .capbar mark{background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:0 4px}
body.embed .ccb{border-width:2px;border-radius:12px}
body.embed .tools{width:100%;background:transparent;border-top:0;padding:4px 0 2px;gap:8px 10px;justify-content:center}
body.embed .group{justify-content:center}
body.embed .nav{margin-left:0}
body.embed .btn{border:2px solid var(--line);border-radius:14px;padding:8px 14px;background:var(--surface);transition:border-color .15s}
body.embed .btn:hover{border-color:var(--accent)}
body.embed .mode[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}
body.embed .seg{border:2px solid var(--line);border-radius:14px}
body.embed .seg button{padding:7px 11px}
body.embed .seg button+button{border-left:2px solid var(--line)}
body.embed .seg button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}
body.embed .primary{background:var(--tint);color:var(--accent);border-color:var(--tint);font-size:16px;padding:8px 16px}
body.embed .primary:hover{border-color:var(--accent)}
body.embed .back{padding:8px 10px}
@media (max-width:340px){body.embed .btn{padding:8px 10px}body.embed .seg button{padding:7px 8px}body.embed .primary{padding:8px 12px}}
body.embed .count,body.embed #prev,body.embed #next{display:none}
body.embed .cdots{display:flex}
body.embed .cdots i{cursor:pointer;position:relative}
body.embed .cdots i::after{content:"";position:absolute;inset:-8px -3px}
.cdots{display:none;gap:5px;align-items:center;margin-right:4px}
.cdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.cdots i.on{background:var(--accent);width:20px;border-radius:99px}
/* 💡 What's happening? (inside a lesson, Nov 20): the clip's note opens over the video, so nothing moves; a tap on
   it or on 💡 closes it, and so does the next clip. Clips without a note keep the button's place, empty. */
.lt{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.tipe{display:none}
body.embed .tipe{display:inline-flex}
.tipe .tl2{margin-left:2px}
@media (max-width:440px){body.embed .tipe .tl2{display:none}}
body.embed .tipe[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.tipnote{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;max-height:calc(100% - 20px);overflow:auto;padding:12px 16px;
  border-radius:14px;background:rgba(16,36,31,.9);color:#fff;font-size:clamp(15px,2.4vw,18px);font-weight:500;line-height:1.4;
  text-align:left;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
/* A low screen (a phone on its side): the video is small, so the note opens across the bottom of the screen. */
body.embed.short .tipe .tl2{display:none}
body.embed.short .tipnote{position:fixed;left:8px;right:8px;bottom:8px;max-height:calc(100% - 16px)}
/* The ⓘ takes no row of its own: it sits in the bottom corner, its links open above it. */
body.embed .foot{position:fixed;right:2px;bottom:2px;z-index:5}
body.embed #credits{position:absolute;right:0;bottom:calc(100% + 4px);width:min(300px,80vw);padding:8px 10px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);line-height:1.4}
body.embed.editing .foot{position:static}
/* The invisible corner for edit mode. */
.corner{position:fixed;left:0;top:0;width:44px;height:44px;border:0;padding:0;background:transparent;z-index:30;cursor:default}
body.editing .corner{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,transparent 4px 8px);opacity:.35}
/* Edit mode: click any dashed text (the caption, the word, its Ukrainian, its emoji, the note) and type. */
body.editing [contenteditable]{outline:1.5px dashed var(--accent);outline-offset:3px;border-radius:6px;cursor:text;min-width:2ch}
body.editing [contenteditable]:focus{outline-style:solid}
body.editing [contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
body.editing .capbar [contenteditable]{display:inline-block;padding:0 4px}
/* The small bar under the video: where the line starts and ends, hide, save. */
.etools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;background:var(--tint);border-bottom:1px solid var(--line);font-size:13px}
.etime{display:inline-flex;align-items:center;gap:3px}
.etime .lbl{font-weight:700;color:var(--muted);margin-right:3px}
.etime button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;padding:0}
.etime input{width:84px;font:600 14px var(--font);font-variant-numeric:tabular-nums;color:var(--ink);padding:5px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:center;-moz-appearance:textfield;appearance:textfield}
.etime input::-webkit-inner-spin-button,.etime input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.etools .btn{font-size:14px;padding:6px 10px}
.etools .primary{font-size:14px;padding:6px 12px}
.etools .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.etools .right{margin-left:auto;display:inline-flex;gap:6px}
.etools .msg{flex:1 1 100%;color:var(--muted);font-size:13px;min-height:0}
.etools .msg:empty{display:none}
.etools .msg.bad{color:var(--accent);font-weight:600}
/* No GitHub key on this site yet: its box comes first in the bar (edit.js keyRow). */
.ekey{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ekey label{display:grid;gap:4px;flex:1 1 220px;font-weight:700;color:var(--ink)}
.ekey input{font:500 15px var(--font);color:var(--ink);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%}
.ekey .hint{flex:1 1 100%;color:var(--muted)}
.ekey a{color:var(--accent)}
/* The rest of edit mode (⋯): move, delete, add a clip, lines around, highlight, GitHub key. */
.edit{background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:16px;display:grid;gap:12px}
.edit h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edit .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edit label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);flex:1 1 160px}
.edit input,.edit textarea{font:500 15px var(--font);color:var(--ink);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:100%}
.edit textarea{min-height:60px;resize:vertical}
.edit .num{flex:0 0 110px}
.edit .btn{font-size:14px;padding:6px 10px}
.edit .msg{font-size:13px;color:var(--muted)}
.edit .msg.bad{color:var(--accent);font-weight:600}
.edit .hidden-tag{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 6px;color:var(--muted)}
/* ↻ make again (../video/remake.js): edit mode only. */
.rmk-btn{font-family:inherit;font-size:14px;font-weight:700;width:28px;height:28px;padding:0;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;align-self:center}
.rmk-btn:hover{color:var(--accent);border-color:var(--accent)}
/* Tap a word under the video: its Ukrainian, or why a grammar word is there (one word; a set phrase or the yellow word stays whole). */
.capbar .tw{cursor:pointer;border-radius:3px}
.capbar .tw:hover,.capbar .tw.on,.capbar .ph:hover,.capbar .ph.on{text-decoration:underline dotted var(--accent);text-underline-offset:4px}
.capbar mark:hover,.capbar mark.on{text-decoration:underline 2px currentColor;text-underline-offset:3px}
.capbar mark .tw:hover,.capbar .ph .tw:hover{text-decoration:none}
body.editing .capbar .tw{cursor:text}
/* The bubble: solid (not click-through), its text can be selected. */
.pop{position:fixed;z-index:40;transform:translate(-50%,-100%);background:#141B24;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:12px;
  padding:8px 14px;font-size:17px;font-weight:600;max-width:min(360px,92vw);text-align:center;user-select:text;-webkit-user-select:text;cursor:text;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pop b{font-weight:800}
.pop .pua{color:var(--word);margin-left:6px}
.pop.long{text-align:left;width:min(340px,92vw)}
.pop .why{display:block;margin-top:4px;font-size:15px;font-weight:500;line-height:1.4;color:var(--word)}
</style>
</head>

<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 5V2L7.5 6.5 12 11V8a5 5 0 1 1-5 5H4.5A7.5 7.5 0 1 0 12 5z"/></symbol>
  <symbol id="i-wide" viewBox="0 0 24 24"><path d="M7 7 2 12l5 5v-3.5h10V17l5-5-5-5v3.5H7z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m8.6 5.4 6.6 6.6-6.6 6.6L10 20l8-8-8-8z"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1z"/></symbol>
  <symbol id="i-ccoff" viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1z"/><path d="M2.6 2.6 21.4 21.4" fill="none" style="stroke:var(--ccbg)" stroke-width="4.4"/><path d="M2.6 2.6 21.4 21.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></symbol>
</svg>
<!-- 5 quick taps here open edit mode -->
<button class="corner" id="corner" tabindex="-1" aria-hidden="true"></button>
<div class="app">
  <header class="top">
    <button class="btn" id="back" hidden><svg><use href="#i-prev"/></svg>Lesson</button>
    <span class="ltitle" id="ltitle" hidden></span>
    <nav class="words" id="words"></nav>
    <div class="search"><input id="q" type="search" placeholder="Find a word…" autocomplete="off" aria-label="Find a word"><ul id="sugg" hidden></ul></div>
  </header>
  <main>
    <section class="player" aria-label="Video">
      <div class="vrow">
        <!-- Inside a lesson (?embed): the previous / next clip, beside the video (on a narrow screen, on its edges). -->
        <button class="side l" id="sprev" aria-label="Previous clip" title="Previous clip"><svg><use href="#i-prev"/></svg></button>
        <div class="video">
          <div id="yt0"></div><div id="yt1"></div>
          <button class="cover" id="cover" tabindex="-1" aria-label="Play"><span class="big"><svg><use id="bigicon" href="#i-play"/></svg></span></button>
          <div class="tipnote" id="tipnote" hidden></div>
          <div class="flash l" id="flashl">− 1 s</div><div class="flash r" id="flashr">+ 1 s</div>
        </div>
        <button class="side r" id="snext" aria-label="Next clip" title="Next clip"><svg><use href="#i-next"/></svg></button>
      </div>
      <!-- Edit mode only: the clip's times, hide, save (edit.js fills it). -->
      <div class="etools" id="etools" hidden></div>
      <div class="bar">
        <button class="pp" id="pp" aria-label="Play" title="Play / pause (Space)"><svg><use id="ppicon" href="#i-play"/></svg></button>
        <div class="tlhit" id="tlhit" title="Tap or drag to move"><div class="tl" id="tl"><div class="tl-word" id="tlword"></div><div class="tl-fill" id="tlfill"></div><div class="tl-dot" id="tldot"></div></div></div>
        <span class="tltime" id="tltime"></span>
        <button class="ccb" id="cc" aria-pressed="false" aria-label="Hide subtitles" title="Hide subtitles"><svg><use id="ccicon" href="#i-cc"/></svg></button>
      </div>
      <div class="capbar" id="capbar"></div>
      <div class="tools">
        <div class="group">
          <span class="lt"><button class="btn mode" id="longer" aria-pressed="false" title="Play the sentences before and after it too"><svg><use href="#i-wide"/></svg>With context</button><button class="btn tipe" id="tipe" aria-pressed="false" title="What’s happening?">💡<span class="tl2">What’s happening?</span></button></span>
          <div class="seg" id="speed" title="Speed"><button data-r="1" aria-pressed="true">1×</button><button data-r="0.75" aria-pressed="false">0.75×</button><button data-r="0.5" aria-pressed="false">0.5×</button></div>
        </div>
        <div class="nav">
          <span class="count" id="count"></span><span class="cdots" id="cdots" aria-hidden="true"></span>
          <button class="btn back" id="prev" aria-label="Previous clip" title="Previous clip"><svg><use href="#i-prev"/></svg></button>
          <button class="btn primary" id="next">Next clip<svg><use href="#i-next"/></svg></button>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="pic" id="pic" data-ph="🙂"></div>
      <div class="en" id="en" data-ph="Word"></div>
      <div class="uaw" id="ua" data-ph="Українською"></div>
      <div class="tip" id="tip">
        <button class="btn" id="tipbtn" aria-expanded="false">💡 What’s happening?</button>
        <p class="note off" id="note" data-ph="Add a note…"></p>
      </div>
    </section>
  </main>
  <section class="edit" id="edit" hidden></section>
  <div class="pop" id="pop" hidden></div>
  <!-- The YouTube player's rules want links to YouTube's Terms and Google's Privacy Policy: they stay, behind a quiet ⓘ. -->
  <footer class="foot"><button id="about" aria-expanded="false" aria-label="About these clips" title="About these clips">ⓘ</button>
    <span id="credits" hidden>Clips found with <a href="https://captionsearch.app" target="_blank" rel="noopener">Caption Search</a> and <a href="https://youglish.com" target="_blank" rel="noopener">YouGlish.com</a>, song lyrics from <a href="https://lrclib.net" target="_blank" rel="noopener">lrclib.net</a>, played from YouTube (<a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>).</span></footer>
</div>
