<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real Video Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF1F4;--surface:#FFF;--ink:#141B24;--muted:#5D6773;--line:#D5DBE2;--accent:#C2410C;--accent-ink:#FFF;
  --ua:#5B4A0E;--ua-bg:#FFF2C6;--font:"Lexend","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F141A;--surface:#18202A;--ink:#E8EDF2;--muted:#9AA6B3;--line:#2A3542;
  --accent:#FB8A4C;--accent-ink:#0F141A;--ua:#F4DD8A;--ua-bg:#3A3214;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.app{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words button{font:600 16px var(--font);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.words button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{display:grid;grid-template-columns:650px minmax(260px,1fr);gap:16px;align-items:start}
@media (max-width:990px){main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.card{order:-1;padding:14px;gap:6px}.pic{font-size:40px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;align-content:start}
.pic{font-size:56px;line-height:1}
.en{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.15}
.uaw{justify-self:start;background:var(--ua-bg);color:var(--ua);padding:4px 12px;border-radius:10px;font-weight:600;font-size:18px}
.count{color:var(--muted);font-size:14px;font-weight:600;min-height:20px}
.yg{justify-self:center;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;width:648px;height:345px;max-width:100%}
.yg.small{width:356px;height:248px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls button{font:600 17px var(--font);padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.controls .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls button[aria-pressed="true"]{outline:3px solid var(--accent)}
.foot{color:var(--muted);font-size:13px}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <nav class="words" id="words"></nav>
  <main>
    <div class="yg"></div>
    <section class="card">
      <div class="pic" id="pic"></div>
      <div class="en" id="en"></div>
      <div class="uaw" id="ua"></div>
      <div class="count" id="count"></div>
      <div class="controls">
        <button class="primary" id="again">▶ Again</button>
        <button id="next">Another clip →</button>
        <button id="slow" aria-pressed="false">🐢 Slower</button>
      </div>
    </section>
  </main>
  <p class="foot">Clips: Powered by <a href="https://youglish.com" target="_blank" rel="noopener">YouGlish.com</a>, American English, from YouTube (<a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>).</p>
</div>
<script>
// Clips are picked before the lesson: each word lists YouGlish caption ids (only the ids, never the text).
// The page opens exactly that clip, plays the sentence and stops a moment after the word's line ends.
// To pick clips for new words: tools/real-video/ (reads the candidate lines, Claude chooses).
// A word with no picks falls back to a live YouGlish search: …/real-video/#q=rip-off&ua=грабіж
const WORDS = [
  {en: 'rip-off', q: 'rip-off', ua: 'грабіж, завищена ціна', pic: '💸',
    clips: ['17228321', '123088445', '133581547', '27250096']},
  {en: 'mandatory', q: 'mandatory', ua: 'обов’язковий', pic: '📋',
    clips: ['89329271', '29991111', '5605650', '4600566', '66306018']},
  {en: 'Is that a thing?', q: 'is that a thing', ua: 'Таке буває? / Це щось відоме?', pic: '🤔',
    clips: ['66962891', '175099060', '76949621', '106707286', '80675520']},
  {en: 'excuse', q: 'excuse', ua: 'відмовка, виправдання', pic: '🙈',
    clips: ['130888690', '85209929', '171607674', '68564010', '69527378']},
];
const STOP_AFTER = 1200;   // ms to keep playing after the word's line ends
const $ = (id) => document.getElementById(id);
const h = new URLSearchParams(location.hash.slice(1));
if (h.get('q')) WORDS.unshift({en: h.get('q'), q: h.get('q'), ua: h.get('ua') || '', pic: h.get('pic') || '',
  clips: (h.get('clips') || '').split(',').filter(Boolean)});

let widget = null, ready = false, cur = 0, clipN = 0, slow = false, total = 0, track = 0, stopped = false, stopTimer = null, made = 0;
$('words').innerHTML = WORDS.map((w, i) => `<button data-i="${i}">${w.pic} ${w.en}</button>`).join('');
$('words').onclick = (e) => { const b = e.target.closest('button'); if (b) pick(+b.dataset.i); };

function pick(i){
  cur = i; clipN = 0; const w = WORDS[i];
  document.querySelectorAll('#words button').forEach((b, n) => b.setAttribute('aria-current', n === i));
  $('pic').textContent = w.pic; $('en').textContent = w.en; $('ua').textContent = w.ua; $('ua').hidden = !w.ua;
  load();
}

// A fresh widget for every clip: YouGlish opens a given clip id only when a widget is first created.
function load(){
  if (!ready) return;
  const w = WORDS[cur], id = w.clips[clipN];
  clearTimeout(stopTimer); stopped = false;
  const box = document.querySelector('.yg'), small = document.querySelector('main').clientWidth < 650;
  box.classList.toggle('small', small);
  // The box ends right under the sentence, so YouGlish's panel below it (an "AI coach" ad) stays out of sight.
  // Measured: width 648 → video 297 px; width 356 → video 200 px. No height given → the frame never scrolls.
  const slot = 'w' + (++made);
  box.innerHTML = `<div id="${slot}"></div>`;
  widget = new YG.Widget(slot, {
    width: small ? 356 : 648,
    components: 8,          // video + caption only
    autoStart: 1,
    captionSize: 24,
    events: {
      onFetchDone: (e) => { total = e.totalResult; show(); },
      onVideoChange: (e) => { track = e.trackNumber; if (slow) widget.setSpeed(0.75); },
      onCaptionChange: (e) => { (window.CAPS = window.CAPS || []).push(e.id); },   // for checks
      onCaptionConsumed: () => {
        if (stopped) return;
        stopped = true;
        const me = widget;
        stopTimer = setTimeout(() => me.pause(), STOP_AFTER / (slow ? 0.75 : 1));
      },
      onError: () => { show(); $('count').textContent += ' · did not load, tap “Another clip”'; }
    }
  });
  if (id) widget.fetch(w.q, 'english', 'us', id); else widget.fetch(w.q, 'english', 'us');
  show();
}
function show(){
  const w = WORDS[cur];
  $('count').textContent = w.clips.length ? `Clip ${clipN + 1} of ${w.clips.length}` : (total ? `Clip ${track || 1} of ${total}` : '');
}
window.onYouglishAPIReady = () => { ready = true; load(); };
const tag = document.createElement('script');
tag.src = 'https://youglish.com/public/emb/widget.js';
document.head.appendChild(tag);

$('again').onclick = () => { if (!widget) return; clearTimeout(stopTimer); stopped = false; widget.replay(); };
$('next').onclick = () => {
  const w = WORDS[cur];
  if (w.clips.length) { clipN = (clipN + 1) % w.clips.length; load(); }
  else if (widget) { clearTimeout(stopTimer); stopped = false; widget.next(); }
};
$('slow').onclick = () => {
  slow = !slow; $('slow').setAttribute('aria-pressed', slow);
  if (widget) widget.setSpeed(slow ? 0.75 : 1);
};
pick(0);
</script>
</body>
</html>
