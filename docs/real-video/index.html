<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real Video Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF1F4;--surface:#FFF;--soft:#F3F5F8;--ink:#141B24;--muted:#5D6773;--line:#D5DBE2;--accent:#C2410C;--accent-ink:#FFF;
  --ua:#5B4A0E;--ua-bg:#FFF2C6;--word:#FFE14D;--tint:#FDEDE4;--font:"Lexend","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F141A;--surface:#18202A;--soft:#202A36;--ink:#E8EDF2;--muted:#9AA6B3;--line:#2A3542;
  --accent:#FB8A4C;--accent-ink:#0F141A;--ua:#F4DD8A;--ua-bg:#3A3214;--tint:#3A2618;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
button{font-family:var(--font);color:inherit;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;flex:none;fill:currentColor}
.app{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words button{font-weight:600;font-size:16px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.words button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:16px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}

/* The player: video, then timeline, caption and the controls, all in one panel. */
.player{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.video{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
/* The player is taller than the box: the picture keeps its full size in the middle, and YouTube's title (top)
   and "Watch on YouTube" bar (bottom) land in black margins that the box cuts off. */
.video iframe{position:absolute;left:0;top:-30%;width:100%;height:160%;border:0;opacity:0}
/* Two players lie on top of each other; only the one in use is seen, the other preloads the next clip. */
.video iframe.on{opacity:1}
/* Our cover sits on the video all the time, so no YouTube buttons ever show. Before a clip starts it darkens the
   picture; once started, a pause only dims it a little. Tap = play/pause, double-tap a side = 1 s back/forward. */
.cover{position:absolute;inset:0;border:0;padding:0;background:rgba(10,12,16,.86);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.cover .big{width:78px;height:78px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.cover .big svg{width:34px;height:34px;margin-left:4px}
.cover.dim{background:rgba(10,12,16,.25)}
.cover.dim .big{width:60px;height:60px;opacity:.92}
.cover.dim .big svg{width:26px;height:26px}
.cover.playing{background:transparent}
.cover.playing .big{display:none}
.flash{position:absolute;top:50%;transform:translateY(-50%);padding:8px 14px;border-radius:99px;background:rgba(10,12,16,.6);color:#fff;
  font-weight:600;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}
.flash.l{left:6%}.flash.r{right:6%}
.flash.on{opacity:1;transition:none}

.bar{display:flex;align-items:center;gap:12px;padding:10px 14px 2px}
.pp{width:38px;height:38px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pp svg{width:18px;height:18px}
.tlhit{flex:1;padding:10px 0;cursor:pointer;touch-action:none}
.tl{position:relative;height:6px;border-radius:99px;background:var(--line)}
.tl-word{position:absolute;top:0;bottom:0;background:var(--word);border-radius:99px}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px;opacity:.8}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:99px;background:var(--accent);border:2px solid var(--surface)}
/* Fixed width, so the timeline doesn't move when 9.9 s becomes 10.0 s. */
.tltime{flex:none;width:12.5ch;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.capbar{min-height:60px;display:flex;align-items:center;justify-content:center;padding:4px 16px 10px;
  font-size:clamp(17px,2.2vw,22px);font-weight:600;text-align:center;line-height:1.3}
.capbar mark{background:var(--word);color:#141B24;border-radius:4px;padding:0 3px}

.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--soft);border-top:1px solid var(--line)}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:10px 18px;gap:4px}
.primary svg{width:20px;height:20px;margin-right:-4px}
.back{padding:9px}
.count{color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font-weight:600;font-size:14px;padding:7px 10px;border:0;background:transparent;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.capbar .err{color:var(--muted);font-size:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;align-content:start}
@media (max-width:820px){.card{padding:14px;gap:8px}}
.pic{font-size:52px;line-height:1}
.en{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.15}
.uaw{justify-self:start;background:var(--ua-bg);color:var(--ua);padding:4px 12px;border-radius:10px;font-weight:600;font-size:18px}
/* 💡 note: hidden until tapped; its space is kept so nothing jumps. */
.tip{display:grid;gap:8px;justify-items:start;margin-top:4px}
.tip .btn{border-style:dashed}
.note{margin:0;font-size:16px;line-height:1.45}
.note.off{visibility:hidden}
.foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.foot button{border:0;background:transparent;color:var(--muted);opacity:.45;font-size:15px;padding:2px 4px;cursor:pointer}
.foot button:hover,.foot button[aria-expanded="true"]{opacity:1}
.foot a{color:var(--muted)}

/* Top row: back to the lesson, the lesson's words, the search. */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.top .words{flex:1 1 auto}
.ltitle{font-weight:800;font-size:16px;margin-right:4px}
#back{padding:7px 12px 7px 8px}
.search{position:relative;flex:0 1 220px;min-width:160px}
.search input{width:100%;font:500 15px var(--font);color:var(--ink);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
#sugg{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:100%;width:max-content;max-width:min(360px,90vw);margin:0;padding:4px;list-style:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#sugg button{display:block;width:100%;text-align:left;font-size:15px;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer}
#sugg button:hover{background:var(--soft)}
#sugg span{color:var(--muted);font-size:13px}
#sugg .none{padding:8px 10px;color:var(--muted);font-size:14px}
@media (max-width:560px){.search{flex:1 1 100%}}
/* The invisible corner for edit mode. */
.corner{position:fixed;left:0;top:0;width:44px;height:44px;border:0;padding:0;background:transparent;z-index:30;cursor:default}
body.editing .corner{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,transparent 4px 8px);opacity:.35}
/* Edit mode panel (edit.js fills it). */
.edit{background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:16px;display:grid;gap:12px}
.edit h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edit .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edit label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);flex:1 1 160px}
.edit input,.edit textarea{font:500 15px var(--font);color:var(--ink);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:100%}
.edit textarea{min-height:60px;resize:vertical}
.edit .num{flex:0 0 110px}
.edit .btn{font-size:14px;padding:6px 10px}
.edit .msg{font-size:13px;color:var(--muted)}
.edit .msg.bad{color:var(--accent);font-weight:600}
.edit .hidden-tag{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 6px;color:var(--muted)}
</style>
</head>
<body>
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M12 5V2L7.5 6.5 12 11V8a5 5 0 1 1-5 5H4.5A7.5 7.5 0 1 0 12 5z"/></symbol>
  <symbol id="i-wide" viewBox="0 0 24 24"><path d="M7 7 2 12l5 5v-3.5h10V17l5-5-5-5v3.5H7z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m8.6 5.4 6.6 6.6-6.6 6.6L10 20l8-8-8-8z"/></symbol>
</svg>
<!-- 5 quick taps here open edit mode -->
<button class="corner" id="corner" tabindex="-1" aria-hidden="true"></button>
<div class="app">
  <header class="top">
    <button class="btn" id="back" hidden><svg><use href="#i-prev"/></svg>Lesson</button>
    <span class="ltitle" id="ltitle" hidden></span>
    <nav class="words" id="words"></nav>
    <div class="search"><input id="q" type="search" placeholder="Find a word…" autocomplete="off" aria-label="Find a word"><ul id="sugg" hidden></ul></div>
  </header>
  <main>
    <section class="player" aria-label="Video">
      <div class="video">
        <div id="yt0"></div><div id="yt1"></div>
        <button class="cover" id="cover" tabindex="-1" aria-label="Play"><span class="big"><svg><use id="bigicon" href="#i-play"/></svg></span></button>
        <div class="flash l" id="flashl">− 1 s</div><div class="flash r" id="flashr">+ 1 s</div>
      </div>
      <div class="bar">
        <button class="pp" id="pp" aria-label="Play" title="Play / pause (Space)"><svg><use id="ppicon" href="#i-play"/></svg></button>
        <div class="tlhit" id="tlhit" title="Tap or drag to move"><div class="tl" id="tl"><div class="tl-word" id="tlword"></div><div class="tl-fill" id="tlfill"></div><div class="tl-dot" id="tldot"></div></div></div>
        <span class="tltime" id="tltime"></span>
      </div>
      <div class="capbar" id="capbar"></div>
      <div class="tools">
        <div class="group">
          <button class="btn mode" id="longer" aria-pressed="false" title="Play the sentences before and after it too"><svg><use href="#i-wide"/></svg>With context</button>
          <div class="seg" id="speed" title="Speed"><button data-r="1" aria-pressed="true">1×</button><button data-r="0.75" aria-pressed="false">0.75×</button><button data-r="0.5" aria-pressed="false">0.5×</button></div>
        </div>
        <div class="nav">
          <span class="count" id="count"></span>
          <button class="btn back" id="prev" aria-label="Previous clip" title="Previous clip"><svg><use href="#i-prev"/></svg></button>
          <button class="btn primary" id="next">Next clip<svg><use href="#i-next"/></svg></button>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="pic" id="pic"></div>
      <div class="en" id="en"></div>
      <div class="uaw" id="ua"></div>
      <div class="tip" id="tip">
        <button class="btn" id="tipbtn" aria-expanded="false">💡 What’s happening?</button>
        <p class="note off" id="note"></p>
      </div>
    </section>
  </main>
  <section class="edit" id="edit" hidden></section>
  <!-- The YouTube player's rules want links to YouTube's Terms and Google's Privacy Policy: they stay, behind a quiet ⓘ. -->
  <footer class="foot"><button id="about" aria-expanded="false" aria-label="About these clips" title="About these clips">ⓘ</button>
    <span id="credits" hidden>Clips found with <a href="https://captionsearch.app" target="_blank" rel="noopener">Caption Search</a> and <a href="https://youglish.com" target="_blank" rel="noopener">YouGlish.com</a>, played from YouTube (<a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms</a> · <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>).</span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
