<title>Some, Any, No, Every</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
  /* One idea per screen. A word = start + ending: the start carries the colour
     (some = amber, any = indigo, no = rose, every = teal), the ending says person / thing / place.
     The background glow follows the part of the lesson. */
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --ink: #161b26;
    --muted: #697186;
    --line: #dde1e9;
    --some: #a85400;
    --some-soft: #ffdcae;
    --any: #3443c4;
    --any-soft: #d9defe;
    --no: #b0275f;
    --no-soft: #fdd3e4;
    --every: #0e7c74;
    --every-soft: #c2ece6;
    --ok: #1d8549;
    --ok-soft: #d3f2df;
    --bad: #c3372b;
    --f-disp: "Unbounded", "Arial Black", system-ui, sans-serif;
    --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a;
      --surface: #1a1f2a;
      --ink: #eef1f7;
      --muted: #8c94a8;
      --line: #2b313e;
      --some: #ffb757;
      --some-soft: #4d3313;
      --any: #9ca7ff;
      --any-soft: #262d5e;
      --no: #ff8dbb;
      --no-soft: #4e1c34;
      --every: #5fd3c8;
      --every-soft: #17423f;
      --ok: #5fd394;
      --ok-soft: #173d29;
      --bad: #ff7d70;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a;
    --surface: #1a1f2a;
    --ink: #eef1f7;
    --muted: #8c94a8;
    --line: #2b313e;
    --some: #ffb757;
    --some-soft: #4d3313;
    --any: #9ca7ff;
    --any-soft: #262d5e;
    --no: #ff8dbb;
    --no-soft: #4e1c34;
    --every: #5fd3c8;
    --every-soft: #17423f;
    --ok: #5fd394;
    --ok-soft: #173d29;
    --bad: #ff7d70;
    color-scheme: dark;
  }

  html { box-sizing: border-box; height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    --c: var(--ink);
    --glow: var(--line);
  }
  body[data-mode="some"]  { --c: var(--some);  --glow: var(--some-soft); }
  body[data-mode="any"]   { --c: var(--any);   --glow: var(--any-soft); }
  body[data-mode="no"]    { --c: var(--no);    --glow: var(--no-soft); }
  body[data-mode="every"] { --c: var(--every); --glow: var(--every-soft); }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(55% 45% at 50% 46%, color-mix(in srgb, var(--glow) 70%, transparent), transparent 75%);
    transition: background .4s;
  }

  #stage {
    height: 100%;
    display: grid;
    place-items: center;
    padding-block: 56px 104px;
    overflow-y: auto;
    text-align: center;
  }
  .slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2.5vh, 28px);
    width: 100%;
    max-width: 1100px;
    min-width: 0;
    animation: rise .3s cubic-bezier(.2, .7, .3, 1);
  }
  .slide.wide { max-width: 680px; }
  .slide.table { max-width: 900px; }
  .slide > * { max-width: 100%; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  p { margin: 0; }

  .xl, .l { font-family: var(--f-disp); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .xl { font-size: clamp(2.5rem, 11vw, 7.5rem); }
  .l  { font-size: clamp(1.8rem, 6.2vw, 4.4rem); }
  .m  { font-size: clamp(1.75rem, 5.6vw, 4.2rem); font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
  .formula {
    font-size: clamp(1rem, 2.6vw, 1.5rem);
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .pic { font-family: var(--f-emoji); font-size: clamp(3.2rem, 12vw, 6.4rem); line-height: 1.1; }

  .hl { color: var(--k); background: linear-gradient(transparent 56%, var(--ks) 56%); padding: 0 .05em; border-radius: .12em; }
  .hl.s { --k: var(--some);  --ks: var(--some-soft); }
  .hl.a { --k: var(--any);   --ks: var(--any-soft); }
  .hl.n { --k: var(--no);    --ks: var(--no-soft); }
  .hl.e { --k: var(--every); --ks: var(--every-soft); }
  .x { color: var(--muted); text-decoration: line-through; text-decoration-thickness: .07em; }
  .ok-mark { color: var(--ok); }

  .uk {
    display: block;
    text-wrap: balance;
    font-size: clamp(1.1rem, 3vw, 1.9rem);
    font-weight: 600;
    color: var(--ink);
    visibility: hidden;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .uk.on { visibility: visible; opacity: 1; transform: none; }
  .uk.s { font-size: .8em; font-weight: 600; color: var(--muted); }
  .tag {
    display: inline-block;
    margin-right: .6em;
    vertical-align: .15em;
    font-size: .55em;
    font-weight: 800;
    letter-spacing: .12em;
    padding: .35em .6em;
    border-radius: 999px;
    color: var(--c);
    background: color-mix(in srgb, var(--glow) 80%, transparent);
  }
  .hint { font-size: clamp(1rem, 2.6vw, 1.6rem); font-weight: 600; color: var(--muted); }

  input {
    font: inherit;
    color: var(--c);
    background: transparent;
    border: none;
    border-bottom: .07em solid var(--line);
    border-radius: 0;
    outline: none;
    text-align: center;
    padding: 0 .1em;
    min-width: 2.5ch;
    max-width: 100%;
  }
  input:focus { border-bottom-color: var(--c); }
  input.ok { color: var(--ok); border-bottom-color: var(--ok); }
  input.bad { color: var(--bad); border-bottom-color: var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .answer { font-size: clamp(1rem, 2.8vw, 1.7rem); font-weight: 700; color: var(--ok); min-height: 1.4em; }

  .blank { display: inline-block; min-width: 3.5ch; line-height: 1.1; border-bottom: .07em solid var(--line); }
  .blank.ok { color: var(--ok); border-bottom-color: var(--ok); padding: 0 .1em; }

  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px clamp(14px, 4vw, 40px); width: 100%; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
  .tile {
    font: 700 clamp(1rem, 2.6vw, 1.35rem)/1.2 var(--f-body);
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: .7em .6em;
    cursor: pointer;
    overflow-wrap: anywhere;
    transition: border-color .15s, background .15s, opacity .3s;
  }
  .opts .tile { min-width: min(8em, 42%); padding: .75em 1.1em; font-size: clamp(1.1rem, 3vw, 1.6rem); }
  .tile:hover { border-color: var(--muted); }
  .tile.sel { border-color: var(--c); background: color-mix(in srgb, var(--glow) 50%, var(--surface)); }
  .tile.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); opacity: .6; cursor: default; }
  .opts .tile.done { opacity: 1; }
  .tile.bad { color: var(--bad); border-color: var(--bad); animation: shake .3s; }
  .tile:disabled:not(.done) { opacity: .45; cursor: default; }

  .grid {
    display: grid;
    grid-template-columns: auto repeat(3, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
    font-size: clamp(.75rem, 2.3vw, 1.25rem);
  }
  .grid > div {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: .25em;
    min-width: 0;
    padding: .7em .25em;
    border-radius: 12px;
    background: var(--surface);
    font-weight: 700;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .grid > .h { background: transparent; color: var(--muted); padding-block: .2em; }
  .grid > .rh { background: transparent; align-items: flex-end; text-align: right; font-family: var(--f-disp); padding-right: .4em; }
  .grid .rh small { font-family: var(--f-body); color: var(--muted); font-size: .75em; font-weight: 700; }
  .grid .ic { font-family: var(--f-emoji); font-size: 1.5em; }

  #bar {
    position: fixed;
    left: 0;
    top: env(safe-area-inset-top, 0px);
    height: 4px;
    width: 0;
    background: var(--c);
    border-radius: 0 4px 4px 0;
    transition: width .3s, background .3s;
  }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .nav {
    width: 48px;
    height: 48px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
  }
  .nav:hover { border-color: var(--muted); }
  .nav:disabled { opacity: .35; cursor: default; }
  #act {
    font: 700 1rem/1 var(--f-body);
    letter-spacing: .02em;
    color: var(--surface);
    background: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 15px 26px;
    cursor: pointer;
  }
  #act[aria-pressed="true"] { color: var(--ink); background: var(--glow); }
  #act[hidden] { display: block !important; visibility: hidden; }
  button:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<main id="stage" aria-live="polite"></main>
<div id="bar"></div>
<div class="dock">
  <button class="nav" id="prev" aria-label="Back">&#8592;</button>
  <button id="act" type="button" hidden>Translate</button>
  <button class="nav" id="next" aria-label="Next">&#8594;</button>
</div>

<script>
// Slide kinds: text (rule or sentence, optional picture), word (start + ending), table (summary),
// pick (tap the right word), fill (type the blank ___), match (connect to Ukrainian).
// [s:…] some, [a:…] any, [n:…] no, [e:…] every: coloured like their part of the lesson.
const T = (h, uk, size = 'l', pic) => ({ t: 'text', h, uk, size, pic });
const W = (pre, end, uk, word = pre + end) => ({ t: 'word', pre, end, uk, word });
const P = (q, o, a) => ({ t: 'pick', q, o, a });
const F = (q, a, hint) => ({ t: 'fill', q, a: [].concat(a), hint });
const KEY = { some: 's', any: 'a', no: 'n', every: 'e' };
const OK = ' <span class="ok-mark">✓</span>';

const parts = [
  ['base', [
    T('[s:some]one · [a:any]thing<br>[n:no]where · [e:every]body', 'хтось, щось, ніде, усі… Як їх не плутати?', 'l'),
    T('-one / -body', '= людина (хто?)', 'xl', '🧍'),
    T('-thing', '= річ (що?)', 'xl', '📦'),
    T('-where', '= місце (де? куди?)', 'xl', '📍'),
    T('-one = -body', 'someone = somebody, anyone = anybody. Різниці немає!', 'l'),
  ]],
  ['some', [
    T('[s:some]', 'some… = хтось, щось, десь', 'xl'),
    T('[s:some] → <b>+</b> sentences', 'some — у стверджувальних реченнях (+)', 'l'),
    W('some', 'one', 'хтось'),
    W('some', 'body', 'хтось'),
    W('some', 'thing', 'щось'),
    W('some', 'where', 'десь, кудись'),
    T('[s:Some]one is at the door.', 'Хтось стоїть за дверима.', 'm'),
    T('I want [s:some]thing to eat.', 'Я хочу щось поїсти.', 'm'),
    T("Let's go [s:some]where.", 'Ходімо кудись.', 'm'),
  ]],
  ['any', [
    T('[a:any]', 'any… = хтось? щось? · ніхто, нічого (з not)', 'xl'),
    T('[a:any] → <b>?</b> and <b>not</b>', 'any — у питаннях (?) і запереченнях (not)', 'l'),
    W('any', 'one', 'хтось? · з not → ніхто'),
    W('any', 'body', 'хтось? · з not → ніхто'),
    W('any', 'thing', 'щось? · з not → нічого'),
    W('any', 'where', 'десь? · з not → ніде'),
    T('Is [a:any]one here?', 'Тут є хтось?', 'm'),
    T('Do you want [a:any]thing?', 'Ти хочеш щось?', 'm'),
    T("I don't know [a:any]one here.", 'Я нікого тут не знаю.', 'm'),
    T("I can't find it [a:any]where.", 'Я ніде не можу це знайти.', 'm'),
    T('хтось<b>?</b> → [a:any]one<b>?</b>', 'Українською «хтось?», а англійською — anyone?', 'l'),
    T('But:<br>Would you like [s:some]thing to drink?', 'Але коли пропонуєш (Would you like…?) — some. Хочеш щось попити?', 'm'),
    T('You can sit [a:any]where.', 'Сідай будь-де. any у «+» реченні = будь-хто, будь-що, будь-де.', 'm'),
  ]],
  ['no', [
    T('[n:no]', 'no… = ніхто, нічого, ніде', 'xl'),
    T('[n:no] = not + [a:any]', 'no = not any', 'l'),
    W('no', 'one', 'ніхто', 'no one'),
    W('no', 'body', 'ніхто'),
    W('no', 'thing', 'ніщо, нічого'),
    W('no', 'where', 'ніде, нікуди'),
    T(`[n:no] one${OK}<br><span class="x">noone</span>`, 'no one — два слова! А nobody, nothing, nowhere — одне.', 'l'),
    T('[n:No]body knows.', 'Ніхто не знає.', 'm'),
    T('There is [n:no]thing in the box.', 'У коробці нічого немає.', 'm'),
    T('Only <b>one</b> NO!', 'В англійському реченні — тільки одне заперечення.', 'l'),
    T(`I don't see [a:any]thing.${OK}<br>I see [n:no]thing.${OK}<br><span class="x">I don't see nothing.</span>`, 'Я нічого не бачу. Українською два «не», англійською — одне.', 'm'),
  ]],
  ['every', [
    T('[e:every]', 'every… = усі, все, всюди', 'xl'),
    W('every', 'one', 'усі, кожен'),
    W('every', 'body', 'усі, кожен'),
    W('every', 'thing', 'все'),
    W('every', 'where', 'всюди, скрізь'),
    T('[e:Every]one <b>is</b> here.', 'Усі тут.', 'm'),
    T(`[e:every]one <b>is</b>${OK}<br><span class="x">everyone are</span>`, 'everyone — як he / she: is, has, likes', 'l'),
    T('[e:Every]thing is OK.', 'Все гаразд.', 'm'),
    T('We looked [e:every]where.', 'Ми шукали всюди.', 'm'),
  ]],
  ['mix', [
    { t: 'table', rows: [
      ['some', '+', [['[s:some]one<br>[s:some]body', 'хтось'], ['[s:some]thing', 'щось'], ['[s:some]where', 'десь']]],
      ['any', '? · not', [['[a:any]one<br>[a:any]body', 'хтось? · ніхто'], ['[a:any]thing', 'щось? · нічого'], ['[a:any]where', 'десь? · ніде']]],
      ['no', 'none', [['[n:no] one<br>[n:no]body', 'ніхто'], ['[n:no]thing', 'нічого'], ['[n:no]where', 'ніде']]],
      ['every', 'all', [['[e:every]one<br>[e:every]body', 'усі'], ['[e:every]thing', 'все'], ['[e:every]where', 'всюди']]],
    ] },
    F('some + one = ___', 'someone'),
    F('any + thing = ___', 'anything'),
    F('no + where = ___', 'nowhere'),
    F('every + body = ___', 'everybody'),
    F('no + one = ___', 'no one'),
    P('___ is at the door.', ['Someone', 'Anyone'], 'Someone'),
    P('Does ___ know the answer?', ['someone', 'anyone'], 'anyone'),
    P('I want ___ to eat.', ['something', 'anything'], 'something'),
    P("I don't have ___ to do.", ['something', 'anything'], 'anything'),
    P("Let's go ___ nice.", ['somewhere', 'anywhere'], 'somewhere'),
    P("I can't find my phone ___.", ['somewhere', 'anywhere'], 'anywhere'),
    P("I don't see ___.", ['anything', 'nothing'], 'anything'),
    P("___ knows. It's a secret!", ['Nobody', 'Anybody'], 'Nobody'),
    P("There is ___ in the box. It's empty.", ['anything', 'nothing'], 'nothing'),
    P("___ is happy. It's a holiday!", ['Everyone', 'Anyone'], 'Everyone'),
    P('Everyone ___ here.', ['is', 'are'], 'is'),
    P('We looked ___. No keys!', ['everywhere', 'anywhere'], 'everywhere'),
    F('There is ___ at the door.', ['someone', 'somebody'], 'хтось'),
    F('Is there ___ in the fridge?', 'anything', 'щось'),
    F("I can't see ___.", ['anyone', 'anybody'], 'нікого'),
    F("___ is ready! Let's go!", ['everyone', 'everybody'], 'усі'),
    F('I want to go ___ warm.', 'somewhere', 'кудись'),
    F('My bag is empty. There is ___ in it.', 'nothing', 'нічого'),
    F('Did you go ___ last weekend?', 'anywhere', 'кудись'),
    F("I don't know ___ about cars.", 'anything', 'нічого'),
    F('___', 'Nobody is here.', 'nobody / is / here'),
    F('___', ["I don't know anyone.", 'I do not know anyone.'], "I / don't / know / anyone"),
    F('___', ['There is someone at the door.', "There's someone at the door."], 'there is / someone / at the door'),
    { t: 'match', pairs: [
      ['someone', 'хтось'],
      ['something', 'щось'],
      ['nowhere', 'ніде'],
      ['nobody', 'ніхто'],
      ['everything', 'все'],
      ['everywhere', 'всюди'],
    ] },
    T('Say it:<br>I want something ___.', 'Скажи: Я хочу щось …', 'm'),
    T('Ask a friend:<br>Is there anything in your bag?', 'Запитай друга: У тебе в сумці щось є?', 'm'),
    T('Great job!', 'Молодець!', 'xl'),
  ]],
];
const slides = parts.flatMap(([mode, list]) => list.map(s => ({ ...s, mode })));

const $ = s => document.querySelector(s);
const stage = $('#stage'), bar = $('#bar'), act = $('#act'), prev = $('#prev'), next = $('#next');
const hl = (k, w) => `<span class="hl ${k}">${w}</span>`;
const fmt = h => h.replace(/\[([a-z]):([^\]]+)\]/g, (_, k, w) => hl(k, w));
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/-/g, ' ').replace(/[.?!,]+$/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const ukLine = s => s.uk ? `<p class="uk" lang="uk"><span class="tag">UA</span>${s.uk}</p>` : '';
const picEl = s => s.pic ? `<p class="pic" aria-hidden="true">${s.pic}</p>` : '';

let i = 0;
let onAct = null;

function setAct(label, fn, pressed) {
  act.hidden = !fn;
  act.textContent = label || '';
  act.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  onAct = fn;
}

function toggleUk() {
  const els = stage.querySelectorAll('.uk');
  if (!els.length) return;
  const on = !els[0].classList.contains('on');
  els.forEach(el => el.classList.toggle('on', on));
  setAct(on ? 'Hide' : 'Translate', toggleUk, on);
}

// Shrink a line only when one long word is wider than the screen.
function fit() {
  stage.querySelectorAll('.xl, .l, .m').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth > el.clientWidth + 1) {
      const fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(14, fs * el.clientWidth / el.scrollWidth * 0.97) + 'px';
    }
  });
}

function render() {
  const s = slides[i];
  document.body.dataset.mode = s.mode;
  bar.style.width = ((i + 1) / slides.length * 100) + '%';
  prev.disabled = i === 0;
  next.disabled = i === slides.length - 1;
  setAct(null, null);
  stage.scrollTop = 0;

  if (s.t === 'text') {
    stage.innerHTML = `<div class="slide">${picEl(s)}<p class="${s.size}">${fmt(s.h)}</p>${ukLine(s)}</div>`;
  } else if (s.t === 'word') {
    const k = KEY[s.pre];
    stage.innerHTML = `<div class="slide"><p class="formula">${hl(k, s.pre)} + ${s.end}</p><p class="xl">${hl(k, s.pre)}${s.word.slice(s.pre.length)}</p>${ukLine(s)}</div>`;
  } else if (s.t === 'table') {
    const head = `<div class="h"></div>` + [['🧍', 'person'], ['📦', 'thing'], ['📍', 'place']]
      .map(([e, w]) => `<div class="h"><span class="ic" aria-hidden="true">${e}</span>${w}</div>`).join('');
    const rows = s.rows.map(([pre, sign, cells]) =>
      `<div class="rh">${hl(KEY[pre], pre)}<small>${sign}</small></div>` +
      cells.map(([en, ua]) => `<div><span>${fmt(en)}</span><span class="uk s" lang="uk">${ua}</span></div>`).join('')).join('');
    stage.innerHTML = `<div class="slide table"><div class="grid">${head}${rows}</div></div>`;
  } else if (s.t === 'fill') {
    renderFill(s);
  } else if (s.t === 'pick') {
    renderPick(s);
  } else if (s.t === 'match') {
    renderMatch(s);
  }
  if (s.t !== 'fill' && stage.querySelector('.uk')) setAct('Translate', toggleUk, false);
  fit();
}

function renderPick(s) {
  const q = fmt(s.q).replace('___', '<span class="blank" id="blank"></span>');
  stage.innerHTML = `<div class="slide wide"><p class="m">${q}</p><div class="opts">${s.o.map(o => `<button type="button" class="tile opt">${o}</button>`).join('')}</div></div>`;
  const blank = $('#blank'), btns = [...stage.querySelectorAll('.opt')];
  btns.forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    if (b.textContent === s.a) {
      blank.textContent = s.a;
      blank.classList.add('ok');
      b.classList.add('done');
      btns.forEach(x => { x.disabled = true; });
      setAct('Next →', () => go(1));
      setTimeout(() => { if (b.isConnected) go(1); }, 1100);
    } else {
      b.classList.add('bad');
      b.disabled = true;
    }
  }));
}

function renderFill(s) {
  const whole = s.q === '___';
  const len = Math.max(...s.a.map(x => x.length)) + 1;
  const width = whole ? 'min(22ch, 100%)' : len + 'ch';
  const input = `<input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer" style="width:${width}">`;
  const hint = s.hint ? `<p class="hint">(${s.hint})</p>` : '';
  stage.innerHTML = `<div class="slide${whole ? ' wide' : ''}"><p class="m">${s.q.replace('___', input)}</p>${hint}<p class="answer" id="ans"></p></div>`;

  const el = $('#in');
  let tries = 0, done = false;
  const check = () => {
    if (done) return go(1);
    if (!el.value.trim()) return el.focus();
    if (s.a.some(a => norm(a) === norm(el.value))) {
      done = true;
      el.className = 'ok';
      el.readOnly = true;
      setAct('Next →', check);
      setTimeout(() => { if (el.isConnected) go(1); }, 1000);
    } else {
      tries++;
      el.className = '';
      void el.offsetWidth;
      el.className = 'bad';
      if (tries >= 2) $('#ans').textContent = s.a[0];
      el.focus();
    }
  };
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  el.addEventListener('input', () => { if (!done) el.className = ''; });
  setAct('Check', check);
  setTimeout(() => el.focus({ preventScroll: true }), 60);
}

function renderMatch(s) {
  const tiles = (side, k) => shuffle(s.pairs.map((p, n) => ({ n, w: p[k] })))
    .map(o => `<button type="button" class="tile" data-side="${side}" data-n="${o.n}">${o.w}</button>`).join('');
  stage.innerHTML = `<div class="slide wide"><div class="match"><div class="col">${tiles('en', 0)}</div><div class="col" lang="uk">${tiles('ua', 1)}</div></div></div>`;

  let sel = null, matched = 0;
  stage.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    if (t.classList.contains('done')) return;
    t.classList.remove('bad');
    if (!sel || sel.dataset.side === t.dataset.side) {
      if (sel) sel.classList.remove('sel');
      sel = sel === t ? null : t;
      if (sel) sel.classList.add('sel');
      return;
    }
    const a = sel, b = t;
    sel = null;
    a.classList.remove('sel');
    if (a.dataset.n === b.dataset.n) {
      [a, b].forEach(x => { x.classList.remove('bad'); x.classList.add('done'); x.disabled = true; });
      if (++matched === s.pairs.length) setTimeout(() => { if (a.isConnected) go(1); }, 900);
    } else {
      [a, b].forEach(x => { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); });
    }
  }));
}

function go(d) {
  const n = i + d;
  if (n < 0 || n >= slides.length) return;
  i = n;
  render();
}

prev.onclick = () => go(-1);
next.onclick = () => go(1);
act.onclick = () => onAct && onAct();

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if (slides[i].t === 'pick' && /^[1-9]$/.test(e.key)) {
    const b = stage.querySelectorAll('.opt')[+e.key - 1];
    if (b) b.click();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  else if (e.key === 't' || e.key === 'T') toggleUk();
});

stage.addEventListener('click', e => {
  if (e.target.closest('button, input')) return;
  if (slides[i].t === 'match' || slides[i].t === 'pick') return;
  const inp = $('#in');
  if (inp && !inp.readOnly) return inp.focus();
  go(e.clientX < innerWidth / 3 ? -1 : 1);
});

let x0 = null, y0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  x0 = null;
});

addEventListener('resize', fit);
document.fonts?.ready.then(fit);

function start(data) {
  i = Math.min(Math.max(0, data.i | 0), slides.length - 1);
  render();
}
window.claude?.hot?.snapshot?.(() => ({ i }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
